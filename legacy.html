  function resetRun() {
    run.throwCount       = 0;
    run.missesRemaining  = MISSES_PER_RUN;
    run.state            = RUN_STATE.PLAYING;
    run.versusContext    = null;
    throw_.state         = STATE.IDLE;
    throw_.meterFill     = 0;
    throw_.meterDir      = 1;
    throw_.sweetCenter   = SWEET_SPOT_CENTER;
    scoring.score           = 0;
    scoring.lastThrowPoints = 0;
    scoring.lastThrowZone   = '';
    scoring.feedbackTimer   = 0;
    celebration.firedHundred = false;
    celebration.firedAllTime = false;
    celebration.phraseText   = '';
    celebration.phraseTimer  = 0;
    dustPuff.active = false;
    dustPuff.age    = 0;
    gameOverSave.completed     = false;
    gameOverSave.globalStatus  = 'idle';
    gameOverSave.globalMessage = '';
    throw_.inSweetSpot      = false;
    throw_.bounced          = false;
    throw_.angle            = 0;
    throw_.landedInPit      = false;
    resetDifficultyRamp();
    if (!settings.get('hideHowToPlay')) {
      openHowToPlayOverlay();
    }
  }

  // --- Result hook ---
  function onThrowResult(result, timestamp) {
    // Scoring
    let zone, basePoints;

    if (!result.inPit) {
      zone = 'miss';
      basePoints = PTS_MISS;
    } else {
      const norm = isLilItalyLevel()
        ? (pitScoreRight - result.x) / (pitScoreRight - pitScoreLeft)
        : (result.x - pitScoreLeft) / (pitScoreRight - pitScoreLeft);
      if (norm < ZONE_FRONT_WALL_MAX) {
        zone = 'front_wall'; basePoints = run.state === RUN_STATE.VERSUS_PLAYING ? 0 : PTS_FRONT_WALL;
      } else if (result.inSweetSpot) {
        zone = 'stick';      basePoints = PTS_STICK;
      } else if (norm > ZONE_BACK_WALL_MIN) {
        zone = 'back_wall';  basePoints = run.state === RUN_STATE.VERSUS_PLAYING ? 2 : PTS_BACK_WALL;
      } else {
        zone = 'in_pit';     basePoints = run.state === RUN_STATE.VERSUS_PLAYING ? 1 : PTS_IN_PIT;
      }
    }

    scoring.lastThrowPoints = basePoints;
    scoring.lastThrowZone  = zone;
    scoring.score         += scoring.lastThrowPoints;
    const prevScore = scoring.score - scoring.lastThrowPoints;
    triggerCelebrations(prevScore, scoring.score);
    if (run.state === RUN_STATE.VERSUS_PLAYING && zone === 'stick') {
      const idx = Math.floor(Math.random() * CELEBRATION_PHRASES.length);
      celebration.phraseText = CELEBRATION_PHRASES[idx];
      celebration.phraseTimer = CELEBRATION_PHRASE_DURATION;
    }
    scoring.feedbackTimer  = FEEDBACK_DURATION;

    run.throwCount++;
    if (zone === 'stick') {
      difficulty.meterSpeed += METER_SPEED_INCREMENT_PER_THROW;
    }
    if (run.state === RUN_STATE.VERSUS_PLAYING && run.versusContext) {
      run.versusContext.throwsRemaining = Math.max(0, run.versusContext.throwsRemaining - 1);
      run.versusContext.scoreSoFar = scoring.score;
      saveInProgressMatch(run.versusContext);
      if (run.versusContext.throwsRemaining === 0) {
        finishVersusRun();
      }
      return;
    }
    if (zone === 'miss') {
      run.missesRemaining--;
    }
    if (run.missesRemaining === 0) {
      endRun(timestamp);
    }
  }

  function spawnDustPuff(x, y) {
    dustPuff.active = true;
    dustPuff.x = x;
    dustPuff.y = y;
    dustPuff.age = 0;
    dustPuff.frame = 0;
  }

  function getPitLandingVisualYOffset() {
    if (!isPitReady()) return 0;
    const pitImg = getActivePitImg();
    const pitScale = (isLilItalyLevel() ? pitRight : canvas.width - pitLeft) / pitImg.naturalWidth;
    return getPitLandingAssetOffset() * pitScale;
  }

  function getFilteredCharacters() {
    if (activeCharacterFilter === 'new') return CHARACTERS.filter(c => NEW_CHARACTER_IDS.has(c.id));
    if (activeCharacterFilter === 'ladies') return CHARACTERS.filter(c => LADY_CHARACTER_IDS.has(c.id));
    if (activeCharacterFilter === 'champs') return CHARACTERS.filter(c => CHAMPION_IDS.has(c.id));
    return CHARACTERS;
  }

  function getCharacterFilterCount(filterId) {
    if (filterId === 'new') return CHARACTERS.filter(c => NEW_CHARACTER_IDS.has(c.id)).length;
    if (filterId === 'ladies') return CHARACTERS.filter(c => LADY_CHARACTER_IDS.has(c.id)).length;
    if (filterId === 'champs') return CHARACTERS.filter(c => CHAMPION_IDS.has(c.id)).length;
    return CHARACTERS.length;
  }

  async function fetchCardTop5(characterId) {
    const cached = flippedCardCache.get(characterId);
    if (cached && Date.now() - cached.fetchedAt < 60000) {
      flippedCardRows = cached.rows;
      flippedCardStatus = 'ready';
      return;
    }
    flippedCardStatus = 'loading';
    try {
      const rows = await window.globalScores.topN(5, { characterName: characterId });
      if (flippedCardId !== characterId) return;
      flippedCardRows = rows;
      flippedCardStatus = 'ready';
      flippedCardCache.set(characterId, { rows, fetchedAt: Date.now() });
    } catch {
      if (flippedCardId !== characterId) return;
      flippedCardRows = [];
      flippedCardStatus = 'error';
    }
  }

  function flipCard(characterId) {
    const now = lastTimestamp || performance.now();
    const fromFlipped = flippedCardId === characterId;
    const previousFlippedId = flippedCardId;
    if (flippedCardId === characterId) {
      flippedCardId = null;
      cardFlipAnimations.set(characterId, { start: now, fromFlipped, toFlipped: false });
      return;
    }
    flippedCardId = characterId;
    cardFlipAnimations.set(characterId, { start: now, fromFlipped: false, toFlipped: true });
    if (previousFlippedId) {
      cardFlipAnimations.set(previousFlippedId, { start: now, fromFlipped: true, toFlipped: false });
    }
    fetchCardTop5(characterId);
  }

  // --- Input ---
  function chooseCharacter(index) {
    selectedCharacterId = CHARACTERS[index].id;
    characterReady = false;
    characterImg.src = CHARACTERS[index].sprite;
    loadLevelImages();
    run.state = RUN_STATE.LEVEL_SELECT;
    flippedCardId = null;
    levelTileRects = [];
  }

  function chooseLevel(index) {
    loadLevelImages();
    selectedLevelId = LEVELS[index].id;
    backgroundImg = levelImages[selectedLevelId];
    backgroundReady = backgroundImg.complete && backgroundImg.naturalWidth > 0;
    if (!backgroundReady) {
      backgroundImg.onload = () => { backgroundReady = true; };
    }
    updateLayout();
    resetRun();
  }

  function pointerInRect(r) {
    return !!r
      && lastPointerX >= r.x && lastPointerX <= r.x + r.w
      && lastPointerY >= r.y && lastPointerY <= r.y + r.h;
  }

  function onPressStart() {
    if (run.state === RUN_STATE.USERNAME) return;
    if (run.state === RUN_STATE.HOME) {
      return;
    }
    if (run.state === RUN_STATE.LEVEL_SELECT) {
      if (pointerInRect(levelBackRect)) {
        loadHeroImages();
        run.state = RUN_STATE.SELECTING;
        flippedCardId = null;
        levelTileRects = [];
        levelBackRect = null;
        return;
      }
      for (let i = 0; i < levelTileRects.length; i++) {
        if (pointerInRect(levelTileRects[i])) {
          chooseLevel(i);
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.SELECTING) {
      if (pointerInRect(selectHomeRect)) {
        run.state = RUN_STATE.HOME;
        charSelectScrollY = 0;
        flippedCardId = null;
        return;
      }
      for (let i = 0; i < filterRects.length; i++) {
        const filter = filterRects[i];
        if (pointerInRect(filter)) {
          activeCharacterFilter = activeCharacterFilter === filter.id ? null : filter.id;
          charSelectScrollY = 0;
          flippedCardId = null;
          return;
        }
      }
      for (let i = 0; i < cardExpandBtnRects.length; i++) {
        const btn = cardExpandBtnRects[i];
        if (pointerInRect(btn)) {
          openImageZoomOverlay(btn.id);
          return;
        }
      }
      for (let i = 0; i < cardFlipBtnRects.length; i++) {
        const btn = cardFlipBtnRects[i];
        if (pointerInRect(btn)) {
          flipCard(btn.id);
          return;
        }
      }
      if (pointerInRect(cardBackLeaderboardRect)) {
        leaderboardCharacterFilter = cardBackLeaderboardRect.characterId;
        openLeaderboard(RUN_STATE.SELECTING, true);
        return;
      }
      for (let i = 0; i < tileRects.length; i++) {
        const tile = tileRects[i];
        if (tile.y + tile.h <= charSelectGridTop || tile.y >= charSelectGridBottom) continue;
        if (flippedCardId === tile.id) continue;
        if (pointerInRect(tile)) {
          chooseCharacter(tile.index);
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.GAME_OVER) {
      if (lastTimestamp !== null && lastTimestamp - run.gameOverTime < GAME_OVER_GUARD) return;
      if (pointerInRect(gameOverLeaderboardRect)) {
        openLeaderboard(RUN_STATE.GAME_OVER);
        return;
      }
      if (pointerInRect(gameOverChangeRect)) {
        loadHeroImages();
        run.state = RUN_STATE.SELECTING;
        charSelectScrollY = 0;
        flippedCardId = null;
        tileRects = [];
        gameOverChangeRect = null;
        return;
      }
      resetRun();
      return;
    }
    if (run.state === RUN_STATE.LEADERBOARD) {
      if (leaderboardScopeRects.daily && pointerInRect(leaderboardScopeRects.daily)) {
        if (leaderboardScope !== 'daily') {
          leaderboardScope = 'daily';
          leaderboardScrollY = 0;
          fetchGlobalLeaderboard();
        }
        return;
      }
      if (leaderboardScopeRects.all && pointerInRect(leaderboardScopeRects.all)) {
        if (leaderboardScope !== 'all') {
          leaderboardScope = 'all';
          leaderboardScrollY = 0;
          fetchGlobalLeaderboard();
        }
        return;
      }
      if (pointerInRect(leaderboardBackRect)) {
        closeLeaderboard();
        return;
      }
      return;
    }
    if (run.state === RUN_STATE.VERSUS_HOME) {
      if (pointerInRect(versusHelpRect)) {
        openVersusHowToPlayOverlay();
        return;
      }
      if (pointerInRect(versusHomeBackRect)) {
        run.state = RUN_STATE.HOME;
        stopVersusPolling();
        return;
      }
      if (pointerInRect(versusChallengeByNameRect)) {
        openChallengeByUsernameOverlay();
        return;
      }
      if (pointerInRect(versusHistoryOpenRect)) {
        openVersusHistory();
        return;
      }
      for (let i = 0; i < versusRankRects.length; i++) {
        const item = versusRankRects[i];
        if (pointerInRect(item)) {
          openChallengePlayerOverlay(item.name);
          return;
        }
      }
      for (let i = 0; i < versusMatchRects.length; i++) {
        const item = versusMatchRects[i];
        if (pointerInRect(item)) {
          const match = item.match;
          const side = getMatchSide(match);
          if (!side && !match.recipient_name) {
            openAcceptMatchOverlay(match);
          } else if (side && !isMyMatchScoreDone(match)) {
            if (side === 'recipient' && !match.recipient_character_id) {
              openVersusRecipientPickOverlay(match);
            } else {
              startVersusMatch(match, side);
            }
          } else if (bothScoresDone(match)) {
            versusCurrentMatch = match;
            run.state = RUN_STATE.VERSUS_RESULT;
            markResultSeen(match.id);
            fetchVersusHome(true);
          } else {
            versusCurrentMatch = match;
            run.state = RUN_STATE.VERSUS_WAITING;
            startVersusPolling(match.id);
          }
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.VERSUS_WAITING) {
      if (pointerInRect(versusWaitingBackRect)) {
        run.state = RUN_STATE.VERSUS_HOME;
        stopVersusPolling();
        fetchVersusHome(true);
        startVersusHomePolling();
      }
      return;
    }
    if (run.state === RUN_STATE.VERSUS_HISTORY) {
      if (pointerInRect(versusHistoryBackRect)) {
        run.state = RUN_STATE.VERSUS_HOME;
        fetchVersusHome(true);
        startVersusHomePolling();
      }
      return;
    }
    if (run.state === RUN_STATE.VERSUS_RESULT) {
      if (pointerInRect(versusResultBackRect)) {
        run.state = RUN_STATE.VERSUS_HOME;
        fetchVersusHome(true);
        startVersusHomePolling();
      }
      return;
    }
    if (run.state === RUN_STATE.HALL_OF_FAME) {
      if (pointerInRect(hallOfFameBackRect)) {
        run.state = RUN_STATE.HOME;
        hallOfFameBackRect = null;
        return;
      }
      return;
    }
    if (run.state === RUN_STATE.PLAYER_STATS) {
      for (let i = 0; i < playerStatsRowHitRects.length; i++) {
        const hit = playerStatsRowHitRects[i];
        if (pointerInRect(hit.rect)) {
          playerStatsReturnScrollY = playerStatsScrollY;
          openPlayerDetail(hit.name);
          return;
        }
      }
      if (pointerInRect(playerStatsBackRect)) {
        run.state = RUN_STATE.HOME;
        playerStatsBackRect = null;
        return;
      }
      return;
    }
    if (run.state === RUN_STATE.PLAYER_DETAIL) {
      if (pointerInRect(playerDetailBackRect)) {
        run.state = RUN_STATE.PLAYER_STATS;
        playerStatsScrollY = playerStatsReturnScrollY;
        playerDetailBackRect = null;
        return;
      }
      return;
    }
    // PLAYING — throw logic
    if (run.state !== RUN_STATE.PLAYING && run.state !== RUN_STATE.VERSUS_PLAYING) return;
    if (settingsGearRect && settingsGearRect.active && pointerInRect(settingsGearRect)) {
      openSettingsOverlay();
      return;
    }
    if (isDevMode()) {
      for (let i = 0; i < devTestButtonRects.length; i++) {
        const btn = devTestButtonRects[i];
        if (pointerInRect(btn)) {
          triggerDevTest(btn.action);
          return;
        }
      }
    }
    if (throw_.state !== STATE.IDLE) return;
    throw_.state     = STATE.CHARGING;
    throw_.meterFill = 0;
    throw_.meterDir  = 1;
    throw_.sweetCenter = SWEET_CENTER_MIN + Math.random() * (SWEET_CENTER_MAX - SWEET_CENTER_MIN);
    updateSweetSpotBounds();
    throw_.inSweetSpot = false;
  }

  function onPressEnd() {
    if (throw_.state !== STATE.CHARGING) return;
    const f = throw_.meterFill;
    const sweetCenter = throw_.sweetCenter;
    throw_.inSweetSpot = f >= difficulty.sweetSpotMin && f <= difficulty.sweetSpotMax;
    let throwMultiplier;
    if (f < sweetCenter) {
      throwMultiplier = THROW_MULT_MIN + (f / sweetCenter) * (1 - THROW_MULT_MIN);
    } else {
      const overPower = (f - sweetCenter) / (1 - sweetCenter);
      throwMultiplier = 1 + overPower * overPower * (THROW_MULT_MAX - 1);
    }
    throw_.state = STATE.FLYING;

    // Launch from player's hand height (top of player rect)
    const pitDistance = pitCenterX - playerX;
    throw_.originX    = playerX;
    throw_.originY    = playerY - 50;
    throw_.landingX   = playerX + pitDistance * throwMultiplier;
    throw_.landingY   = groundY;
    throw_.peakHeight = Math.abs(pitDistance) * THROW_PEAK_RATIO;
    throw_.duration   = THROW_DURATION;
    throw_.shovelX    = throw_.originX;
    throw_.shovelY    = throw_.originY;
    throw_.flightTime = 0;
    throw_.bounced    = false;
    throw_.angle      = 0;
    throw_.landedInPit = false;
  }

  let lastPointerX = 0;
  let lastPointerY = 0;
  let selectDragStartedInGrid = false;
  let selectDragScrolling = false;
  let selectDragLastY = 0;
  let selectDragTotal = 0;
  let leaderboardDragStartedInList = false;
  let leaderboardDragScrolling = false;
  let leaderboardDragLastY = 0;
  let leaderboardDragTotal = 0;

  function isInCharacterGrid(y) {
    return y >= charSelectGridTop && y <= charSelectGridBottom;
  }

  function isInLeaderboardList(y) {
    return y >= leaderboardListTop && y <= leaderboardListBottom;
  }

  function isInHallOfFameList(y) {
    return y >= hallOfFameListTop && y <= hallOfFameListBottom;
  }

  function isInPlayerStatsList(y) {
    return y >= playerStatsListTop && y <= playerStatsListBottom;
  }

  function isInPlayerDetailList(y) {
    return y >= playerDetailListTop && y <= playerDetailListBottom;
  }

  function startSelectDrag(y) {
    selectDragStartedInGrid = run.state === RUN_STATE.SELECTING && isInCharacterGrid(y);
    selectDragScrolling = false;
    selectDragLastY = y;
    selectDragTotal = 0;
    return selectDragStartedInGrid;
  }

  function moveSelectDrag(y) {
    if (!selectDragStartedInGrid) return;
    const dy = y - selectDragLastY;
    selectDragLastY = y;
    selectDragTotal += Math.abs(dy);
    charSelectScrollY -= dy;
    if (selectDragTotal > 8) selectDragScrolling = true;
  }

  function finishSelectDrag() {
    const shouldSelect = selectDragStartedInGrid && !selectDragScrolling;
    selectDragStartedInGrid = false;
    selectDragScrolling = false;
    selectDragTotal = 0;
    return shouldSelect;
  }

  function startLeaderboardDrag(y) {
    leaderboardDragStartedInList = (run.state === RUN_STATE.LEADERBOARD && isInLeaderboardList(y))
      || (run.state === RUN_STATE.HALL_OF_FAME && isInHallOfFameList(y))
      || (run.state === RUN_STATE.PLAYER_STATS && isInPlayerStatsList(y))
      || (run.state === RUN_STATE.PLAYER_DETAIL && isInPlayerDetailList(y))
      || (run.state === RUN_STATE.VERSUS_HOME && y >= versusHomeListTop && y <= versusHomeListBottom)
      || (run.state === RUN_STATE.VERSUS_HISTORY && y >= versusHistoryListTop && y <= versusHistoryListBottom);
    leaderboardDragScrolling = false;
    leaderboardDragLastY = y;
    leaderboardDragTotal = 0;
    return leaderboardDragStartedInList;
  }

  function moveLeaderboardDrag(y) {
    if (!leaderboardDragStartedInList) return;
    const dy = y - leaderboardDragLastY;
    leaderboardDragLastY = y;
    leaderboardDragTotal += Math.abs(dy);
    if (run.state === RUN_STATE.HALL_OF_FAME) {
      hallOfFameScrollY -= dy;
    } else if (run.state === RUN_STATE.PLAYER_STATS) {
      playerStatsScrollY -= dy;
    } else if (run.state === RUN_STATE.PLAYER_DETAIL) {
      playerDetailScrollY -= dy;
    } else if (run.state === RUN_STATE.VERSUS_HOME) {
      versusHomeScrollY -= dy;
    } else if (run.state === RUN_STATE.VERSUS_HISTORY) {
      versusHistoryScrollY -= dy;
    } else {
      leaderboardScrollY -= dy;
    }
    if (leaderboardDragTotal > 8) leaderboardDragScrolling = true;
  }

  function finishLeaderboardDrag() {
    const shouldClick = leaderboardDragStartedInList && !leaderboardDragScrolling;
    leaderboardDragStartedInList = false;
    leaderboardDragScrolling = false;
    leaderboardDragTotal = 0;
    return shouldClick;
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    lastPointerX = t.clientX;
    lastPointerY = t.clientY;
    if (!startSelectDrag(lastPointerY) && !startLeaderboardDrag(lastPointerY)) onPressStart();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    lastPointerX = t.clientX;
    lastPointerY = t.clientY;
    moveSelectDrag(lastPointerY);
    moveLeaderboardDrag(lastPointerY);
  }, { passive: false });
  canvas.addEventListener('touchend',   (e) => {
    e.preventDefault();
    if (finishSelectDrag()) {
      onPressStart();
      return;
    }
    if (finishLeaderboardDrag()) {
      onPressStart();
      return;
    }
    onPressEnd();
  }, { passive: false });
  canvas.addEventListener('mousedown', (e) => {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    if (!startSelectDrag(lastPointerY) && !startLeaderboardDrag(lastPointerY)) onPressStart();
  });
  canvas.addEventListener('mousemove', (e) => {
    if (e.buttons !== 1) return;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    moveSelectDrag(lastPointerY);
    moveLeaderboardDrag(lastPointerY);
  });
  canvas.addEventListener('mouseup', (e) => {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    if (finishSelectDrag()) {
      onPressStart();
      return;
    }
    if (finishLeaderboardDrag()) {
      onPressStart();
      return;
    }
    onPressEnd();
  });
  canvas.addEventListener('wheel', (e) => {
    if (run.state === RUN_STATE.SELECTING) {
      charSelectScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.LEADERBOARD) {
      leaderboardScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.HALL_OF_FAME) {
      hallOfFameScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.PLAYER_STATS) {
      playerStatsScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.PLAYER_DETAIL) {
      playerDetailScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.VERSUS_HOME) {
      versusHomeScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.VERSUS_HISTORY) {
      versusHistoryScrollY += e.deltaY;
    } else {
      return;
    }
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && imageZoomOverlayEl) {
      e.preventDefault();
      e.stopPropagation();
      closeImageZoomOverlay();
    }
  });

  // --- Game loop ---
  function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (lastTimestamp === null) { lastTimestamp = timestamp; }
    const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50ms
    lastTimestamp = timestamp;

    if (run.state === RUN_STATE.USERNAME) {
      showLanding();
      if (!usernameOverlayEl) openUsernameOverlay(RUN_STATE.HOME);
    } else if (run.state === RUN_STATE.HOME) {
      showLanding();
    } else if (run.state === RUN_STATE.SELECTING) {
      hideLanding();
      drawCharacterSelect(timestamp);
    } else if (run.state === RUN_STATE.LEVEL_SELECT) {
      hideLanding();
      drawLevelSelect(timestamp);
    } else if (run.state === RUN_STATE.PLAYING) {
      hideLanding();
      update(dt, timestamp);
      draw();
    } else if (run.state === RUN_STATE.VERSUS_PLAYING) {
      update(dt, timestamp);
      draw();
    } else if (run.state === RUN_STATE.GAME_OVER) {
      hideLanding();
      draw();
      drawGameOverOverlay();
    } else if (run.state === RUN_STATE.LEADERBOARD) {
      hideLanding();
      drawLeaderboard();
    } else if (run.state === RUN_STATE.VERSUS_HOME) {
      drawVersusHome(timestamp);
    } else if (run.state === RUN_STATE.VERSUS_WAITING) {
      drawVersusWaiting(timestamp);
    } else if (run.state === RUN_STATE.VERSUS_RESULT) {
      drawVersusResult(timestamp);
    } else if (run.state === RUN_STATE.VERSUS_HISTORY) {
      drawVersusHistory(timestamp);
    } else if (run.state === RUN_STATE.HALL_OF_FAME) {
      hideLanding();
      drawHallOfFame(timestamp);
    } else if (run.state === RUN_STATE.PLAYER_STATS) {
      hideLanding();
      drawPlayerStats(timestamp);
    } else if (run.state === RUN_STATE.PLAYER_DETAIL) {
      hideLanding();
      drawPlayerDetail(timestamp);
    }
  }

  function update(dt, timestamp) {
    // Oscillate meter while charging
    if (throw_.state === STATE.CHARGING) {
      throw_.meterFill += throw_.meterDir * difficulty.meterSpeed * dt;
      if (throw_.meterFill >= 1) { throw_.meterFill = 1; throw_.meterDir = -1; }
      if (throw_.meterFill <= 0) { throw_.meterFill = 0; throw_.meterDir =  1; }
    }

    // Update projectile position
    if (throw_.state === STATE.FLYING) {
      throw_.flightTime += dt;
      const t = Math.min(throw_.flightTime / throw_.duration, 1);
      throw_.shovelX = throw_.originX + (throw_.landingX - throw_.originX) * t;
      throw_.shovelY = throw_.originY + (throw_.landingY - throw_.originY) * t
        - throw_.peakHeight * 4 * t * (1 - t);

      // Wall bounce
      const overshoots = isLilItalyLevel() ? throw_.landingX < pitLeft : throw_.landingX > pitRight;
      const crossedWall = isLilItalyLevel() ? throw_.shovelX <= wallX : throw_.shovelX >= wallX;
      if (!throw_.bounced && overshoots && crossedWall) {
        if (throw_.shovelY >= wallTopY && throw_.shovelY < groundY) {
          const bounceLandingX = isLilItalyLevel()
            ? wallX + Math.abs(throw_.landingX - wallX) * BOUNCE_DAMPING
            : wallX - Math.abs(throw_.landingX - wallX) * BOUNCE_DAMPING;
          throw_.shovelX = wallX;
          throw_.originX = throw_.shovelX;
          throw_.originY = throw_.shovelY;
          throw_.landingX = bounceLandingX;
          throw_.peakHeight = Math.abs(throw_.landingX - throw_.originX) * THROW_PEAK_RATIO;
          throw_.duration = Math.max(THROW_DURATION * (1 - t), 0.12);
          throw_.flightTime = 0;
        }
        throw_.bounced = true;
      }

      throw_.angle += SHOVEL_ROT_RATE * dt;

      // Landing detection
      if (t >= 1) {
        throw_.shovelY = groundY;
        const shovelHitRadius = SHOVEL_RENDER_W / 2;
        const shovelLeft = throw_.shovelX - shovelHitRadius;
        const shovelRight = throw_.shovelX + shovelHitRadius;
        const landedInPit = shovelRight >= pitScoreLeft && shovelLeft <= pitScoreRight;

        const result = {
          x:           landedInPit ? clamp(throw_.shovelX, pitScoreLeft, pitScoreRight) : throw_.shovelX,
          inPit:       landedInPit,
          inSweetSpot: throw_.inSweetSpot
        };
        if (result.inPit) {
          spawnDustPuff(result.x, groundY - getPitLandingVisualYOffset());
        }
        onThrowResult(result, timestamp);
        if (scoring.lastThrowZone === 'stick') {
          throw_.angle = SHOVEL_STICK_ANGLE;
        }

        throw_.state        = STATE.RESETTING;
        throw_.landedInPit  = result.inPit;
        throw_.resetEndTime = timestamp + RESET_DELAY;
      }
    }

    // Feedback timer
    if (scoring.feedbackTimer > 0) {
      scoring.feedbackTimer = Math.max(0, scoring.feedbackTimer - dt * 1000);
    }
    if (celebration.phraseTimer > 0) {
      celebration.phraseTimer = Math.max(0, celebration.phraseTimer - dt * 1000);
    }

    if (dustPuff.active) {
      dustPuff.age += dt * 1000;
      dustPuff.frame = Math.min(
        DUST_PUFF_FRAMES - 1,
        Math.floor((dustPuff.age / DUST_PUFF_DURATION) * DUST_PUFF_FRAMES)
      );
      if (dustPuff.age >= DUST_PUFF_DURATION) {
        dustPuff.active = false;
      }
    }

    // Reset after pause
    if (throw_.state === STATE.RESETTING && timestamp >= throw_.resetEndTime) {
      throw_.meterFill = 0;
      throw_.meterDir  = 1;
      throw_.state     = STATE.IDLE;
      updateDifficulty(); // apply difficulty for next throw (throwCount already incremented)
    }
  }

  // --- Draw helpers ---
  function drawText(text, x, y, fontSize, color, align, bold, italic = false) {
    ctx.font = `${italic ? 'italic ' : ''}${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  function truncateText(text, maxWidth, fontSize, bold = false) {
    const value = String(text || '');
    if (maxWidth <= 0) return '';
    ctx.font = `${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    if (ctx.measureText(value).width <= maxWidth) return value;

    const ellipsis = '...';
    const ellipsisW = ctx.measureText(ellipsis).width;
    if (ellipsisW > maxWidth) return '';

    let lo = 0;
    let hi = value.length;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      if (ctx.measureText(value.slice(0, mid) + ellipsis).width <= maxWidth) {
        lo = mid;
      } else {
        hi = mid - 1;
      }
    }
    return value.slice(0, lo) + ellipsis;
  }

  function drawLifeIcons(x, y) {
    const iconW = Math.max(20, Math.min(LIFE_ICON_W, canvas.width * 0.06));
    const activeShovelImg = selectedCharacterId && CHAMPION_IDS.has(selectedCharacterId) && champShovelReady
      ? champShovelImg
      : (shovelReady ? shovelImg : null);
    const iconH = activeShovelImg
      ? iconW * activeShovelImg.naturalHeight / activeShovelImg.naturalWidth
      : iconW;
    const gap = 8;

    for (let i = 0; i < MISSES_PER_RUN; i++) {
      ctx.save();
      ctx.globalAlpha = i < run.missesRemaining ? 1 : 0.25;
      if (activeShovelImg) {
        ctx.drawImage(activeShovelImg, x + i * (iconW + gap), y - iconH, iconW, iconH);
      } else {
        ctx.fillStyle = THEME.textMute;
        ctx.fillRect(x + i * (iconW + gap), y - iconH, iconW, iconH);
      }
      ctx.restore();
    }
  }

  function drawBackground() {
    if (backgroundReady) {
      const isPortrait = canvas.height > canvas.width;
      const coverScale = Math.max(canvas.width / backgroundImg.naturalWidth, canvas.height / backgroundImg.naturalHeight);
      const scale = isPortrait
        ? coverScale * 0.72
        : coverScale;
      const dW = backgroundImg.naturalWidth * scale;
      const dH = backgroundImg.naturalHeight * scale;
      const dx = (canvas.width - dW) / 2;
      const dy = isPortrait
        ? canvas.height - dH
        : (canvas.height - dH) / 2;
      ctx.drawImage(backgroundImg, dx, dy, dW, dH);
    } else {
      ctx.fillStyle = THEME.bgTop;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  function getPitDrawRect() {
    const drawImg = getActivePitImg();
    const dW = isLilItalyLevel() ? pitRight : canvas.width - pitLeft;
    const dH = dW * drawImg.naturalHeight / drawImg.naturalWidth;
    return {
      img: drawImg,
      x: isLilItalyLevel() ? 0 : pitLeft,
      y: groundY - dH,
      w: dW,
      h: dH
    };
  }

  function drawPitLayer() {
    const rect = getPitDrawRect();
    ctx.drawImage(rect.img, rect.x, rect.y, rect.w, rect.h);
  }

  function drawPitFrontOverlay() {
    const rect = getPitDrawRect();
    const frontAssetH = getPitFrontOverlayAssetOffset();
    const overlayH = frontAssetH * (rect.w / rect.img.naturalWidth);
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y + rect.h - overlayH, rect.w, overlayH);
    ctx.clip();
    ctx.drawImage(rect.img, rect.x, rect.y, rect.w, rect.h);
    ctx.restore();
  }

  function drawPitFallback() {
    const pitDepth = 20;
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2;
    ctx.strokeRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
  }

  function drawDustPuff() {
    if (!dustPuff.active) return;
    if (dustPuffReady) {
      const frameW = dustPuffImg.naturalWidth / DUST_PUFF_FRAMES;
      ctx.drawImage(
        dustPuffImg,
        dustPuff.frame * frameW, 0, frameW, dustPuffImg.naturalHeight,
        dustPuff.x - DUST_PUFF_W / 2, dustPuff.y - DUST_PUFF_H / 2,
        DUST_PUFF_W, DUST_PUFF_H
      );
    } else {
      ctx.fillStyle = 'rgba(94, 107, 74, 0.7)';
      ctx.beginPath();
      ctx.ellipse(dustPuff.x, dustPuff.y, DUST_PUFF_W / 2, DUST_PUFF_H / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    drawBackground();

    // Pit back
    if (isPitReady()) {
      drawPitLayer();
    } else {
      drawPitFallback();
    }

    // Player
    if (characterReady) {
      const frame = throw_.state === STATE.CHARGING ? 1
                 : throw_.state === STATE.FLYING   ? 2
                 : 0;
      const renderW = CHARACTER_RENDER_H * (CHARACTER_FRAME_W / CHARACTER_FRAME_H);
      if (isLilItalyLevel()) {
        ctx.save();
        ctx.translate(playerX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(
          characterImg,
          frame * CHARACTER_FRAME_W, 0, CHARACTER_FRAME_W, CHARACTER_FRAME_H,
          -renderW / 2, playerY - CHARACTER_RENDER_H,
          renderW, CHARACTER_RENDER_H
        );
        ctx.restore();
      } else {
        ctx.drawImage(
          characterImg,
          frame * CHARACTER_FRAME_W, 0, CHARACTER_FRAME_W, CHARACTER_FRAME_H,
          playerX - renderW / 2, playerY - CHARACTER_RENDER_H,
          renderW, CHARACTER_RENDER_H
        );
      }
    } else if (!selectedCharacterId) {
      const pW = 28, pH = 50;
      ctx.fillStyle = '#e07b39';
      ctx.fillRect(playerX - pW / 2, playerY - pH, pW, pH);
    }

    // Shovel (during flight and brief reset pause)
    if (throw_.state === STATE.FLYING || throw_.state === STATE.RESETTING) {
      ctx.save();
      const shovelDrawY = throw_.state === STATE.RESETTING && throw_.landedInPit
        ? throw_.shovelY - getPitLandingVisualYOffset()
        : throw_.shovelY;
      ctx.translate(throw_.shovelX, shovelDrawY);
      ctx.rotate(throw_.angle);
      const activeShovelImg = selectedCharacterId && CHAMPION_IDS.has(selectedCharacterId) && champShovelReady
        ? champShovelImg
        : (shovelReady ? shovelImg : null);
      if (activeShovelImg) {
        const dH = SHOVEL_RENDER_W * activeShovelImg.naturalHeight / activeShovelImg.naturalWidth;
        ctx.drawImage(activeShovelImg, -SHOVEL_RENDER_W / 2, -dH / 2, SHOVEL_RENDER_W, dH);
      } else {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-14, -3, 20, 6);
        ctx.fillStyle = THEME.textMute;
        ctx.fillRect(6, -5, 8, 10);
      }
      ctx.restore();
    }

    // Pit front rim
    if (isPitReady() && throw_.state === STATE.RESETTING && throw_.landedInPit) {
      drawPitFrontOverlay();
    }

    drawDustPuff();
    drawDevBoundaries();

    // Throw meter (visible while charging or flying)
    if (throw_.state === STATE.CHARGING || throw_.state === STATE.FLYING) {
      drawMeter();
    }

    // Idle hint
    if (throw_.state === STATE.IDLE) {
      drawText('Hold to charge', canvas.width / 2, canvas.height - Math.max(28, canvas.height * 0.06),
        Math.max(16, Math.floor(canvas.width * 0.042)), THEME.textMute, 'center', false);
    }

    // HUD: left-stacked score -> lives
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const hudFontSize = isPhoneLandscape
      ? Math.max(28, Math.floor(canvas.height * 0.08))
      : Math.max(24, Math.floor(canvas.width * 0.07));
    const hudY = safeTop + hudFontSize;
    const subFontSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.04))
      : Math.max(16, Math.floor(canvas.width * 0.045));
    const gearSize = Math.max(28, Math.floor(canvas.width * 0.06));
    const gearX = canvas.width - HUD_PAD - gearSize;
    const gearY = safeTop;
    drawText(scoring.score, HUD_PAD, hudY, hudFontSize, THEME.text, 'left', true);
    if (run.state === RUN_STATE.VERSUS_PLAYING && run.versusContext) {
      drawText(`${run.versusContext.throwsRemaining} throws`, HUD_PAD, hudY + subFontSize + 8, subFontSize, THEME.textMute, 'left', false);
    } else {
      drawLifeIcons(HUD_PAD, hudY + subFontSize + 8);
    }
    drawDevTestButtons(HUD_PAD, hudY + subFontSize + 18);
    const playerName = username.get();
    const highScoreBadge = isScoreLeaderUsername(playerName) ? `${HIGH_SCORE_BADGE} ` : '';
    ctx.save();
    ctx.textBaseline = 'middle';
    drawText(`${highScoreBadge}${playerName}`, gearX - 8, gearY + gearSize / 2, subFontSize, THEME.text, 'right', true);
    ctx.restore();

    // Settings gear - top-right, drawn on every PLAYING frame
    const gearActive = throw_.state === STATE.IDLE;
    ctx.globalAlpha = gearActive ? 1 : 0.35;
    ctx.font = `900 ${Math.round(gearSize * 0.82)}px "Font Awesome 6 Free", "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.fillStyle = THEME.text;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(faReady ? '' : '⚙️', gearX + gearSize / 2, gearY + gearSize / 2);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
    settingsGearRect = { x: gearX, y: gearY, w: gearSize, h: gearSize, active: gearActive };

    // Throw feedback text
    if (scoring.feedbackTimer > 0) {
      const alpha = Math.min(1, scoring.feedbackTimer / 500);
      ctx.globalAlpha = alpha;
      const fbFontSize = Math.max(18, Math.floor(canvas.width * 0.055));
      let zoneColor;
      if      (scoring.lastThrowZone === 'stick')      zoneColor = THEME.accent;
      else if (scoring.lastThrowZone === 'back_wall')  zoneColor = '#44dd44';
      else if (scoring.lastThrowZone === 'in_pit')     zoneColor = THEME.text;
      else if (scoring.lastThrowZone === 'front_wall') zoneColor = '#44dd44';
      else                                             zoneColor = '#ff4444';
      drawText(scoring.lastThrowZone.toUpperCase().replace('_', ' '), canvas.width / 2, groundY - 60, fbFontSize, zoneColor, 'center', true);
      if (scoring.lastThrowPoints !== 0) {
        drawText(`${scoring.lastThrowPoints > 0 ? '+' : ''}${scoring.lastThrowPoints}`, canvas.width / 2, groundY - 60 + fbFontSize + 4,
          Math.max(14, Math.floor(canvas.width * 0.04)), THEME.text, 'center', false);
      }
      ctx.globalAlpha = 1;
    }

    if (celebration.phraseTimer > 0) {
      const t = celebration.phraseTimer / CELEBRATION_PHRASE_DURATION;
      const alpha = Math.min(1, t * 1.4);
      const scaleBoost = 1 + (1 - t) * 0.25;
      const fontSize = Math.max(48, Math.floor(canvas.width * 0.13)) * scaleBoost;
      ctx.globalAlpha = alpha;
      drawText(celebration.phraseText, canvas.width / 2, canvas.height * 0.4, fontSize, THEME.accent, 'center', true);
      ctx.globalAlpha = 1;
    }
  }

  function drawMeter() {
    const r = 4;

    // Background track
    ctx.fillStyle = THEME.surface;
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.fill();

    // Sweet-spot band
    const sweetX = meterX + meterWidth * difficulty.sweetSpotMin;
    const sweetW = meterWidth * (difficulty.sweetSpotMax - difficulty.sweetSpotMin);
    ctx.fillStyle = 'rgba(255, 220, 0, 0.25)';
    ctx.beginPath();
    ctx.roundRect(sweetX, meterY, sweetW, meterHeight, r);
    ctx.fill();

    // Fill bar (left-to-right)
    const fillW = meterWidth * throw_.meterFill;
    const inSweetSpot = throw_.meterFill >= difficulty.sweetSpotMin && throw_.meterFill <= difficulty.sweetSpotMax;
    ctx.fillStyle = inSweetSpot ? '#ffe600' : '#ff6b35';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, fillW, meterHeight, r);
    ctx.fill();

    // Border
    ctx.strokeStyle = THEME.text;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.stroke();

    // Label
    const labelAbove = settings.get('meterPosition') === 'bottom';
    const powerY = labelAbove ? meterY - 18 : meterY + meterHeight + 14;
    const speedY = labelAbove ? meterY - 4  : meterY + meterHeight + 30;
    drawText('POWER', meterX + meterWidth / 2, powerY, 14, THEME.text, 'center', false);
    drawText(`SPEED ${difficulty.meterSpeed.toFixed(2)}`, meterX + meterWidth / 2, speedY, 12, THEME.text, 'center', false);
  }

  function drawDevBoundaries() {
    if (!isDevMode()) return;

    ctx.save();
    ctx.lineCap = 'butt';

    ctx.fillStyle = 'rgba(0, 229, 255, 0.12)';
    ctx.fillRect(pitScoreLeft, groundY - 18, pitScoreRight - pitScoreLeft, 18);
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.95)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 5]);
    ctx.beginPath();
    ctx.moveTo(pitScoreLeft, groundY - 34);
    ctx.lineTo(pitScoreLeft, groundY + 18);
    ctx.moveTo(pitScoreRight, groundY - 34);
    ctx.lineTo(pitScoreRight, groundY + 18);
    ctx.moveTo(pitScoreLeft, groundY);
    ctx.lineTo(pitScoreRight, groundY);
    ctx.stroke();

    const wallStripX = isLilItalyLevel() ? 0 : wallX;
    const wallStripW = isLilItalyLevel() ? wallX : canvas.width - wallX;
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 64, 129, 0.16)';
    ctx.fillRect(wallStripX, wallTopY, wallStripW, groundY - wallTopY);
    ctx.strokeStyle = 'rgba(255, 64, 129, 0.95)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(wallX, wallTopY);
    ctx.lineTo(wallX, groundY);
    ctx.stroke();

    ctx.restore();
  }

  function drawButton(rect, label, active = false) {
    const textColor = rect.textColor || THEME.text;
    ctx.fillStyle = rect.fillStyle || (active ? THEME.secondary : THEME.surface);
    ctx.strokeStyle = THEME.text;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(rect.x, rect.y, rect.w, rect.h, rect.radius || 6);
    ctx.fill();
    if (rect.stroke) ctx.stroke();
    const fontSize = rect.fontSize || Math.max(14, Math.min(18, Math.floor(canvas.width * 0.04)));
    if (rect.centered) {
      ctx.save();
      ctx.textBaseline = 'middle';
      drawText(label, rect.x + rect.w / 2, rect.y + rect.h / 2, fontSize, textColor, 'center', false);
      ctx.restore();
      return;
    }
    drawText(label, rect.x + rect.w / 2, rect.y + rect.h * 0.64,
      fontSize, textColor, 'center', false);
  }

  function drawDevTestButtons(x, y) {
    devTestButtonRects = [];
    if (!isDevMode()) return;

    const buttonH = Math.max(26, Math.floor(canvas.height * 0.045));
    const buttonW = Math.max(48, Math.floor(canvas.width * 0.13));
    const gap = 6;
    const fontSize = Math.max(11, Math.floor(buttonH * 0.45));
    const buttons = [
      { label: '+20', action: 'score20' },
      { label: '+100', action: 'score100' },
      { label: '👑', action: 'crown' },
      { label: '0', action: 'resetScore' },
      { label: 'Clear', action: 'resetShovels' },
    ];
    buttons.forEach((button, index) => {
      const rect = {
        x: x + index * (buttonW + gap),
        y,
        w: buttonW,
        h: buttonH,
        fontSize,
        centered: true,
        fillStyle: 'rgba(34, 40, 31, 0.72)',
        textColor: THEME.accent,
        stroke: true,
      };
      devTestButtonRects.push({ ...rect, action: button.action });
      drawButton(rect, button.label);
    });
  }

  function drawCharacterFilterButton(rect, filter, count, active = false) {
    const fontSize = rect.fontSize || 12;
    ctx.fillStyle = rect.fillStyle || (active ? THEME.surface : THEME.surface2);
    ctx.beginPath();
    ctx.roundRect(rect.x, rect.y, rect.w, rect.h, rect.radius || rect.h / 2);
    ctx.fill();

    ctx.font = `bold ${Math.round(fontSize)}px sans-serif`;
    const countText = String(count);
    const badgePad = Math.max(7, Math.floor(rect.h * 0.25));
    const badgeH = Math.max(18, rect.h - 8);
    const badgeW = Math.max(badgeH, ctx.measureText(countText).width + badgePad * 2);
    const badgeX = rect.x + rect.w - badgeW - 5;
    const badgeY = rect.y + (rect.h - badgeH) / 2;

    ctx.fillStyle = active ? THEME.surface2 : THEME.bgBottom;
    ctx.beginPath();
    ctx.roundRect(badgeX, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();

    ctx.save();
    ctx.textBaseline = 'middle';
    drawText(filter.label, rect.x + (badgeX - rect.x) / 2, rect.y + rect.h / 2, fontSize, THEME.text, 'center', true);
    drawText(countText, badgeX + badgeW / 2, rect.y + rect.h / 2, fontSize, THEME.text, 'center', true);
    ctx.restore();
  }

  function hashString(value) {
    let hash = 0;
    for (let i = 0; i < value.length; i++) {
      hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
    }
    return Math.abs(hash);
  }

  function drawRoundedBand(outerX, outerY, outerW, outerH, outerR, innerX, innerY, innerW, innerH, innerR, fillStyle) {
    ctx.fillStyle = fillStyle;
    ctx.beginPath();
    ctx.roundRect(outerX, outerY, outerW, outerH, outerR);
    ctx.roundRect(innerX, innerY, innerW, innerH, innerR);
    ctx.fill('evenodd');
  }

  function drawDiamond(cx, cy, size) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size, cy);
    ctx.lineTo(cx, cy + size);
    ctx.lineTo(cx - size, cy);
    ctx.closePath();
  }

  function drawWoodFrame(ctx, x, y, w, h, t, seed = '') {
    ctx.save();

    const tOuter = Math.max(2, Math.floor(t * 0.30));
    const tInner = Math.max(2, Math.floor(t * 0.20));
    const tMid = Math.max(2, t - tOuter - tInner);
    const outerR = 8;
    const midX = x + tOuter;
    const midY = y + tOuter;
    const midW = w - tOuter * 2;
    const midH = h - tOuter * 2;
    const midR = Math.max(2, outerR - tOuter);
    const innerBandX = midX + tMid;
    const innerBandY = midY + tMid;
    const innerBandW = midW - tMid * 2;
    const innerBandH = midH - tMid * 2;
    const innerBandR = Math.max(2, midR - tMid);
    const openingX = innerBandX + tInner;
    const openingY = innerBandY + tInner;
    const openingW = innerBandW - tInner * 2;
    const openingH = innerBandH - tInner * 2;
    const openingR = Math.max(2, innerBandR - tInner);

    drawRoundedBand(x, y, w, h, outerR, midX, midY, midW, midH, midR, FRAME_WOOD_DARK);

    const midGradient = ctx.createLinearGradient(x, midY, x, midY + midH);
    midGradient.addColorStop(0, FRAME_WOOD_LIGHT);
    midGradient.addColorStop(0.5, FRAME_WOOD_MID);
    midGradient.addColorStop(1, FRAME_WOOD_DARK);
    drawRoundedBand(midX, midY, midW, midH, midR, innerBandX, innerBandY, innerBandW, innerBandH, innerBandR, midGradient);

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(midX, midY, midW, midH, midR);
    ctx.roundRect(innerBandX, innerBandY, innerBandW, innerBandH, innerBandR);
    ctx.clip('evenodd');
    ctx.strokeStyle = FRAME_GRAIN;
    ctx.lineWidth = 1;
    const hash = hashString(seed);
    const grainCount = 3 + (hash % 3);
    for (let i = 0; i < grainCount; i++) {
      const offset = ((hash >> (i * 3)) & 15) / 16;
      const gy = midY + 2 + ((i + offset) / grainCount) * Math.max(1, midH - 4);
      ctx.beginPath();
      ctx.moveTo(midX + 2, gy);
      ctx.lineTo(midX + midW - 2, gy);
      ctx.stroke();
    }
    ctx.restore();

    drawRoundedBand(innerBandX, innerBandY, innerBandW, innerBandH, innerBandR, openingX, openingY, openingW, openingH, openingR, FRAME_WOOD_LIGHT);

    ctx.lineWidth = 1;
    ctx.strokeStyle = FRAME_HIGHLIGHT;
    ctx.beginPath();
    ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, outerR);
    ctx.stroke();
    ctx.strokeStyle = FRAME_SHADOW;
    ctx.beginPath();
    ctx.roundRect(midX + 0.5, midY + 0.5, midW - 1, midH - 1, midR);
    ctx.stroke();
    ctx.strokeStyle = FRAME_HIGHLIGHT;
    ctx.beginPath();
    ctx.roundRect(innerBandX + 0.5, innerBandY + 0.5, innerBandW - 1, innerBandH - 1, innerBandR);
    ctx.stroke();
    ctx.strokeStyle = FRAME_SHADOW;
    ctx.beginPath();
    ctx.roundRect(openingX + 0.5, openingY + 0.5, openingW - 1, openingH - 1, openingR);
    ctx.stroke();

    if (w >= FRAME_ORNAMENT_MIN_TILE_W) {
      const ornamentSize = Math.max(4, Math.floor(t * 0.28));
      const centers = [
        [midX, midY],
        [midX + midW, midY],
        [midX + midW, midY + midH],
        [midX, midY + midH],
      ];
      centers.forEach(([cx, cy]) => {
        drawDiamond(cx, cy, ornamentSize);
        ctx.fillStyle = FRAME_ORNAMENT;
        ctx.fill();
        ctx.strokeStyle = FRAME_SHADOW;
        ctx.stroke();
        ctx.strokeStyle = FRAME_HIGHLIGHT;
        ctx.beginPath();
        ctx.moveTo(cx, cy - ornamentSize);
        ctx.lineTo(cx - ornamentSize, cy);
        ctx.stroke();
      });
    }

    ctx.restore();
  }

  function drawNamePlaque(ctx, cx, topY, w, h, label) {
    ctx.save();

    const x = cx - w / 2;
    const y = topY;
    const centerY = y + h / 2;
    const radius = Math.min(PLAQUE_RADIUS, h / 2);
    const gradient = ctx.createLinearGradient(x, y, x, y + h);
    gradient.addColorStop(0, PLAQUE_METAL_LIGHT);
    gradient.addColorStop(0.35, PLAQUE_METAL_BRIGHT);
    gradient.addColorStop(0.65, PLAQUE_METAL_MID);
    gradient.addColorStop(1, PLAQUE_METAL_DARK);

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, radius);
    ctx.fill();

    ctx.strokeStyle = PLAQUE_HIGHLIGHT;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + radius, y + 0.5);
    ctx.lineTo(x + w - radius, y + 0.5);
    ctx.stroke();
    ctx.strokeStyle = PLAQUE_SHADOW;
    ctx.beginPath();
    ctx.moveTo(x + radius, y + h - 0.5);
    ctx.lineTo(x + w - radius, y + h - 0.5);
    ctx.stroke();

    const rivetR = Math.max(2, h * 0.14);
    const rivetInset = h * 0.45;
    [x + rivetInset, x + w - rivetInset].forEach(rivetX => {
      ctx.fillStyle = PLAQUE_RIVET;
      ctx.beginPath();
      ctx.arc(rivetX, centerY, rivetR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = PLAQUE_HIGHLIGHT;
      ctx.beginPath();
      ctx.arc(rivetX - rivetR * 0.35, centerY - rivetR * 0.35, Math.max(1, rivetR * 0.3), 0, Math.PI * 2);
      ctx.fill();
    });

    const fontSize = Math.max(9, Math.floor(h * 0.62));
    const text = truncateText(label, w - h * 1.6, fontSize);
    drawText(text, cx, centerY + fontSize * 0.35 + 1, fontSize, PLAQUE_ENGRAVE_LIGHT, 'center', true);
    drawText(text, cx, centerY + fontSize * 0.35, fontSize, PLAQUE_ENGRAVE_DARK, 'center', true);

    ctx.restore();
  }

  function formatScoreDate(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' });
  }

          ctx.fillStyle = HIGHLIGHT_FILL;
          ctx.fillRect(leftX - 8, y - rowSize - 4, scoreX - leftX + 16, lineH);

  function formatVersusRecord(record) {
    const r = record || { wins: 0, losses: 0, ties: 0, total: 0 };
    if (!r.total) return 'Record: no matches yet';
    const base = `Record: ${r.wins}W · ${r.losses}L`;
    return r.ties > 0 ? `${base} · ${r.ties}T` : base;
  }

  function versusRowStatus(match) {
    const side = getMatchSide(match);
    if (bothScoresDone(match)) return isUnseenCompletedMatch(match) ? 'Click to view' : 'complete';
    if (!side && !match.recipient_name) return 'Click to accept';
    if (!side) return 'pending';
    if (!isMyMatchScoreDone(match)) return 'Click to play';
    if (!isOpponentScoreDone(match)) return `waiting for ${getOpponentName(match)}`;
    return 'complete';
  }

  const versusHeroCache = new Map();
  function getVersusHeroImage(characterId) {
    if (!characterId) return null;
    const existingPreload = heroImages[characterId];
    if (existingPreload) return existingPreload;
    if (versusHeroCache.has(characterId)) return versusHeroCache.get(characterId);
    const def = CHARACTERS.find(c => c.id === characterId);
    if (!def) { versusHeroCache.set(characterId, null); return null; }
    const img = new Image();
    img.src = def.hero;
    versusHeroCache.set(characterId, img);
    return img;
  }

  function drawVersusResult(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const theirScore = mySide === 'challenger' ? match.recipient_score : match.challenger_score;
    let headline = 'TIE';
    if (myScore > theirScore) headline = 'WIN';

        ctx.roundRect(x - portraitSize / 2, portraitY, portraitSize, portraitSize, 8);
        ctx.clip();
        const s = Math.max(portraitSize / img.naturalWidth, portraitSize / img.naturalHeight);

        const h = img.naturalHeight * s;

        ctx.beginPath();
        ctx.roundRect(x - portraitSize / 2, portraitY, portraitSize, portraitSize, 8);

      drawText('Date', dateX, y, headerSize, THEME.textMute, 'right', true);
      y += lineH;
      topScores.forEach((row, index) => {
        if (y + lineH >= listTop && y <= listBottom) {
          if (index % 2 === 1) {
            ctx.fillStyle = THEME.surface2;
            ctx.fillRect(rankX - 8, y - rowSize - 4, rightX - rankX + 16, lineH);
          }
          const dateText = formatScoreDate(row.created_at);
          ctx.font = `${Math.round(rowSize)}px sans-serif`;
          const dateW = Math.max(54, ctx.measureText(dateText).width);
          drawText(`${index + 1}.`, rankX, y, rowSize, THEME.textMute, 'left', false);
          drawText(Number(row.score) || 0, scoreX, y, rowSize, THEME.accent, 'right', true);
          drawText(truncateText(row.character_name || 'Unknown', dateX - dateW - scoreCharacterX - 12, rowSize), scoreCharacterX, y, rowSize, THEME.text, 'left', false);
          drawText(dateText, dateX, y, rowSize, THEME.textMute, 'right', false);
        }
        y += lineH;
      });
      ctx.restore();
    }

    playerDetailBackRect = { x: pad, y: canvas.height - pad - backH, w: canvas.width - pad * 2, h: backH };
    drawButton({ ...playerDetailBackRect, fontSize: isPhoneLandscape ? 11 : 13 }, 'Back');
  }

  function drawCharacterSelect(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = THEME.bgTop;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.04))
      : Math.max(16, Math.floor(canvas.width * 0.042));
    const pad = isPhoneLandscape ? 10 : 16;
    selectHomeRect = {
      x: pad,
      y: Math.max(8, safeTop * 0.45),
      w: isPhoneLandscape ? 32 : 38,
      h: isPhoneLandscape ? 28 : 32,
      fontSize: isPhoneLandscape ? 17 : 20,
      centered: true
    };
    drawButton(selectHomeRect, '');
    ctx.save();
    ctx.font = `900 ${Math.round(selectHomeRect.fontSize)}px "Font Awesome 6 Free", sans-serif`;
    ctx.fillStyle = THEME.text;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(faReady ? '' : '←', selectHomeRect.x + selectHomeRect.w / 2, selectHomeRect.y + selectHomeRect.h / 2);
    ctx.restore();


    const isPortrait = canvas.height > canvas.width;
    const cols = isPortrait ? 2 : 4;
    const visibleCharacters = getFilteredCharacters();
    const rows = Math.ceil(visibleCharacters.length / cols);

    const titleY = selectHomeRect.y + selectHomeRect.h / 2 + titleSize * 0.35;
    drawText('Choose your character', canvas.width / 2, titleY, titleSize, THEME.text, 'center', true);

    const topOffset = selectHomeRect.y + selectHomeRect.h + (isPhoneLandscape ? Math.floor(pad * 0.55) : pad);
    const filterGap = isPhoneLandscape ? 6 : 8;
    const filterButtonH = isPhoneLandscape ? 26 : 30;
    const filterButtonW = (canvas.width - pad * 2 - filterGap * (CHARACTER_FILTERS.length - 1)) / CHARACTER_FILTERS.length;
    const filterW = filterButtonW * CHARACTER_FILTERS.length + filterGap * (CHARACTER_FILTERS.length - 1);
    const filterY = topOffset;
    filterRects = [];
    CHARACTER_FILTERS.forEach((filter, index) => {
      const rect = {
        id: filter.id,
        x: canvas.width / 2 - filterW / 2 + index * (filterButtonW + filterGap),
        y: filterY,
        w: filterButtonW,
        h: filterButtonH,
        fontSize: isPhoneLandscape ? 10 : 12,
        fillStyle: activeCharacterFilter === filter.id ? THEME.surface : THEME.surface2,
        radius: filterButtonH / 2,
        noStroke: true
      };
      filterRects.push(rect);
      drawCharacterFilterButton(rect, filter, getCharacterFilterCount(filter.id), activeCharacterFilter === filter.id);
    });

    const targetTileW = Math.floor(Math.min(240, (canvas.width - pad * (cols + 1)) / cols));
    const tileW = targetTileW;
    const tileH = Math.floor(tileW * 1.25);
    const gridTopPadding = isPhoneLandscape ? 6 : 10;
    charSelectGridTop = filterY + filterButtonH + pad + gridTopPadding;
    charSelectGridBottom = canvas.height - pad;
    const gridViewportH = charSelectGridBottom - charSelectGridTop;
    const totalContentH = rows * tileH + (rows - 1) * pad;
    const maxScroll = Math.max(0, totalContentH - gridViewportH);
    charSelectScrollY = Math.max(0, Math.min(charSelectScrollY, maxScroll));

    tileRects = [];
    cardFlipBtnRects = [];
    cardExpandBtnRects = [];
    cardBackLeaderboardRect = null;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, charSelectGridTop, canvas.width, gridViewportH);
    ctx.clip();
    for (let i = 0; i < visibleCharacters.length; i++) {
      const character = visibleCharacters[i];
      const characterIndex = CHARACTERS.indexOf(character);
      const col = i % cols;
      const row = Math.floor(i / cols);
      const gridW = cols * tileW + (cols - 1) * pad;
      const gridX = Math.floor((canvas.width - gridW) / 2);
      const x = gridX + col * (tileW + pad);
      const y = charSelectGridTop + row * (tileH + pad) - charSelectScrollY;
      tileRects.push({ id: character.id, index: characterIndex, x, y, w: tileW, h: tileH });

      const flipAnim = cardFlipAnimations.get(character.id);
      let flipProgress = flipAnim ? Math.min(1, (timestamp - flipAnim.start) / CARD_FLIP_DURATION) : 1;
      if (flipProgress >= 1 && flipAnim) {
        cardFlipAnimations.delete(character.id);
        flipProgress = 1;
      }
      const isAnimatingFlip = !!flipAnim && flipProgress < 1;
      const faceFlipped = isAnimatingFlip
        ? (flipProgress < 0.5 ? flipAnim.fromFlipped : flipAnim.toFlipped)
        : flippedCardId === character.id;
      const flipScale = isAnimatingFlip ? Math.max(0.04, Math.abs(Math.cos(flipProgress * Math.PI))) : 1;

      ctx.save();
      ctx.translate(x + tileW / 2, y + tileH / 2);
      ctx.scale(flipScale, 1);
      ctx.translate(-(x + tileW / 2), -(y + tileH / 2));

      ctx.fillStyle = THEME.surface;
      ctx.strokeStyle = THEME.secondary;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, tileW, tileH, 8);
      ctx.fill();
      ctx.stroke();

      if (faceFlipped) {
        drawCardBack(x, y, tileW, tileH, character, character.id === flippedCardId);
      } else {
        const t = Math.max(FRAME_MIN_THICKNESS, Math.floor(Math.min(tileW, tileH) * FRAME_THICKNESS_RATIO));
        const innerX = x + t;
        const innerY = y + t;
        const innerW = tileW - 2 * t;
        const innerH = tileH - 2 * t;
        const innerR = Math.max(2, 6 - Math.floor(t / 4));

        drawWoodFrame(ctx, x, y, tileW, tileH, t, character.id);
        const hasNamePlaque = tileW >= PLAQUE_MIN_TILE_W;
        if (hasNamePlaque) {
          const plaqueW = Math.floor(tileW * PLAQUE_WIDTH_RATIO);
          const plaqueH = Math.max(PLAQUE_MIN_HEIGHT, Math.floor(t * PLAQUE_HEIGHT_RATIO * 6));
          const plaqueInsetY = Math.max(2, Math.floor((t - plaqueH) / 2));
          const plaqueTopY = y + plaqueInsetY;
          drawNamePlaque(ctx, x + tileW / 2, plaqueTopY, plaqueW, plaqueH, character.id);
        }

        const labelSize = isPhoneLandscape
          ? Math.max(12, Math.floor(canvas.height * 0.035))
          : Math.max(12, Math.floor(canvas.width * 0.03));
        const heroImg = heroImages[character.id];
        if (heroImg && heroImg.complete && heroImg.naturalWidth > 0) {
          const imgAspect = heroImg.naturalWidth / heroImg.naturalHeight;
          const innerAspect = innerW / innerH;
          let drawW, drawH, drawX, drawY;
          if (imgAspect > innerAspect) {
            drawH = innerH;
            drawW = drawH * imgAspect;
          } else {
            drawW = innerW;
            drawH = drawW / imgAspect;
          }
          drawX = innerX + (innerW - drawW) / 2;
          drawY = innerY + (innerH - drawH) / 2;
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(innerX, innerY, innerW, innerH, innerR);
          ctx.clip();
          ctx.drawImage(heroImg, drawX, drawY, drawW, drawH);
          ctx.restore();
        } else {
          const idSize = labelSize;
          const captionSize = Math.max(9, Math.floor(idSize * 0.7));
          const idText = truncateText(character.id, innerW - 12, idSize);
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(innerX, innerY, innerW, innerH, innerR);
          ctx.clip();
          ctx.fillStyle = THEME.surface2;
          ctx.fillRect(innerX, innerY, innerW, innerH);
          drawText(idText, innerX + innerW / 2, innerY + innerH / 2 + idSize * 0.35, idSize, THEME.textMute, 'center', false);
          if (!isPhoneLandscape) {
            drawText('Loading…', innerX + innerW / 2, innerY + innerH / 2 + idSize * 1.25, captionSize, THEME.textFaint, 'center', false);
          }
          ctx.restore();
        }

        if (NEW_CHARACTER_IDS.has(character.id)) {
          const badgeSize = Math.max(10, Math.floor(labelSize * 0.85));
          const badgeW = Math.max(42, badgeSize * 3.5);
          const badgeH = badgeSize + 8;
          ctx.fillStyle = THEME.accent;
          ctx.strokeStyle = THEME.bgBottom;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(innerX + innerW - badgeW - 7, innerY + 7, badgeW, badgeH, 4);
          ctx.fill();
          ctx.stroke();
          drawText('NEW', innerX + innerW - badgeW / 2 - 7, innerY + 7 + badgeH * 0.68, badgeSize, THEME.bgBottom, 'center', true);
        }

        const isChampion = CHAMPION_IDS.has(character.id);
        if (!hasNamePlaque) {
          drawText(character.id, innerX + 6, innerY + labelSize + 4, labelSize, THEME.text, 'left', false);
        }
        if (isChampion) {
          if (championImg.complete && championImg.naturalWidth > 0) {
            const badgeW = Math.floor(tileW * 0.78);
            const badgeH = Math.floor(tileW * 0.48);
            ctx.drawImage(championImg, x + (tileW - badgeW) / 2, y + tileH - badgeH + 4, badgeW, badgeH);
          }
        }
      }
      ctx.restore();

      const flipBtnSize = Math.max(22, Math.floor(tileW * 0.18));
      const isFlippedCard = faceFlipped;
      if (!isFlippedCard) {
        const expandSize = Math.max(22, Math.floor(tileW * 0.18));
        const expandX = x + 6;
        const expandY = y + tileH - expandSize - 6;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.roundRect(expandX, expandY, expandSize, expandSize, 6);
        ctx.fill();
        ctx.save();
        ctx.font = `900 ${Math.round(expandSize * 0.55)}px "Font Awesome 6 Free", sans-serif`;
        ctx.fillStyle = THEME.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(faReady ? '' : '⤢', expandX + expandSize / 2, expandY + expandSize / 2);
        ctx.restore();
        cardExpandBtnRects.push({
          id: character.id,
          x: expandX,
          y: expandY,
          w: expandSize,
          h: expandSize
        });
      }
      const flipBtnX = x + tileW - flipBtnSize - 6;
      const flipBtnY = isFlippedCard ? y + 6 : y + tileH - flipBtnSize - 6;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.roundRect(flipBtnX, flipBtnY, flipBtnSize, flipBtnSize, 6);
      ctx.fill();
      ctx.save();
      ctx.font = `900 ${Math.round(flipBtnSize * (isFlippedCard ? 0.72 : 0.6))}px "Font Awesome 6 Free", sans-serif`;
      ctx.fillStyle = THEME.text;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(faReady ? (isFlippedCard ? '' : '') : (isFlippedCard ? '×' : '↻'), flipBtnX + flipBtnSize / 2, flipBtnY + flipBtnSize / 2);
      ctx.restore();
      cardFlipBtnRects.push({
        id: character.id,
        x: flipBtnX,
        y: flipBtnY,
        w: flipBtnSize,
        h: flipBtnSize
      });
    }
    ctx.restore();
  }

  function drawLevelSelect(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = THEME.bgTop;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(26, Math.floor(canvas.height * 0.10))
      : Math.max(34, Math.floor(canvas.width * 0.10));
    drawText('Choose your level', canvas.width / 2, safeTop + titleSize, titleSize, THEME.text, 'center', true);

    const pad = isPhoneLandscape ? 10 : 16;
    const buttonH = Math.max(38, canvas.height * 0.06);
    levelBackRect = {
      x: pad,
      y: canvas.height - pad - buttonH,
      w: canvas.width - pad * 2,
      h: buttonH
    };
    drawButton(levelBackRect, 'Back');

    const isPortrait = canvas.height > canvas.width;
    const cols = isPortrait ? 1 : 2;
    const rows = Math.ceil(LEVELS.length / cols);
    const listTop = safeTop + titleSize + pad * 3;
    const listBottom = levelBackRect.y - pad;
    const tileW = Math.floor(Math.min(360, (canvas.width - pad * (cols + 1)) / cols));
    const tileH = Math.floor(Math.max(80, Math.min(tileW * 0.62, (listBottom - listTop - pad * (rows - 1)) / rows)));
    const gridW = cols * tileW + (cols - 1) * pad;
    const gridH = rows * tileH + (rows - 1) * pad;
    const gridX = Math.floor((canvas.width - gridW) / 2);
    const gridY = Math.floor(listTop + Math.max(0, (listBottom - listTop - gridH) / 2));

    levelTileRects = [];
    for (let i = 0; i < LEVELS.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = gridX + col * (tileW + pad);
      const y = gridY + row * (tileH + pad);
      levelTileRects.push({ id: LEVELS[i].id, x, y, w: tileW, h: tileH });

      ctx.fillStyle = THEME.surface;
      ctx.strokeStyle = THEME.secondary;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, tileW, tileH, 8);
      ctx.fill();
      ctx.stroke();

      const img = levelImages[LEVELS[i].id];
      if (img && img.complete && img.naturalWidth > 0) {
        const imgAspect = img.naturalWidth / img.naturalHeight;
        const tileAspect = tileW / tileH;
        let drawW, drawH;
        if (imgAspect > tileAspect) {
          drawH = tileH;
          drawW = drawH * imgAspect;
        } else {
          drawW = tileW;
          drawH = drawW / imgAspect;
        }
        const drawX = x + (tileW - drawW) / 2;
        const drawY = y + (tileH - drawH) / 2;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, tileW, tileH, 8);
        ctx.clip();
        ctx.drawImage(img, drawX, drawY, drawW, drawH);
        ctx.restore();
      }

      const stripH = Math.max(34, Math.floor(tileH * 0.24));
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(x, y + tileH - stripH, tileW, stripH);
      const labelSize = isPhoneLandscape
        ? Math.max(14, Math.floor(canvas.height * 0.045))
        : Math.max(16, Math.floor(canvas.width * 0.042));
      drawText(LEVELS[i].label, x + tileW / 2, y + tileH - stripH / 2 + labelSize * 0.35, labelSize, THEME.text, 'center', true);
    }
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(28, Math.floor(canvas.height * 0.11))
      : Math.max(32, Math.floor(canvas.width * 0.10));
    const scoreSize = isPhoneLandscape
      ? Math.max(18, Math.floor(canvas.height * 0.06))
      : Math.max(22, Math.floor(canvas.width * 0.06));
    const statsSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.045))
      : Math.max(16, Math.floor(canvas.width * 0.045));
    const restartSize = isPhoneLandscape
      ? Math.max(16, Math.floor(canvas.height * 0.05))
      : Math.max(18, Math.floor(canvas.width * 0.05));
    const titleY = isPhoneLandscape ? safeTop + canvas.height * 0.20 : safeTop + canvas.height * 0.34;
    const scoreY = isPhoneLandscape ? safeTop + canvas.height * 0.34 : safeTop + canvas.height * 0.43;
    const globalY = isPhoneLandscape ? safeTop + canvas.height * 0.48 : safeTop + canvas.height * 0.53;
    const buttonW = isPhoneLandscape
      ? Math.min(210, (canvas.width - HUD_PAD * 3) / 2)
      : Math.min(240, canvas.width * 0.62);
    const buttonH = Math.max(42, canvas.height * 0.07);
    const buttonGap = Math.max(8, canvas.height * 0.015);
    const topButtonY = isPhoneLandscape
      ? canvas.height - safeTop - buttonH
      : safeTop + canvas.height * 0.77;
    const restartY = isPhoneLandscape ? topButtonY - 12 : safeTop + canvas.height * 0.61;
    drawText('GAME OVER', cx, titleY,
      titleSize, THEME.text, 'center', true);
    drawText(`Score: ${scoring.score}`, cx, scoreY,
      scoreSize, THEME.accent, 'center', false);
    if (gameOverSave.globalMessage) {
      const color = gameOverSave.globalStatus === 'error' ? ERROR_COLOR : THEME.textMute;
      drawText(gameOverSave.globalMessage, cx, globalY,
        statsSize, color, 'center', false);
    }
    drawText('Tap to Play Again', cx, restartY,
      restartSize, THEME.textMute, 'center', false);
    if (isPhoneLandscape) {
      const rowX = cx - buttonW - buttonGap / 2;
      gameOverLeaderboardRect = { x: rowX, y: topButtonY, w: buttonW, h: buttonH };
      gameOverChangeRect = { x: rowX + buttonW + buttonGap, y: topButtonY, w: buttonW, h: buttonH };
    } else {
      gameOverLeaderboardRect = { x: cx - buttonW / 2, y: topButtonY, w: buttonW, h: buttonH };
      gameOverChangeRect = { x: cx - buttonW / 2, y: topButtonY + buttonH + buttonGap, w: buttonW, h: buttonH };
    }
    drawButton(gameOverLeaderboardRect, 'Leaderboard');
    drawButton(gameOverChangeRect, 'Change Character');
  }

  function handleMatchParam(attemptsRemaining = 30) {
    if (matchParamHandled || !VERSUS_ENABLED) return;
    const code = new URLSearchParams(window.location.search).get('match');
    if (!code) return;
    const name = username.get();
    if (!name) return;
    if (!window.globalScores) {
      if (attemptsRemaining > 0) setTimeout(() => handleMatchParam(attemptsRemaining - 1), 100);
      return;
    }
    matchParamHandled = true;
    window.globalScores.fetchMatchByCode(code).then(match => {
      if (new Date(match.expires_at).getTime() < Date.now()) {
        showToast('Match expired');
        return;
      }
      if (!match.recipient_name && !isSameName(match.challenger_name, name)) {
        openAcceptMatchOverlay(match);
        return;
      }
      const side = getMatchSide(match);
      if (side && !isMyMatchScoreDone(match)) {
        if (side === 'recipient' && !match.recipient_character_id) {
          openVersusRecipientPickOverlay(match);
        } else {
          startVersusMatch(match, side);
        }
      } else if (bothScoresDone(match)) {
        versusCurrentMatch = match;
        run.state = RUN_STATE.VERSUS_RESULT;
        markResultSeen(match.id);
      } else if (side) {
        versusCurrentMatch = match;
        run.state = RUN_STATE.VERSUS_WAITING;
        startVersusPolling(match.id);
      } else {
        showToast('Match unavailable');
      }
    }).catch(() => showToast('Match unavailable'));
  }

  function forfeitStaleMatchIfReady(attemptsRemaining = 20) {
    const stale = loadInProgressMatch();
    if (!stale) return;
    if (!window.globalScores) {
      if (attemptsRemaining <= 0) return;
      setTimeout(() => forfeitStaleMatchIfReady(attemptsRemaining - 1), 100);
      return;
    }
    const finalScore = stale.scoreSoFar || 0;
    window.globalScores
      .submitMatchScore(stale.matchId, stale.side, finalScore)
      .then(() => {
        clearInProgressMatch();
        showToast(`Match forfeited at ${finalScore}`);
        if (run.state === RUN_STATE.VERSUS_HOME) fetchVersusHome(true);
      })
      .catch(() => {});
  }

  // --- Init ---
  window.addEventListener('beforeunload', (e) => {
    if (run.state === RUN_STATE.PLAYING || run.state === RUN_STATE.VERSUS_PLAYING) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });
  window.addEventListener('resize', updateLayout);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastTimestamp = null;
    if (document.hidden) {
      stopVersusPolling();
    } else if (run.state === RUN_STATE.VERSUS_WAITING && versusCurrentMatch) {
      startVersusPolling(versusCurrentMatch.id);
    } else if (run.state === RUN_STATE.VERSUS_HOME) {
      fetchVersusHome(true);
      startVersusHomePolling();
    }
  });
  updateLayout();
  fetchGlobalLeaderboardWhenReady();
  forfeitStaleMatchIfReady();
  refreshVersusBadge(true);
  handleMatchParam();
  if (run.state === RUN_STATE.USERNAME) openUsernameOverlay(RUN_STATE.HOME);
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
