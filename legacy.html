  <style>
    @font-face { font-family: 'Bungee'; src: url('assets/fonts/bungee-regular.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Archivo'; src: url('assets/fonts/archivo-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Archivo'; src: url('assets/fonts/archivo-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #22281f; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #landing {
      --bg-top: #22281f;
      --bg-bottom: #0a0d0a;
      --text: #ede8d8;
      --text-mute: rgba(237, 232, 216, 0.6);
      --accent: #d97a3c;
      --accent-2: #f0a166;
      --secondary: #5e6b4a;
      --shadow: rgba(0, 0, 0, 0.42);
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-rows: 1fr auto;
      justify-items: center;
      overflow: hidden;
      background: radial-gradient(120% 80% at 50% 0%, var(--bg-top) 0%, var(--bg-top) 60%, var(--bg-bottom) 100%);
      color: var(--text);
      font-family: 'Archivo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    #landing[data-state="visible"] {
      opacity: 1;
      pointer-events: auto;
    }
    #landing.landing--instant {
      transition: none;
    }
    .landing--no-anim,
    .landing--no-anim * {
      animation: none !important;
    }
    .landing-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .landing-bg::before,
    .landing-spot {
      pointer-events: none;
    }
    .landing-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('assets/landing-noise.svg');
      opacity: 0.08;
      mix-blend-mode: overlay;
    }
    .landing-spot {
      position: absolute;
      width: 60vmax;
      height: 30vmax;
      background: linear-gradient(75deg, transparent, color-mix(in oklab, var(--accent) 12%, transparent), transparent);
      filter: blur(40px);
      animation: landingDrift 60s linear infinite;
    }
    .landing-spot--a { top: -10%; left: -30%; animation-duration: 40s; }
    .landing-spot--b { top: 30%; left: -50%; animation-duration: 80s; animation-delay: -20s; }
    .landing-spot--c { bottom: -10%; left: -20%; animation-duration: 60s; animation-delay: -40s; }
    .landing-content {
      position: relative;
      z-index: 1;
      align-self: center;
      display: grid;
      gap: clamp(16px, 3vh, 30px);
      justify-items: center;
      width: min(360px, calc(100vw - 32px));
      padding: 4vh 0;
    }
    .landing-title {
      font-family: 'Bungee', Impact, sans-serif;
      font-size: clamp(48px, 12vw, 120px);
      letter-spacing: 0.04em;
      line-height: 0.92;
      color: var(--accent);
      text-align: center;
      text-shadow:
        3px 3px 0 var(--secondary),
        6px 6px 0 var(--shadow);
      animation: landingTitleIn 280ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .landing-title span {
      display: block;
      color: var(--text);
      text-shadow:
        3px 3px 0 var(--secondary),
        6px 6px 0 var(--shadow);
    }
    .landing-player {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 8px 12px;
      border: 0;
      background: transparent;
      color: color-mix(in oklab, var(--text) 85%, transparent);
      cursor: pointer;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: landingFadeIn 240ms 120ms ease-out both;
    }
    .landing-player .name {
      min-width: 1ch;
      max-width: min(170px, 44vw);
      overflow: hidden;
      color: var(--accent);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .landing-player:hover {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .landing-player:hover::after {
      content: 'tap to edit';
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-mute);
      font-size: 10px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .landing-actions {
      display: grid;
      gap: 10px;
      width: min(320px, 100%);
    }
    .landing-btn {
      height: 54px;
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      background: color-mix(in oklab, var(--text) 8%, transparent);
      box-shadow: inset 0 -2px 0 var(--shadow);
      color: var(--text);
      cursor: pointer;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background 160ms ease, transform 160ms ease, color 160ms ease, box-shadow 160ms ease;
      animation: landingBtnIn 240ms var(--delay, 240ms) cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
    }
    .landing-btn:hover {
      background: color-mix(in oklab, var(--text) 14%, transparent);
      transform: translateY(-1px);
      box-shadow: inset 0 -2px 0 var(--shadow), 0 6px 16px var(--shadow);
    }
    .landing-btn:active {
      transform: translateY(0);
      box-shadow: inset 0 2px 0 var(--shadow);
    }
    .landing-btn--primary {
      background: var(--accent);
      color: var(--bg-bottom);
      box-shadow: inset 0 -2px 0 color-mix(in oklab, var(--accent) 60%, black);
    }
    .landing-btn--primary:hover {
      background: var(--accent-2);
      box-shadow: inset 0 -2px 0 color-mix(in oklab, var(--accent) 60%, black), 0 6px 18px color-mix(in oklab, var(--accent) 40%, transparent);
    }
    .landing-btn--ghost {
      background: transparent;
      border: 1px solid color-mix(in oklab, var(--text) 18%, transparent);
      color: var(--text-mute);
      box-shadow: none;
    }
    .landing-btn--ghost:hover {
      background: color-mix(in oklab, var(--text) 6%, transparent);
      color: var(--text);
    }
    .landing-footer {
      position: relative;
      z-index: 1;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-mute);
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    @keyframes landingDrift {
      0% { transform: translateX(0) rotate(-12deg); }
      100% { transform: translateX(180vw) rotate(-12deg); }
    }
    @keyframes landingTitleIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes landingBtnIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes landingFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (max-width: 360px) {
      .landing-content { width: min(320px, calc(100vw - 24px)); gap: 14px; }
      .landing-title { font-size: clamp(44px, 17vw, 62px); }
      .landing-btn { height: 52px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .landing-spot, .landing-title, .landing-player, .landing-btn { animation: none; }
      #landing { transition: none; }
    }
  </style>
</head>

<canvas id="gameCanvas"></canvas>
<div id="landing" data-state="hidden" aria-hidden="true">
  <div class="landing-bg" aria-hidden="true">
    <div class="landing-spot landing-spot--a"></div>
    <div class="landing-spot landing-spot--b"></div>
    <div class="landing-spot landing-spot--c"></div>
  </div>

      <span class="name" id="landing-player-name"></span>
      <i class="fa-solid fa-pen-to-square"></i>
    </button>
    <nav class="landing-actions">
      <button data-action="play" class="landing-btn landing-btn--primary" style="--delay: 240ms">Solo Mode</button>
      <button data-action="versus" id="landing-versus-button" class="landing-btn landing-btn--primary" style="--delay: 320ms">1v1 Toss-Off</button>
      <button data-action="leaderboard" class="landing-btn" style="--delay: 400ms">Leaderboard</button>
      <button data-action="hall" class="landing-btn" style="--delay: 480ms">Hall of Fame</button>
      <button data-action="stats" class="landing-btn" style="--delay: 560ms">Player Stats</button>
      <button data-action="whatsNew" class="landing-btn landing-btn--ghost" style="--delay: 640ms">What's New?</button>
    </nav>
  </main>
  <footer class="landing-footer">
    <span id="landing-version"></span>
    <span class="landing-flag">🇺🇸</span>
  </footer>
</div>

    return String(raw || '')
      .normalize('NFKC')
      .replace(/[\u0000-\u001F\u007F\u200B-\u200F\u202A-\u202E\uFEFF]/g, '')
      .trim()
      .slice(0, 20);

    return sanitizeUsername(rowName) === me;

  function showLanding() {
    if (!landingEl) return;
    updateLandingIdentity();
    updateLandingVersusButton();
    refreshVersusBadge();
    if (landingVersionEl) landingVersionEl.textContent = APP_VERSION_TAG;
    if (landingEl.dataset.state !== 'hidden') return;
    if (landingHideTimer) {
      clearTimeout(landingHideTimer);
      landingHideTimer = null;
    }
    landingEl.style.display = 'grid';
    landingEl.setAttribute('aria-hidden', 'false');
    if (landingAnimatedOnce) {
      landingEl.classList.add('landing--instant');
      landingEl.classList.add('landing--no-anim');
      landingEl.dataset.state = 'visible';
      return;
    }
    landingEl.classList.remove('landing--instant');
    landingEl.classList.remove('landing--no-anim');
    landingEl.dataset.state = 'showing';
    requestAnimationFrame(() => {
      if (landingEl.dataset.state !== 'showing') return;
      landingEl.dataset.state = 'visible';
      landingAnimatedOnce = true;
    });
  }

  function hideLanding() {
    if (!landingEl || landingEl.dataset.state === 'hidden') return;
    landingEl.dataset.state = 'hidden';
    landingEl.setAttribute('aria-hidden', 'true');
    if (landingHideTimer) clearTimeout(landingHideTimer);
    if (landingAnimatedOnce) {
      landingEl.classList.add('landing--instant');
      landingEl.style.display = 'none';
      landingHideTimer = null;
      return;
    }
    landingHideTimer = setTimeout(() => {
      if (landingEl.dataset.state === 'hidden') landingEl.style.display = 'none';

    }, 220);

        this._cache = raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : { ...DEFAULT_SETTINGS };
      } catch {
        this._cache = { ...DEFAULT_SETTINGS };
      }
      return this._cache;
    },
    get(key) { return this._load()[key]; },
    set(key, value) {
      const s = this._load();
      s[key] = value;
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {}
    },
  };

  function updateLayout() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    safeTop  = Math.max(20, canvas.height * 0.04);
    const isLandscape = canvas.width > canvas.height;
    groundY  = isLandscape ? canvas.height : canvas.height * 0.82;
    wallTopY = groundY - canvas.height * WALL_HEIGHT_FRACTION;
    playerX  = canvas.width * (isLilItalyLevel() ? 0.90 : 0.10);
    playerY  = groundY;

    pitCenterX = canvas.width * (isLilItalyLevel() ? 0.20 : 0.80);  // far end; pitLeft/pitRight set by updateDifficulty
    updateDifficulty();

    // Meter: narrowed and centered, position by setting
    meterWidth  = Math.max(220, canvas.width * METER_WIDTH_FRACTION);
    meterX      = (canvas.width - meterWidth) / 2;
    meterHeight = Math.max(36, canvas.height * METER_HEIGHT_FRACTION);

    const labelGap = 32; // room for POWER + SPEED below the bar
    const pos = settings.get('meterPosition');
    if (pos === 'middle') {
      meterY = (canvas.height - meterHeight) / 2;
    } else if (pos === 'bottom') {
      meterY = canvas.height - meterHeight - labelGap - 12;
    } else {
      const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
      const hudFontSize = isPhoneLandscape
        ? Math.max(28, Math.floor(canvas.height * 0.08))
        : Math.max(24, Math.floor(canvas.width * 0.07));
      const subFontSize = isPhoneLandscape
        ? Math.max(14, Math.floor(canvas.height * 0.04))
        : Math.max(16, Math.floor(canvas.width * 0.045));
      const devButtonH = isDevMode() ? Math.max(26, Math.floor(canvas.height * 0.045)) : 0;
      const hudBottom = safeTop + hudFontSize + subFontSize + 18 + devButtonH;
      meterY = hudBottom + 12;
    }
  }

  // --- Difficulty ---
  function updateSweetSpotBounds() {
    const half = difficulty.sweetSpotWidth / 2;
    difficulty.sweetSpotMin = throw_.sweetCenter - half;
    difficulty.sweetSpotMax = throw_.sweetCenter + half;
  }

  function updateDifficulty() {
    const aspect = canvas.height / canvas.width;
    const tA = Math.max(0, Math.min(1, (aspect - ASPECT_LANDSCAPE) / (ASPECT_PORTRAIT - ASPECT_LANDSCAPE)));
    difficulty.pitWidth = PIT_WIDTH_LANDSCAPE + tA * (PIT_WIDTH_PORTRAIT - PIT_WIDTH_LANDSCAPE);
    updateSweetSpotBounds();
    const halfWidth = canvas.width * difficulty.pitWidth / 2;
    if (isLilItalyLevel()) {
      wallX = WALL_THICKNESS;
      pitLeft = wallX;
      pitRight = pitCenterX + halfWidth;
      pitScoreLeft = 0;
      pitScoreRight = pitRight;
    } else {
      pitLeft  = pitCenterX - halfWidth;
      wallX    = canvas.width - WALL_THICKNESS;
      pitRight = wallX;
      pitScoreLeft = pitLeft;
      pitScoreRight = canvas.width;
    }
    if (isPitReady()) {
      const pitImg = getActivePitImg();
      const dW = isLilItalyLevel() ? pitRight : canvas.width - pitLeft;
      wallTopY = groundY - dW * pitImg.naturalHeight / pitImg.naturalWidth;
    }
  }

        { milestone: HOF_GAMES_LEADER, row: gamesLeader },
        ...HOF_MILESTONES.map((m, i) => ({ milestone: m, row: results[i] })),
        ...HOF_TOTAL_POINT_MILESTONES.map(m => ({ milestone: m, row: totalPointMap.get(m.threshold) || null })),
        ...HOF_GAME_MILESTONES.map(m => ({ milestone: m, row: gameCountMap.get(m.threshold) || null }))

    } catch {

  function aggregatePlayerStats(rawRows) {
    const byName = new Map();
    for (const r of rawRows) {
      const key = String(r.name || '').trim();
      if (!key) continue;
      const cur = byName.get(key) || { name: key, totalPoints: 0, gamesPlayed: 0, avgPoints: 0 };
      cur.totalPoints += Number(r.score) || 0;
      cur.gamesPlayed += 1;
      cur.avgPoints = cur.gamesPlayed ? cur.totalPoints / cur.gamesPlayed : 0;
      byName.set(key, cur);
    }
    return Array.from(byName.values()).sort((a, b) => {
      if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
      return b.gamesPlayed - a.gamesPlayed;
    });
  }

  async function fetchPlayerStats() {

  function aggregateTopCharacters(rows, n = 3) {
    const map = new Map();
    for (const r of rows) {
      const c = String(r.character_name || 'Unknown');
      const cur = map.get(c) || { character: c, games: 0, totalPoints: 0, bestScore: 0 };
      const score = Number(r.score) || 0;
      cur.games += 1;
      cur.totalPoints += score;
      cur.bestScore = Math.max(cur.bestScore, score);
      map.set(c, cur);
    }
    return Array.from(map.values())
      .sort((a, b) => b.games - a.games || b.totalPoints - a.totalPoints || b.bestScore - a.bestScore)
      .slice(0, n);
  }

  async function fetchVersusHome(force = false) {
    if (!VERSUS_ENABLED) return;
    const name = username.get();
    if (!name || !window.globalScores) return;
    const now = Date.now();
    if (!force && versusStatus === 'loading') return;
    if (!force && versusStatus === 'ready' && now - versusLastFetch < 60000) return;
    versusStatus = 'loading';
    versusError = '';
    try {
      const [pending, recent] = await Promise.all([
        window.globalScores.fetchPendingForUser(name),
        window.globalScores.fetchRecentResultsForUser(name),
      ]);
      const seenIds = new Set(pending.map(m => m.id));
      const unseenCompleted = recent.filter(m => !seenIds.has(m.id) && isUnseenCompletedMatch(m));
      versusRows = [...unseenCompleted, ...pending];
      const owedThrows = versusRows.filter(row => !isMyMatchScoreDone(row)).length;
      const unseenResults = versusRows.filter(isUnseenCompletedMatch).length;
      versusPendingCount = owedThrows + unseenResults;
      versusPendingFetchedAt = now;
      versusLastFetch = now;
      versusStatus = 'ready';
      updateLandingVersusButton();
      fetchVersusRecord(name);
      fetchVersusRankings();
    } catch {
      versusRows = [];
      versusPendingCount = 0;
      versusStatus = 'error';
      versusError = 'offline';
      updateLandingVersusButton();
    }
  }

  function startVersusMatch(match, side, opts = {}) {
    versusCurrentMatch = match;
    const myCharacterId = opts.characterId
      || (side === 'challenger' ? match.challenger_character_id : match.recipient_character_id)
      || selectedCharacterId;
    if (myCharacterId) {
      const charIndex = CHARACTERS.findIndex(c => c.id === myCharacterId);
      if (charIndex >= 0) {
        selectedCharacterId = CHARACTERS[charIndex].id;
        characterReady = false;
        characterImg.src = CHARACTERS[charIndex].sprite;
      }
    }
    const levelId = match.level_id && LEVELS.some(l => l.id === match.level_id)
      ? match.level_id
      : (selectedLevelId || LEVELS[0].id);
    loadLevelImages();
    selectedLevelId = levelId;
    backgroundImg = levelImages[levelId];
    backgroundReady = backgroundImg && backgroundImg.complete && backgroundImg.naturalWidth > 0;
    if (backgroundImg && !backgroundReady) {
      backgroundImg.onload = () => { backgroundReady = true; };
    }
    updateLayout();
    resetRun();
    run.versusContext = {
      matchId: match.id,
      side,
      throwsRemaining: VERSUS_THROWS_PER_PLAYER,
      scoreSoFar: 0,
    };
    saveInProgressMatch(run.versusContext);
    run.state = RUN_STATE.VERSUS_PLAYING;
  }

  async function finishVersusRun() {
    const context = run.versusContext;
    if (!context || !window.globalScores) return;
    context.scoreSoFar = scoring.score;
    try {
      const match = await window.globalScores.submitMatchScore(context.matchId, context.side, scoring.score);
      clearInProgressMatch();
      versusCurrentMatch = match;
      resetDifficultyRamp();
      run.state = bothScoresDone(match) ? RUN_STATE.VERSUS_RESULT : RUN_STATE.VERSUS_WAITING;
      if (run.state === RUN_STATE.VERSUS_WAITING) startVersusPolling(match.id);
      else stopVersusPolling();
      if (run.state === RUN_STATE.VERSUS_RESULT) {
        markResultSeen(match.id);
        fetchVersusRecord(username.get());
      }
      fetchVersusHome(true);
    } catch {
      showToast('Could not submit score');
      resetDifficultyRamp();
      run.state = RUN_STATE.VERSUS_WAITING;
      startVersusPolling(context.matchId);
    }
  }

  async function pollMatch(matchId) {
    if (!matchId || !window.globalScores) return;
    try {
      const match = await window.globalScores.fetchMatchByCode(versusCurrentMatch?.invite_code || '');
      if (match.id !== matchId) return;
      versusCurrentMatch = match;
      if (bothScoresDone(match)) {
        stopVersusPolling();
        run.state = RUN_STATE.VERSUS_RESULT;
        markResultSeen(match.id);
        fetchVersusHome(true);
        fetchVersusRecord(username.get());
      }
    } catch {}
  }

  function startVersusPolling(matchId) {
    if (!matchId) return;
    stopVersusPolling();
    if (!document.hidden) {
      pollMatch(matchId);
      versusPollTimer = setInterval(() => pollMatch(matchId), VERSUS_POLL_MS);
    }
  }

  function stopVersusPolling() {
    if (versusPollTimer) clearInterval(versusPollTimer);
    versusPollTimer = null;
  }

  function startVersusHomePolling() {
    stopVersusPolling();
    if (!document.hidden) {
      versusPollTimer = setInterval(() => fetchVersusHome(true), VERSUS_POLL_MS);
    }
  }

  function getScoreLeaderName() {
    if (leaderboard.globalStatus !== 'ready' || leaderboard.globalRows.length === 0) return null;
    return String(leaderboard.globalRows[0].name || '').trim();
  }

  function isScoreLeaderUsername(name) {
    const leaderName = getScoreLeaderName();
    return !!leaderName && String(name || '').trim() === leaderName;
  }

  function getAllTimeScoreLeaderName() {
    if (leaderboard.allTimeStatus !== 'ready' || !leaderboard.allTimeTopRow) return null;
    return String(leaderboard.allTimeTopRow.name || '').trim();
  }

  function isDevMode() {
    const host = String(window.location.hostname || '').toLowerCase().replace(/\.$/, '');
    return host !== PROD_APEX && !host.endsWith('.' + PROD_APEX);
  }

  function showToast(message) {
    toastText = String(message || '');
    toastUntil = performance.now() + 2200;
  }

  function drawToast(timestamp) {
    if (!toastText || timestamp > toastUntil) return;
    const fontSize = Math.max(13, Math.floor(canvas.width * 0.035));
    const padX = 14;
    const h = fontSize + 18;
    ctx.font = `bold ${Math.round(fontSize)}px sans-serif`;
    const w = Math.min(canvas.width - 32, ctx.measureText(toastText).width + padX * 2);
    const x = (canvas.width - w) / 2;
    const y = safeTop + 12;
    ctx.fillStyle = 'rgba(10,10,20,0.88)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 6);
    ctx.fill();
    drawText(truncateText(toastText, w - padX * 2, fontSize, true), x + w / 2, y + h * 0.65, fontSize, THEME.accent, 'center', true);
  }

  function isSameName(a, b) {
    return sanitizeUsername(a) === sanitizeUsername(b);
  }

  function getMatchSide(match) {
    const me = username.get();
    if (isSameName(match.challenger_name, me)) return 'challenger';
    if (isSameName(match.recipient_name, me)) return 'recipient';
    return null;
  }

  function getOpponentName(match) {
    const side = getMatchSide(match);
    if (side === 'challenger') return match.recipient_name || 'invite link';
    if (side === 'recipient') return match.challenger_name || 'opponent';
    return match.recipient_name || match.challenger_name || 'opponent';
  }

  function isMyMatchScoreDone(match) {
    const side = getMatchSide(match);
    return side === 'challenger' ? match.challenger_score != null : match.recipient_score != null;
  }

  function isOpponentScoreDone(match) {
    const side = getMatchSide(match);
    return side === 'challenger' ? match.recipient_score != null : match.challenger_score != null;
  }

  function bothScoresDone(match) {
    return match && match.challenger_score != null && match.recipient_score != null;
  }

  function formatMatchAge(match) {
    const created = new Date(match.created_at).getTime();
    if (!created) return '';
    const mins = Math.max(0, Math.floor((Date.now() - created) / 60000));
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 48) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function challengeCountRecord() {
    const today = new Date().toISOString().slice(0, 10);
    try {
      const parsed = JSON.parse(localStorage.getItem(CHALLENGE_COUNT_KEY) || '{}');
      if (parsed.date === today) return parsed;
    } catch {}
    return { date: today, count: 0 };
  }

  function canSendChallengeToday() {
    return challengeCountRecord().count < 10;
  }

  function recordChallengeSent() {
    const rec = challengeCountRecord();
    rec.count += 1;
    try { localStorage.setItem(CHALLENGE_COUNT_KEY, JSON.stringify(rec)); } catch {}
  }

  function loadSeenResults() {
    try {
      const arr = JSON.parse(localStorage.getItem(SEEN_RESULTS_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function isResultSeen(matchId) {
    if (!matchId) return true;
    return loadSeenResults().includes(matchId);
  }
  function markResultSeen(matchId) {
    if (!matchId) return;
    const arr = loadSeenResults();
    if (arr.includes(matchId)) return;
    arr.push(matchId);
    while (arr.length > SEEN_RESULTS_LIMIT) arr.shift();
    try { localStorage.setItem(SEEN_RESULTS_KEY, JSON.stringify(arr)); } catch {}
  }
  function isUnseenCompletedMatch(match) {
    return !!match && bothScoresDone(match) && !!getMatchSide(match) && !isResultSeen(match.id);
  }

  function saveInProgressMatch(ctx) {
    if (!ctx || !ctx.matchId || !ctx.side) {
      try { localStorage.removeItem(IN_PROGRESS_MATCH_KEY); } catch {}
      return;
    }
    try {
      localStorage.setItem(IN_PROGRESS_MATCH_KEY, JSON.stringify({
        matchId: ctx.matchId,
        side: ctx.side,
        scoreSoFar: ctx.scoreSoFar || 0,
      }));
    } catch {}
  }
  function loadInProgressMatch() {
    try {
      const raw = localStorage.getItem(IN_PROGRESS_MATCH_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.matchId || !obj.side) return null;
      return obj;
    } catch { return null; }
  }
  function clearInProgressMatch() {
    try { localStorage.removeItem(IN_PROGRESS_MATCH_KEY); } catch {}
  }

  function crossedBoundary(prev, next, boundary) {
    return prev < boundary && next >= boundary;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function fireConfetti(shape, particleCount) {
    if (!window.confetti || !shape) return;
    window.confetti({
      particleCount,
      spread: 90,
      startVelocity: 45,
      origin: { x: 0.5, y: 0.6 },
      shapes: [shape],
      scalar: 2,
      ticks: 200,
    });
  }

  function triggerCelebrations(prev, next) {
    if (next <= prev) return;

    if (!celebration.firedHundred && crossedBoundary(prev, next, 100)) {
      celebration.firedHundred = true;
      fireConfetti(window.celebrationShapes?.hundred, 100);
    }

    const lastBoundary = Math.floor(next / 20) * 20;
    if (lastBoundary >= 20 && lastBoundary > prev) {
      const idx = Math.floor(Math.random() * CELEBRATION_PHRASES.length);
      celebration.phraseText = CELEBRATION_PHRASES[idx];
      celebration.phraseTimer = CELEBRATION_PHRASE_DURATION;
    }
  }

  async function triggerGameOverCelebrations() {
    if (celebration.firedAllTime) return;
    if (leaderboard.allTimeStatus !== 'ready') {
      await fetchAllTimeLeader();
    }
    if (celebration.firedAllTime || run.state !== RUN_STATE.GAME_OVER || leaderboard.allTimeStatus !== 'ready' || !leaderboard.allTimeTopRow) return;
    const topScore = Number(leaderboard.allTimeTopRow.score) || 0;
    const leaderName = getAllTimeScoreLeaderName();
    const isSelf = !!leaderName && String(username.get() || '').trim() === leaderName;
    if (!isSelf && topScore > 0 && scoring.score > topScore) {
      celebration.firedAllTime = true;
      fireConfetti(window.celebrationShapes?.crown, 120);
    }
  }

  function triggerDevTest(action) {
    if (!isDevMode()) return;
    if (action === 'score20') {
      const prevScore = scoring.score;
      scoring.score += 20;
      triggerCelebrations(prevScore, scoring.score);
      return;
    }
    if (action === 'score100') {
      const prevScore = scoring.score;
      scoring.score += 100;
      triggerCelebrations(prevScore, scoring.score);
      return;
    }
    if (action === 'crown') {
      celebration.firedAllTime = true;
      fireConfetti(window.celebrationShapes?.crown, 120);
      return;
    }
    if (action === 'resetScore') {
      scoring.score = 0;
      scoring.lastThrowPoints = 0;
      scoring.lastThrowZone = '';
      scoring.feedbackTimer = 0;
      celebration.phraseText = '';
      celebration.phraseTimer = 0;
      return;
    }
    if (action === 'resetShovels') {
      run.missesRemaining = MISSES_PER_RUN;
    }
  }

  async function submitGlobalScore(name, score, characterName) {
    gameOverSave.globalStatus = 'loading';
    try {
      if (score <= 0) throw new Error('score');
      const insertedId = await window.globalScores.submit(name, score, characterName);
      const rows = await window.globalScores.topN(GLOBAL_SCORE_LIMIT);
      leaderboard.globalRows = rows;
      leaderboard.globalStatus = 'ready';
      leaderboard.allTimeTopRow = rows[0] || null;
      leaderboard.allTimeStatus = 'ready';
      const rank = rows.findIndex(row => row.id === insertedId);
      gameOverSave.globalStatus = 'ready';
      gameOverSave.globalMessage = rank === -1
        ? 'Global: outside top 100'
        : `Global rank: #${rank + 1}`;
    } catch (err) {
      if (err && err.code === 'disabled-non-prod') {
        gameOverSave.globalStatus = 'ready';
        gameOverSave.globalMessage = 'Global save disabled (dev)';
        return;
      }
      gameOverSave.globalStatus = 'error';
    }
  }

  // --- Run-level functions ---
  function endRun(timestamp) {
    run.state       = RUN_STATE.GAME_OVER;
    run.gameOverTime = timestamp;
    resetDifficultyRamp();
    triggerGameOverCelebrations().finally(saveGameOverScore);

      gameOverSave.globalStatus = 'ready';
      gameOverSave.globalMessage = 'Global save disabled (dev)';
      return;
    }
    submitGlobalScore(name, scoring.score, selectedCharacterId);
  }

  function buildVersusLevelPicker(card, defaultLevelId) {
    const label = document.createElement('div');
    label.textContent = 'Level';
    label.style.cssText = `font-size:13px;color:${THEME.textMute};margin-bottom:-4px;`;
    card.appendChild(label);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
    let selectedId = defaultLevelId && LEVELS.some(l => l.id === defaultLevelId) ? defaultLevelId : LEVELS[0].id;
    const tiles = [];
    const repaint = () => {
      tiles.forEach(({ btn, id }) => {
        const active = id === selectedId;
        btn.style.background = active ? THEME.accent : THEME.surface;
        btn.style.color = active ? THEME.bgTop : THEME.text;
        btn.style.borderColor = active ? THEME.accent : THEME.secondary;
      });
    };
    LEVELS.forEach(l => {
      const btn = document.createElement('button');
      btn.textContent = l.label;
      btn.style.cssText = `flex:1 1 auto;min-width:80px;padding:10px 8px;border:2px solid ${THEME.secondary};border-radius:6px;font-weight:bold;font-size:14px;cursor:pointer;background:${THEME.surface};color:${THEME.text};`;
      btn.addEventListener('click', () => { selectedId = l.id; repaint(); });
      row.appendChild(btn);
      tiles.push({ btn, id: l.id });
    });
    repaint();
    card.appendChild(row);
    return { get: () => selectedId };
  }

  function buildVersusCharacterPicker(card, defaultCharacterId) {

    let selectedId = defaultCharacterId && CHARACTERS.some(c => c.id === defaultCharacterId)
      ? defaultCharacterId : CHARACTERS[0].id;
    const tiles = [];
    const repaint = () => {
      tiles.forEach(({ btn, id }) => {
        const active = id === selectedId;
        btn.style.borderColor = active ? THEME.accent : 'transparent';
        btn.style.outline = active ? `2px solid ${THEME.accent}` : 'none';

    const name = sanitizeUsername(rawName);

    if (isSameName(name, username.get())) {
      showToast('Pick someone other than yourself.');
      return;
    }
    const { overlay, card } = makeOverlayCard(`Challenge ${name}?`);
    const message = document.createElement('p');
    message.textContent = 'Send a 9-throw async match challenge. You pick the level for both players.';
    message.style.cssText = `margin:0;color:${THEME.textMute};font-size:14px;`;

    confirm.textContent = 'Send challenge';
    styleModalButton(confirm, true);
    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel';

    confirm.addEventListener('click', async () => {
      if (!canSendChallengeToday()) {
        error.textContent = 'Challenge limit reached for today.';
        return;

      confirm.disabled = true;
      try {
        await window.globalScores.createDirectChallenge(username.get(), name, {

          characterId: characterPicker.get(),

        recordChallengeSent();
        overlay.remove();

        fetchVersusHome(true);

        error.textContent = 'You already have an open challenge against this player.';

    cancel.addEventListener('click', () => overlay.remove());

  function openChallengeByUsernameOverlay() {
    if (!VERSUS_ENABLED || !window.globalScores) return;
    const { overlay, card } = makeOverlayCard('Challenge by username');
    const select = document.createElement('select');
    select.style.cssText = `width:100%;padding:12px;border:0;border-radius:6px;font:16px sans-serif;background:${THEME.surface};color:${THEME.text};`;
    const loadingOpt = document.createElement('option');
    loadingOpt.value = '';
    loadingOpt.textContent = 'Loading players…';
    select.appendChild(loadingOpt);
    select.disabled = true;
    const caption = document.createElement('p');
    caption.textContent = 'If multiple players share this name, only the first to open the app receives it.';
    caption.style.cssText = `margin:0;color:${THEME.textMute};font-size:13px;line-height:1.35;`;
    card.appendChild(select);
    card.appendChild(caption);
    const levelPicker = buildVersusLevelPicker(card, selectedLevelId);
    const characterPicker = buildVersusCharacterPicker(card, selectedCharacterId);
    const error = document.createElement('div');
    error.style.cssText = `min-height:18px;color:${ERROR_COLOR};font-size:13px;`;
    const submit = document.createElement('button');
    submit.textContent = 'Submit';
    styleModalButton(submit, true);
    submit.disabled = true;
    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel';
    styleModalButton(cancel);

    (async () => {
      try {
        const names = await window.globalScores.fetchKnownPlayers();
        const me = username.get();
        const others = names.filter(n => !isSameName(n, me));
        select.innerHTML = '';
        if (others.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'No other players yet';
          select.appendChild(opt);
          select.disabled = true;
          return;
        }
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Select an opponent…';
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);
        others.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          select.appendChild(opt);
        });
        select.disabled = false;
        submit.disabled = false;
      } catch {
        select.innerHTML = '';
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Could not load players';
        select.appendChild(opt);
        select.disabled = true;
      }
    })();

    const sendChallenge = async () => {
      const name = sanitizeUsername(select.value);
      error.textContent = '';
      if (!name) {
        error.textContent = 'Select an opponent.';
        return;
      }
      if (isSameName(name, username.get())) {
        error.textContent = 'Pick someone other than yourself.';
        return;
      }
      if (!canSendChallengeToday()) {
        error.textContent = 'Challenge limit reached for today.';
        return;
      }
      submit.disabled = true;
      try {
        await window.globalScores.createDirectChallenge(username.get(), name, {
          levelId: levelPicker.get(),
          characterId: characterPicker.get(),
        });
        recordChallengeSent();
        overlay.remove();
        showToast(`Challenge sent to ${name}`);
        fetchVersusHome(true);
      } catch {
        error.textContent = 'You already have an open challenge against this player.';
        submit.disabled = false;
      }
    };

    submit.addEventListener('click', sendChallenge);
    cancel.addEventListener('click', () => overlay.remove());
    card.appendChild(error);
    card.appendChild(submit);
    card.appendChild(cancel);
  }
