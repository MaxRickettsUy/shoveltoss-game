<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shovel Toss</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- Constants ---
  const ANGLE = Math.PI / 4;        // 45 degrees, fixed
  const V_MIN = 300;                 // px/s, weak lob
  const V_MAX = 800;                 // px/s, full send
  const G = 600;                     // px/s², gravity
  const METER_CYCLE_TIME     = 1.2;  // seconds per cycle at throw 0 (easiest)
  const METER_CYCLE_TIME_END = 0.6;  // seconds per cycle at final throw (hardest)
  const PIT_WIDTH_START = 0.26;      // pit width as fraction of canvas at throw 0
  const PIT_WIDTH_END   = 0.16;      // pit width as fraction of canvas at final throw
  const SWEET_SPOT_MIN = 0.7;
  const SWEET_SPOT_MAX = 0.9;
  const RESET_DELAY = 500;           // ms pause after landing
  const THROWS_PER_RUN = 5;          // placeholder: throws before game over
  const GAME_OVER_GUARD = 500;       // ms input guard after game over
  const ZONE_PERFECT = 0.15;         // fraction of pitHalfWidth
  const ZONE_GREAT   = 0.45;
  const PTS_PERFECT  = 100;
  const PTS_GREAT    = 75;
  const PTS_GOOD     = 50;
  const FEEDBACK_DURATION = 1500;    // ms to show throw feedback
  const HUD_PAD = 20;                // px padding for HUD elements

  // --- Layout (recalculated on resize) ---
  let groundY, playerX, playerY;
  let pitLeft, pitRight, pitCenterX;
  let meterX, meterY, meterWidth, meterHeight;
  let safeTop;

  function updateLayout() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    safeTop  = Math.max(20, canvas.height * 0.04);
    groundY  = canvas.height * 0.82;
    playerX  = canvas.width  * 0.10;
    playerY  = groundY;

    pitCenterX = canvas.width * 0.55;  // fixed center; pitLeft/pitRight set by updateDifficulty
    updateDifficulty();

    // Meter: right side, thumb-reachable
    meterWidth  = Math.max(48, canvas.width * 0.10);
    meterHeight = canvas.height * 0.60;
    meterX = canvas.width - meterWidth - 20;
    meterY = canvas.height * 0.20;
  }

  // --- Run state ---
  const RUN_STATE = { READY: 'ready', PLAYING: 'playing', GAME_OVER: 'game_over' };
  let runState   = RUN_STATE.READY;
  let throwCount = 0;
  let gameOverTime = 0;  // timestamp when GAME_OVER was entered (for input guard)

  // --- Throw state ---
  const STATE = {
    IDLE:      'idle',
    CHARGING:  'charging',
    FLYING:    'flying',
    RESETTING: 'resetting'
  };
  let state = STATE.IDLE;

  let meterFill = 0;   // 0–1, current fill position
  let meterDir  = 1;   // 1 = filling, -1 = draining
  let power     = 0;   // captured at release

  let shovelX = 0, shovelY = 0;
  let flightTime = 0;
  let launchVX = 0, launchVY = 0;
  let originX  = 0, originY  = 0;

  let resetEndTime = 0;  // timestamp when reset pause ends
  let lastTimestamp = null;

  // --- Difficulty state ---
  let currentMeterCycleTime = METER_CYCLE_TIME;
  let currentPitWidth       = PIT_WIDTH_START;

  // --- Scoring state ---
  let score           = 0;
  let combo           = 0;
  let hitsInRun       = 0;
  let lastThrowPoints = 0;
  let lastThrowZone   = '';
  let feedbackTimer   = 0;  // ms remaining to show feedback

  // --- Difficulty ---
  function updateDifficulty() {
    const t = THROWS_PER_RUN <= 1 ? 0 : throwCount / (THROWS_PER_RUN - 1);
    currentMeterCycleTime = METER_CYCLE_TIME + t * (METER_CYCLE_TIME_END - METER_CYCLE_TIME);
    currentPitWidth       = PIT_WIDTH_START  + t * (PIT_WIDTH_END  - PIT_WIDTH_START);
    const halfWidth = canvas.width * currentPitWidth / 2;
    pitLeft  = pitCenterX - halfWidth;
    pitRight = pitCenterX + halfWidth;
  }

  // --- Run-level functions ---
  function endRun(timestamp) {
    runState     = RUN_STATE.GAME_OVER;
    gameOverTime = timestamp;
  }

  function resetRun() {
    throwCount      = 0;
    meterFill       = 0;
    meterDir        = 1;
    power           = 0;
    state           = STATE.IDLE;
    runState        = RUN_STATE.READY;
    score           = 0;
    combo           = 0;
    hitsInRun       = 0;
    lastThrowPoints = 0;
    lastThrowZone   = '';
    feedbackTimer   = 0;
    updateDifficulty();
  }

  // --- Result hook ---
  function onThrowResult(result, timestamp) {
    console.log('Throw result:', result);

    // Scoring
    const pitHalfWidth = (pitRight - pitLeft) / 2;
    const absDist = Math.abs(result.distanceFromCenter);

    if (!result.inPit) {
      combo           = 0;
      lastThrowPoints = 0;
      lastThrowZone   = 'miss';
    } else {
      combo++;
      hitsInRun++;
      const comboMultiplier = 1 + (combo - 1) * 0.5;

      let base;
      if (absDist <= pitHalfWidth * ZONE_PERFECT) {
        base = PTS_PERFECT;
        lastThrowZone = 'perfect';
      } else if (absDist <= pitHalfWidth * ZONE_GREAT) {
        base = PTS_GREAT;
        lastThrowZone = 'great';
      } else {
        base = PTS_GOOD;
        lastThrowZone = 'good';
      }

      lastThrowPoints = Math.round(base * comboMultiplier);
      score += lastThrowPoints;
    }

    feedbackTimer = FEEDBACK_DURATION;

    throwCount++;
    if (throwCount >= THROWS_PER_RUN) {
      endRun(timestamp);
    }
  }

  // --- Input ---
  function onPressStart() {
    if (runState === RUN_STATE.READY) {
      runState   = RUN_STATE.PLAYING;
      throwCount = 0;
      state      = STATE.IDLE;
      return;
    }
    if (runState === RUN_STATE.GAME_OVER) {
      if (lastTimestamp !== null && lastTimestamp - gameOverTime < GAME_OVER_GUARD) return;
      resetRun();
      return;
    }
    // PLAYING — existing throw logic
    if (state !== STATE.IDLE) return;
    state     = STATE.CHARGING;
    meterFill = 0;
    meterDir  = 1;
  }

  function onPressEnd() {
    if (state !== STATE.CHARGING) return;
    power = meterFill;
    state = STATE.FLYING;

    const V = V_MIN + power * (V_MAX - V_MIN);
    launchVX = V * Math.cos(ANGLE);
    launchVY = V * Math.sin(ANGLE);

    // Launch from player's hand height (top of player rect)
    originX = playerX;
    originY = playerY - 50;
    shovelX = originX;
    shovelY = originY;
    flightTime = 0;
  }

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPressStart(); }, { passive: false });
  canvas.addEventListener('touchend',   (e) => { e.preventDefault(); onPressEnd();   }, { passive: false });
  canvas.addEventListener('mousedown', onPressStart);
  canvas.addEventListener('mouseup',   onPressEnd);

  // --- Game loop ---
  function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (lastTimestamp === null) { lastTimestamp = timestamp; }
    const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50ms
    lastTimestamp = timestamp;

    if (runState === RUN_STATE.READY) {
      drawReadyScreen(timestamp);
    } else if (runState === RUN_STATE.PLAYING) {
      update(dt, timestamp);
      draw();
    } else if (runState === RUN_STATE.GAME_OVER) {
      draw();
      drawGameOverOverlay();
    }
  }

  function update(dt, timestamp) {
    // Step 2: oscillate meter while charging
    if (state === STATE.CHARGING) {
      const speed = 2 / currentMeterCycleTime; // 0→1→0 = 2 units per cycle
      meterFill += meterDir * speed * dt;
      if (meterFill >= 1) { meterFill = 1; meterDir = -1; }
      if (meterFill <= 0) { meterFill = 0; meterDir =  1; }
    }

    // Step 3: update projectile position
    if (state === STATE.FLYING) {
      flightTime += dt;
      const t = flightTime;
      shovelX = originX + launchVX * t;
      shovelY = originY - (launchVY * t - 0.5 * G * t * t);

      // Step 4: landing detection
      if (shovelY >= groundY) {
        shovelY = groundY;

        const result = {
          landed:             true,
          x:                  shovelX,
          inPit:              shovelX >= pitLeft && shovelX <= pitRight,
          distanceFromCenter: shovelX - pitCenterX,
          power:              power
        };
        onThrowResult(result, timestamp);

        state        = STATE.RESETTING;
        resetEndTime = timestamp + RESET_DELAY;
      }
    }

    // Feedback timer
    if (feedbackTimer > 0) {
      feedbackTimer = Math.max(0, feedbackTimer - dt * 1000);
    }

    // Step 5: reset after pause
    if (state === STATE.RESETTING && timestamp >= resetEndTime) {
      meterFill = 0;
      meterDir  = 1;
      power     = 0;
      state     = STATE.IDLE;
      updateDifficulty(); // apply difficulty for next throw (throwCount already incremented)
    }
  }

  // --- Draw helpers ---
  function drawText(text, x, y, fontSize, color, align, bold) {
    ctx.font = `${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ground fill
    ctx.fillStyle = '#4a3728';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // Ground line
    ctx.strokeStyle = '#6b4f3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    // Pit zone
    const pitDepth = 20;
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2;
    ctx.strokeRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);

    // Player placeholder (rectangle)
    const pW = 28, pH = 50;
    ctx.fillStyle = '#e07b39';
    ctx.fillRect(playerX - pW / 2, playerY - pH, pW, pH);

    // Shovel (during flight and brief reset pause)
    if (state === STATE.FLYING || state === STATE.RESETTING) {
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(shovelX - 8, shovelY - 5, 16, 10);
    }

    // Throw meter (visible while charging or after release until flight ends)
    if (state === STATE.CHARGING || state === STATE.FLYING) {
      drawMeter();
    }

    // Idle hint
    if (state === STATE.IDLE) {
      drawText('Hold to charge', canvas.width / 2, groundY - 28,
        Math.max(16, Math.floor(canvas.width * 0.042)), 'rgba(255,255,255,0.55)', 'center', false);
    }

    // HUD: score (top-left) and throw counter (top-right)
    const hudFontSize = Math.max(24, Math.floor(canvas.width * 0.07));
    const hudY = safeTop + hudFontSize;
    drawText(score, HUD_PAD, hudY, hudFontSize, '#ffffff', 'left', true);
    drawText(`${throwCount} / ${THROWS_PER_RUN}`, canvas.width - HUD_PAD, hudY, hudFontSize, '#ffffff', 'right', true);

    // Combo badge (below score)
    if (combo >= 2) {
      const comboFontSize = Math.max(14, Math.floor(canvas.width * 0.04));
      drawText(`x${combo} COMBO`, HUD_PAD, hudY + comboFontSize + 6, comboFontSize, '#ffe600', 'left', false);
    }

    // Throw feedback text
    if (feedbackTimer > 0) {
      const alpha = Math.min(1, feedbackTimer / 500);
      ctx.globalAlpha = alpha;
      const fbFontSize = Math.max(18, Math.floor(canvas.width * 0.055));
      let zoneColor;
      if (lastThrowZone === 'perfect')     zoneColor = '#ffe600';
      else if (lastThrowZone === 'great')  zoneColor = '#44dd44';
      else if (lastThrowZone === 'good')   zoneColor = '#ffffff';
      else                                 zoneColor = '#ff4444';
      drawText(lastThrowZone.toUpperCase(), canvas.width / 2, groundY - 60, fbFontSize, zoneColor, 'center', true);
      if (lastThrowPoints > 0) {
        drawText(`+${lastThrowPoints}`, canvas.width / 2, groundY - 60 + fbFontSize + 4,
          Math.max(14, Math.floor(canvas.width * 0.04)), '#ffffff', 'center', false);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMeter() {
    const r = 4; // corner radius

    // Background track
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.fill();

    // Sweet-spot highlight
    const sweetTop = meterY + meterHeight * (1 - SWEET_SPOT_MAX);
    const sweetH   = meterHeight * (SWEET_SPOT_MAX - SWEET_SPOT_MIN);
    ctx.fillStyle = 'rgba(255, 220, 0, 0.25)';
    ctx.beginPath();
    ctx.roundRect(meterX, sweetTop, meterWidth, sweetH, r);
    ctx.fill();

    // Fill bar
    const fillH = meterHeight * meterFill;
    const fillY = meterY + meterHeight - fillH;
    const inSweet = meterFill >= SWEET_SPOT_MIN && meterFill <= SWEET_SPOT_MAX;
    ctx.fillStyle = inSweet ? '#ffe600' : '#ff6b35';
    ctx.beginPath();
    ctx.roundRect(meterX, fillY, meterWidth, fillH, r);
    ctx.fill();

    // Border
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.stroke();

    // Label
    drawText('POWER', meterX + meterWidth / 2, meterY - 8, 14, '#ffffff', 'center', false);
  }

  function drawReadyScreen(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const titleSize = Math.max(36, Math.floor(canvas.width * 0.12));
    drawText('SHOVEL TOSS', canvas.width / 2, safeTop + canvas.height * 0.38, titleSize, '#ffffff', 'center', true);

    const pulseAlpha = 0.75 + 0.25 * Math.sin(timestamp / 700);
    ctx.globalAlpha = pulseAlpha;
    drawText('Tap to Start', canvas.width / 2, safeTop + canvas.height * 0.52,
      Math.max(18, Math.floor(canvas.width * 0.05)), '#ffffff', 'center', false);
    ctx.globalAlpha = 1;
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    drawText('GAME OVER', cx, safeTop + canvas.height * 0.38,
      Math.max(32, Math.floor(canvas.width * 0.10)), '#ffffff', 'center', true);
    drawText(`Score: ${score}`, cx, safeTop + canvas.height * 0.49,
      Math.max(22, Math.floor(canvas.width * 0.06)), '#ffe600', 'center', false);
    drawText(`${hitsInRun} / ${THROWS_PER_RUN} throws landed`, cx, safeTop + canvas.height * 0.58,
      Math.max(16, Math.floor(canvas.width * 0.045)), 'rgba(255,255,255,0.7)', 'center', false);
    drawText('Tap to Restart', cx, safeTop + canvas.height * 0.68,
      Math.max(18, Math.floor(canvas.width * 0.05)), 'rgba(255,255,255,0.7)', 'center', false);
  }

  // --- Init ---
  window.addEventListener('resize', updateLayout);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastTimestamp = null;
  });
  updateLayout();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
