<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shovel Toss</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="fcd8ac65-02a9-4054-a8b9-6809cafd04a8"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script type="module" src="src/globalScores.js"></script>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let CHARACTER_FRAME_W = 0;
  let CHARACTER_FRAME_H = 0;
  const characterImg = new Image();
  let characterReady = false;
  characterImg.onload = () => {
    CHARACTER_FRAME_W = characterImg.naturalWidth / 3;
    CHARACTER_FRAME_H = characterImg.naturalHeight;
    characterReady = true;
  };

  const pitImg = new Image();
  const pitLeftImg = new Image();
  let pitReady = false;
  let pitLeftReady = false;
  pitImg.onload = () => { pitReady = true; if (canvas.width > 0) updateLayout(); };
  pitLeftImg.onload = () => { pitLeftReady = true; if (canvas.width > 0) updateLayout(); };
  pitImg.src = 'assets/pit.png';
  pitLeftImg.src = 'assets/pit-left.png';

  const dustPuffImg = new Image();
  let dustPuffReady = false;
  dustPuffImg.onload = () => { dustPuffReady = true; };
  dustPuffImg.src = 'assets/dust-puff.png';

  const shovelImg = new Image();
  let shovelReady = false;
  shovelImg.onload = () => { shovelReady = true; };
  shovelImg.src = 'assets/shovel.png';

  const champShovelImg = new Image();
  let champShovelReady = false;
  champShovelImg.onload = () => { champShovelReady = true; };
  champShovelImg.src = 'assets/champ-shovel.png';

  const LEVELS = [
    { id: 'house',     label: 'The House',  background: 'assets/house.png' },
    { id: 'lil-italy', label: 'Lil Italy',  background: 'assets/lil-italy.png' },
  ];

  const levelImages = {};
  let backgroundReady = false;
  let backgroundImg = null;
  LEVELS.forEach(l => {
    const img = new Image();
    img.src = l.background;
    levelImages[l.id] = img;
  });

  const CHARACTERS = [
    { id: "Alexsama", hero: 'assets/character/alexsama/hero.png', sprite: 'assets/character/alexsama/sprite-sheet.png' },
    { id: "Assman", hero: 'assets/character/assman/hero.png', sprite: 'assets/character/assman/sprite-sheet.png' },
    { id: "Buck", hero: 'assets/character/buck/hero.png', sprite: 'assets/character/buck/sprite-sheet.png' },
    { id: "Billie", hero: 'assets/character/billie/hero.png', sprite: 'assets/character/billie/sprite-sheet.png' },
    { id: 'Chef',     hero: 'assets/character/chef/hero.png',     sprite: 'assets/character/chef/sprite-sheet.png' },
    { id: 'Chuggo',   hero: 'assets/character/chuggo/hero.png',   sprite: 'assets/character/chuggo/sprite-sheet.png' },
    { id: "Cowgirl", hero: 'assets/character/cowgirl/hero.png', sprite: 'assets/character/cowgirl/sprite-sheet.png' },
    { id: 'Luchador',    hero: 'assets/character/luchador/hero.png',    sprite: 'assets/character/luchador/sprite-sheet.png' },
    { id: "Maria", hero: 'assets/character/maria/hero.png', sprite: 'assets/character/maria/sprite-sheet.png' },
    { id: "Patriot", hero: 'assets/character/patriot/hero.png', sprite: 'assets/character/patriot/sprite-sheet.png' },
    { id: "Seaman", hero: 'assets/character/seaman/hero.png', sprite: 'assets/character/seaman/sprite-sheet.png' },
    { id: 'Shrek',    hero: 'assets/character/shrek/hero.png',    sprite: 'assets/character/shrek/sprite-sheet.png' },
    { id: "Smokey", hero: 'assets/character/smokey/hero.png', sprite: 'assets/character/smokey/sprite-sheet.png' },
    { id: 'Wagie',    hero: 'assets/character/wagie/hero.png',    sprite: 'assets/character/wagie/sprite-sheet.png' },
    { id: "WD40", hero: 'assets/character/wd40/hero.png', sprite: 'assets/character/wd40/sprite-sheet.png' },
    { id: "Xena", hero: 'assets/character/xena/hero.png', sprite: 'assets/character/xena/sprite-sheet.png' },
  ];

  let selectedCharacterId = null;
  let selectedLevelId = null;
  let levelTileRects = [];
  let levelBackRect = null;
  let gameOverChangeRect = null;
  let gameOverLeaderboardRect = null;
  let usernameNameRect = null;
  let usernameOverlayEl = null;
  let selectHomeRect = null;
  let leaderboardBackRect = null;
  let homeButtonRects = [];
  let stubBackRect = null;
  const heroImages = {};
  CHARACTERS.forEach(c => {
    const img = new Image();
    img.src = c.hero;
    heroImages[c.id] = img;
  });
  const championImg = new Image();
  championImg.src = 'assets/champion.png';
  const CHAMPION_IDS = new Set(['Alexsama', 'Buck', 'Wagie', 'Chef', 'Chuggo']);
  const NEW_CHARACTER_IDS = new Set(['Alexsama', 'Patriot', 'Smokey', 'Xena']);
  const LADY_CHARACTER_IDS = new Set(['Billie', 'Cowgirl', 'Maria', 'Smokey', 'Xena']);
  const CHARACTER_FILTERS = [
    { id: 'new', label: '✨ NEW' },
    { id: 'ladies', label: '💃 LADIES' },
    { id: 'champs', label: '👑 CHAMPS' },
  ];

  let tileRects = [];
  let filterRects = [];
  let activeCharacterFilter = null;
  let charSelectScrollY = 0;
  let charSelectGridTop = 0;
  let charSelectGridBottom = 0;
  let leaderboardScrollY = 0;
  let leaderboardListTop = 0;
  let leaderboardListBottom = 0;
  let leaderboardCharacterFilter = null;
  let leaderboardFilterSelectEl = null;
  let flippedCardId = null;
  let flippedCardRows = [];
  let flippedCardStatus = 'idle';
  const flippedCardCache = new Map();
  let cardFlipBtnRects = [];
  let cardBackLeaderboardRect = null;

  // --- Constants ---
  const ASPECT_LANDSCAPE = 0.6;
  const ASPECT_PORTRAIT  = 1.5;
  const THROW_MULT_MIN = 0.25;
  const THROW_MULT_MAX = 2.6;
  const THROW_DURATION = 0.6;         // seconds from launch to landing
  const THROW_PEAK_RATIO = 0.4;
  const METER_CYCLE_TIME = 0.85;     // seconds per full meter cycle
  const METER_SPEED = 2 / METER_CYCLE_TIME;
  const METER_SPEED_INCREMENT_PER_THROW = 0.15;
  const PIT_WIDTH_LANDSCAPE = 0.22;  // pit width as fraction of canvas in landscape
  const PIT_WIDTH_PORTRAIT  = 0.44;  // pit width as fraction of canvas in portrait
  const SWEET_SPOT_CENTER    = 0.50;
  const SWEET_CENTER_MIN = 0.30;
  const SWEET_CENTER_MAX = 0.85;
  const SWEET_SPOT_HALF_START = 0.10;
  const RESET_DELAY = 500;           // ms pause after landing
  const MISSES_PER_RUN = 3;
  const GAME_OVER_GUARD = 500;       // ms input guard after game over
  const PTS_STICK           = 3;
  const PTS_BACK_WALL       = 1;
  const PTS_IN_PIT          = 0;
  const PTS_FRONT_WALL      = 0;
  const PTS_MISS            = -2;
  const ZONE_FRONT_WALL_MAX = 0.10;
  const ZONE_BACK_WALL_MIN  = 0.90;
  const SHOVEL_ROT_RATE   = 9;
  const FEEDBACK_DURATION = 1500;    // ms to show throw feedback
  const HUD_PAD = 20;                // px padding for HUD elements
  const BOUNCE_DAMPING = 0.6;
  const WALL_GAP = 12;               // px between pit edge and wall
  const WALL_THICKNESS = 8;
  const METER_HEIGHT_FRACTION = 0.06;
  const METER_WIDTH_FRACTION = 0.385;
  const SWEET_SPOT_WIDTH = (SWEET_SPOT_HALF_START * 2) * 0.35;
  const WALL_HEIGHT_FRACTION = 0.30;
  const CHARACTER_RENDER_H = 150;
  const SHOVEL_RENDER_W = 40;
  const LIFE_ICON_W = 24;
  const DUST_PUFF_FRAMES = 3;
  const DUST_PUFF_DURATION = 250;
  const DUST_PUFF_W = 54;
  const DUST_PUFF_H = 27;
  const PIT_LANDING_VISUAL_ASSET_OFFSET_RIGHT = 291;
  const PIT_LANDING_VISUAL_ASSET_OFFSET_LEFT = 293;
  const PIT_FRONT_OVERLAY_ASSET_OFFSET_RIGHT = 228;
  const PIT_FRONT_OVERLAY_ASSET_OFFSET_LEFT = 219;
  const SHOVEL_STICK_ANGLE = Math.PI / 2;
  const USERNAME_KEY = 'shoveltoss.username';
  const GLOBAL_SCORE_LIMIT = 100;
  const HIGH_SCORE_BADGE = '👑';
  const APP_VERSION_TAG = 'v0.20.0';

  const username = {
    get() {
      return String(localStorage.getItem(USERNAME_KEY) || '').trim().slice(0, 20);
    },
    set(name) {
      const clean = String(name || '').trim().slice(0, 20);
      if (!clean) return '';
      localStorage.setItem(USERNAME_KEY, clean);
      return clean;
    }
  };

  // --- State enums ---
  const RUN_STATE = { USERNAME: 'username', HOME: 'home', SELECTING: 'selecting', LEVEL_SELECT: 'level_select', PLAYING: 'playing', GAME_OVER: 'game_over', LEADERBOARD: 'leaderboard', HALL_OF_FAME: 'hall_of_fame', PLAYER_STATS: 'player_stats' };
  const STATE = {
    IDLE:      'idle',
    CHARGING:  'charging',
    FLYING:    'flying',
    RESETTING: 'resetting'
  };

  // --- State objects ---
  const run = {
    state:       username.get() ? RUN_STATE.HOME : RUN_STATE.USERNAME,
    throwCount:  0,
    missesRemaining: MISSES_PER_RUN,
    gameOverTime: 0,
    lastStateBeforeLeaderboard: RUN_STATE.HOME
  };

  const throw_ = {
    state:       STATE.IDLE,
    meterFill:   0,
    meterDir:    1,
    sweetCenter: SWEET_SPOT_CENTER,
    inSweetSpot: false,
    shovelX:     0,
    shovelY:     0,
    flightTime:  0,
    originX:     0,
    originY:     0,
    landingX:    0,
    landingY:    0,
    peakHeight:  0,
    duration:    THROW_DURATION,
    resetEndTime: 0,
    bounced: false,
    angle: 0,
    landedInPit: false
  };

  const scoring = {
    score:           0,
    lastThrowPoints: 0,
    lastThrowZone:   '',
    feedbackTimer:   0
  };

  const dustPuff = {
    active: false,
    x: 0,
    y: 0,
    age: 0,
    frame: 0
  };

  const difficulty = {
    meterSpeed:     METER_SPEED,
    pitWidth:       PIT_WIDTH_LANDSCAPE,
    sweetSpotWidth: SWEET_SPOT_WIDTH,
    sweetSpotMin:   SWEET_SPOT_CENTER - SWEET_SPOT_WIDTH / 2,
    sweetSpotMax:   SWEET_SPOT_CENTER + SWEET_SPOT_WIDTH / 2
  };

  const leaderboard = {
    globalRows: [],
    globalStatus: 'idle',
    globalError: ''
  };

  const gameOverSave = {
    completed: false,
    globalStatus: 'idle',
    globalMessage: ''
  };

  // --- Loop-level (not game state) ---
  let lastTimestamp = null;

  // --- Layout (recalculated on resize) ---
  let groundY, playerX, playerY;
  let pitLeft, pitRight, pitCenterX, wallX, wallTopY;
  let meterX, meterY, meterWidth, meterHeight;
  let safeTop;

  function isLilItalyLevel() {
    return selectedLevelId === 'lil-italy';
  }

  function isPitReady() {
    return isLilItalyLevel() ? pitLeftReady : pitReady;
  }

  function getActivePitImg() {
    return isLilItalyLevel() ? pitLeftImg : pitImg;
  }

  function getPitLandingAssetOffset() {
    return isLilItalyLevel() ? PIT_LANDING_VISUAL_ASSET_OFFSET_LEFT : PIT_LANDING_VISUAL_ASSET_OFFSET_RIGHT;
  }

  function getPitFrontOverlayAssetOffset() {
    return isLilItalyLevel() ? PIT_FRONT_OVERLAY_ASSET_OFFSET_LEFT : PIT_FRONT_OVERLAY_ASSET_OFFSET_RIGHT;
  }

  function updateLayout() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    safeTop  = Math.max(20, canvas.height * 0.04);
    const isLandscape = canvas.width > canvas.height;
    groundY  = canvas.height * (isLilItalyLevel() && isLandscape ? 0.96 : 0.82);
    wallTopY = groundY - canvas.height * WALL_HEIGHT_FRACTION;
    playerX  = canvas.width * (isLilItalyLevel() ? 0.90 : 0.10);
    playerY  = groundY;

    pitCenterX = canvas.width * (isLilItalyLevel() ? 0.20 : 0.80);  // far end; pitLeft/pitRight set by updateDifficulty
    updateDifficulty();

    // Meter: narrowed and centered at top
    meterWidth = Math.max(220, canvas.width * METER_WIDTH_FRACTION);
    meterX = (canvas.width - meterWidth) / 2;
    meterY = safeTop;
    meterHeight = Math.max(36, canvas.height * METER_HEIGHT_FRACTION);
  }

  // --- Difficulty ---
  function updateSweetSpotBounds() {
    const half = difficulty.sweetSpotWidth / 2;
    difficulty.sweetSpotMin = throw_.sweetCenter - half;
    difficulty.sweetSpotMax = throw_.sweetCenter + half;
  }

  function updateDifficulty() {
    const aspect = canvas.height / canvas.width;
    const tA = Math.max(0, Math.min(1, (aspect - ASPECT_LANDSCAPE) / (ASPECT_PORTRAIT - ASPECT_LANDSCAPE)));
    difficulty.pitWidth = PIT_WIDTH_LANDSCAPE + tA * (PIT_WIDTH_PORTRAIT - PIT_WIDTH_LANDSCAPE);
    updateSweetSpotBounds();
    const halfWidth = canvas.width * difficulty.pitWidth / 2;
    if (isLilItalyLevel()) {
      wallX = WALL_THICKNESS;
      pitLeft = wallX;
      pitRight = pitCenterX + halfWidth;
    } else {
      pitLeft  = pitCenterX - halfWidth;
      wallX    = canvas.width - WALL_THICKNESS;
      pitRight = wallX;
    }
    if (isPitReady()) {
      const pitImg = getActivePitImg();
      const dW = isLilItalyLevel() ? pitRight : canvas.width - pitLeft;
      wallTopY = groundY - dW * pitImg.naturalHeight / pitImg.naturalWidth;
    }
  }

  function resetDifficultyRamp() {
    difficulty.meterSpeed = METER_SPEED;
    difficulty.sweetSpotWidth = SWEET_SPOT_WIDTH;
    updateDifficulty();
  }

  function openLeaderboard(fromState = run.state, preserveFilter = false) {
    run.lastStateBeforeLeaderboard = fromState === RUN_STATE.LEADERBOARD
      ? run.lastStateBeforeLeaderboard
      : fromState;
    run.state = RUN_STATE.LEADERBOARD;
    leaderboardScrollY = 0;
    if (!preserveFilter) leaderboardCharacterFilter = null;
    fetchGlobalLeaderboard();
    mountLeaderboardFilterSelect();
  }

  function closeLeaderboard() {
    leaderboardCharacterFilter = null;
    unmountLeaderboardFilterSelect();
    run.state = run.lastStateBeforeLeaderboard || RUN_STATE.HOME;
  }

  async function fetchGlobalLeaderboard() {
    leaderboard.globalStatus = 'loading';
    leaderboard.globalError = '';
    try {
      if (!window.globalScores) throw new Error('offline');
      leaderboard.globalRows = await window.globalScores.topN(
        GLOBAL_SCORE_LIMIT,
        { characterName: leaderboardCharacterFilter }
      );
      leaderboard.globalStatus = 'ready';
    } catch {
      leaderboard.globalRows = [];
      leaderboard.globalStatus = 'error';
      leaderboard.globalError = 'offline';
    }
  }

  function mountLeaderboardFilterSelect() {
    if (leaderboardFilterSelectEl) {
      leaderboardFilterSelectEl.value = leaderboardCharacterFilter || '';
      return;
    }
    const select = document.createElement('select');
    select.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:900;padding:6px 10px;font:14px sans-serif;background:#1a1a2e;color:#fff;border:1px solid #5555aa;border-radius:6px;';
    const all = document.createElement('option');
    all.value = '';
    all.textContent = 'All Characters';
    select.appendChild(all);
    CHARACTERS.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.id;
      select.appendChild(opt);
    });
    select.value = leaderboardCharacterFilter || '';
    select.addEventListener('change', () => {
      leaderboardCharacterFilter = select.value || null;
      leaderboardScrollY = 0;
      fetchGlobalLeaderboard();
    });
    document.body.appendChild(select);
    leaderboardFilterSelectEl = select;
  }

  function positionLeaderboardFilterSelect(top, fontSize = 14) {
    if (!leaderboardFilterSelectEl) return;
    leaderboardFilterSelectEl.style.top = `${Math.round(top)}px`;
    leaderboardFilterSelectEl.style.font = `${Math.round(fontSize)}px sans-serif`;
  }

  function unmountLeaderboardFilterSelect() {
    if (!leaderboardFilterSelectEl) return;
    leaderboardFilterSelectEl.remove();
    leaderboardFilterSelectEl = null;
  }

  function fetchGlobalLeaderboardWhenReady(attemptsRemaining = 20) {
    if (window.globalScores) {
      fetchGlobalLeaderboard();
      return;
    }
    if (attemptsRemaining <= 0) {
      leaderboard.globalStatus = 'error';
      leaderboard.globalError = 'offline';
      return;
    }
    setTimeout(() => fetchGlobalLeaderboardWhenReady(attemptsRemaining - 1), 100);
  }

  function getScoreLeaderName() {
    if (leaderboard.globalStatus !== 'ready' || leaderboard.globalRows.length === 0) return null;
    return String(leaderboard.globalRows[0].name || '').trim();
  }

  function isScoreLeaderUsername(name) {
    const leaderName = getScoreLeaderName();
    return !!leaderName && String(name || '').trim() === leaderName;
  }

  async function submitGlobalScore(name, score, characterName) {
    gameOverSave.globalStatus = 'loading';
    try {
      if (score <= 0) throw new Error('score');
      const insertedId = await window.globalScores.submit(name, score, characterName);
      const rows = await window.globalScores.topN(GLOBAL_SCORE_LIMIT);
      leaderboard.globalRows = rows;
      leaderboard.globalStatus = 'ready';
      const rank = rows.findIndex(row => row.id === insertedId);
      gameOverSave.globalStatus = 'ready';
      gameOverSave.globalMessage = rank === -1
        ? 'Global: outside top 100'
        : `Global rank: #${rank + 1}`;
    } catch (err) {
      if (err && err.code === 'disabled-non-prod') {
        gameOverSave.globalStatus = 'ready';
        gameOverSave.globalMessage = 'Global save disabled (dev)';
        return;
      }
      gameOverSave.globalStatus = 'error';
    }
  }

  // --- Run-level functions ---
  function endRun(timestamp) {
    run.state       = RUN_STATE.GAME_OVER;
    run.gameOverTime = timestamp;
    resetDifficultyRamp();
    saveGameOverScore();
  }

  function saveGameOverScore() {
    if (gameOverSave.completed) return;
    const name = username.get();
    if (!name) return;
    gameOverSave.completed = true;
    if (!window.globalScores.isProduction()) {
      gameOverSave.globalStatus = 'ready';
      gameOverSave.globalMessage = 'Global save disabled (dev)';
      return;
    }
    submitGlobalScore(name, scoring.score, selectedCharacterId);
  }

  function openUsernameOverlay(returnState = RUN_STATE.HOME) {
    run.state = RUN_STATE.USERNAME;
    if (usernameOverlayEl) usernameOverlayEl.remove();

    const overlay = document.createElement('div');
    overlay.style.position = 'fixed';
    overlay.style.inset = '0';
    overlay.style.display = 'flex';
    overlay.style.alignItems = 'center';
    overlay.style.justifyContent = 'center';
    overlay.style.background = 'rgba(0,0,0,0.62)';
    overlay.style.zIndex = '10';
    overlay.style.fontFamily = 'sans-serif';

    const panel = document.createElement('form');
    panel.style.width = 'min(320px, calc(100vw - 40px))';
    panel.style.padding = '18px';
    panel.style.background = '#1a1a2e';
    panel.style.border = '2px solid #ffffff';
    panel.style.borderRadius = '8px';
    panel.style.display = 'grid';
    panel.style.gap = '12px';

    const label = document.createElement('label');
    label.textContent = 'Username';
    label.style.color = '#ffffff';
    label.style.fontWeight = '700';

    const input = document.createElement('input');
    input.value = username.get();
    input.maxLength = 20;
    input.autocomplete = 'nickname';
    input.style.width = '100%';
    input.style.marginTop = '8px';
    input.style.padding = '12px';
    input.style.font = '18px sans-serif';
    input.style.borderRadius = '6px';
    input.style.border = '0';

    const error = document.createElement('div');
    error.style.minHeight = '18px';
    error.style.color = '#ff8888';
    error.style.font = '13px sans-serif';

    const button = document.createElement('button');
    button.type = 'submit';
    button.textContent = 'Save';
    button.style.padding = '12px';
    button.style.font = '700 18px sans-serif';
    button.style.color = '#ffffff';
    button.style.background = '#2a2a4a';
    button.style.border = '2px solid #ffffff';
    button.style.borderRadius = '6px';

    panel.addEventListener('submit', (e) => {
      e.preventDefault();
      const saved = username.set(input.value);
      if (!saved) {
        error.textContent = 'Enter a username.';
        return;
      }
      overlay.remove();
      usernameOverlayEl = null;
      run.state = returnState;
    });

    label.appendChild(input);
    panel.appendChild(label);
    panel.appendChild(error);
    panel.appendChild(button);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    usernameOverlayEl = overlay;
    input.focus();
    input.select();
  }

  function resetRun() {
    run.throwCount       = 0;
    run.missesRemaining  = MISSES_PER_RUN;
    run.state            = RUN_STATE.PLAYING;
    throw_.state         = STATE.IDLE;
    throw_.meterFill     = 0;
    throw_.meterDir      = 1;
    throw_.sweetCenter   = SWEET_SPOT_CENTER;
    scoring.score           = 0;
    scoring.lastThrowPoints = 0;
    scoring.lastThrowZone   = '';
    scoring.feedbackTimer   = 0;
    dustPuff.active = false;
    dustPuff.age    = 0;
    gameOverSave.completed     = false;
    gameOverSave.globalStatus  = 'idle';
    gameOverSave.globalMessage = '';
    throw_.inSweetSpot      = false;
    throw_.bounced          = false;
    throw_.angle            = 0;
    throw_.landedInPit      = false;
    resetDifficultyRamp();
  }

  // --- Result hook ---
  function onThrowResult(result, timestamp) {
    // Scoring
    let zone, basePoints;

    if (!result.inPit) {
      zone = 'miss';
      basePoints = PTS_MISS;
    } else {
      const norm = isLilItalyLevel()
        ? (pitRight - result.x) / (pitRight - pitLeft)
        : (result.x - pitLeft) / (pitRight - pitLeft);
      if (norm < ZONE_FRONT_WALL_MAX) {
        zone = 'front_wall'; basePoints = PTS_FRONT_WALL;
      } else if (result.inSweetSpot) {
        zone = 'stick';      basePoints = PTS_STICK;
      } else if (norm > ZONE_BACK_WALL_MIN) {
        zone = 'back_wall';  basePoints = PTS_BACK_WALL;
      } else {
        zone = 'in_pit';     basePoints = PTS_IN_PIT;
      }
    }

    scoring.lastThrowPoints = basePoints;
    scoring.lastThrowZone  = zone;
    scoring.score         += scoring.lastThrowPoints;
    scoring.feedbackTimer  = FEEDBACK_DURATION;

    run.throwCount++;
    if (zone === 'stick') {
      difficulty.meterSpeed += METER_SPEED_INCREMENT_PER_THROW;
    }
    if (zone === 'miss') {
      run.missesRemaining--;
    }
    if (run.missesRemaining === 0) {
      endRun(timestamp);
    }
  }

  function spawnDustPuff(x, y) {
    dustPuff.active = true;
    dustPuff.x = x;
    dustPuff.y = y;
    dustPuff.age = 0;
    dustPuff.frame = 0;
  }

  function getPitLandingVisualYOffset() {
    if (!isPitReady()) return 0;
    const pitImg = getActivePitImg();
    const pitScale = (isLilItalyLevel() ? pitRight : canvas.width - pitLeft) / pitImg.naturalWidth;
    return getPitLandingAssetOffset() * pitScale;
  }

  function getFilteredCharacters() {
    if (activeCharacterFilter === 'new') return CHARACTERS.filter(c => NEW_CHARACTER_IDS.has(c.id));
    if (activeCharacterFilter === 'ladies') return CHARACTERS.filter(c => LADY_CHARACTER_IDS.has(c.id));
    if (activeCharacterFilter === 'champs') return CHARACTERS.filter(c => CHAMPION_IDS.has(c.id));
    return CHARACTERS;
  }

  function getCharacterFilterCount(filterId) {
    if (filterId === 'new') return CHARACTERS.filter(c => NEW_CHARACTER_IDS.has(c.id)).length;
    if (filterId === 'ladies') return CHARACTERS.filter(c => LADY_CHARACTER_IDS.has(c.id)).length;
    if (filterId === 'champs') return CHARACTERS.filter(c => CHAMPION_IDS.has(c.id)).length;
    return CHARACTERS.length;
  }

  async function fetchCardTop5(characterId) {
    const cached = flippedCardCache.get(characterId);
    if (cached && Date.now() - cached.fetchedAt < 60000) {
      flippedCardRows = cached.rows;
      flippedCardStatus = 'ready';
      return;
    }
    flippedCardStatus = 'loading';
    try {
      const rows = await window.globalScores.topN(5, { characterName: characterId });
      if (flippedCardId !== characterId) return;
      flippedCardRows = rows;
      flippedCardStatus = 'ready';
      flippedCardCache.set(characterId, { rows, fetchedAt: Date.now() });
    } catch {
      if (flippedCardId !== characterId) return;
      flippedCardRows = [];
      flippedCardStatus = 'error';
    }
  }

  function flipCard(characterId) {
    if (flippedCardId === characterId) {
      flippedCardId = null;
      return;
    }
    flippedCardId = characterId;
    fetchCardTop5(characterId);
  }

  // --- Input ---
  function chooseCharacter(index) {
    selectedCharacterId = CHARACTERS[index].id;
    characterReady = false;
    characterImg.src = CHARACTERS[index].sprite;
    run.state = RUN_STATE.LEVEL_SELECT;
    flippedCardId = null;
    levelTileRects = [];
  }

  function chooseLevel(index) {
    selectedLevelId = LEVELS[index].id;
    backgroundImg = levelImages[selectedLevelId];
    backgroundReady = backgroundImg.complete && backgroundImg.naturalWidth > 0;
    if (!backgroundReady) {
      backgroundImg.onload = () => { backgroundReady = true; };
    }
    updateLayout();
    resetRun();
  }

  function pointerInRect(r) {
    return !!r
      && lastPointerX >= r.x && lastPointerX <= r.x + r.w
      && lastPointerY >= r.y && lastPointerY <= r.y + r.h;
  }

  function onPressStart() {
    if (run.state === RUN_STATE.USERNAME) return;
    if (run.state === RUN_STATE.HOME) {
      if (pointerInRect(usernameNameRect)) {
        openUsernameOverlay(RUN_STATE.HOME);
        return;
      }
      for (let i = 0; i < homeButtonRects.length; i++) {
        const btn = homeButtonRects[i];
        if (pointerInRect(btn)) {
          switch (btn.action) {
            case 'play':
              run.state = RUN_STATE.SELECTING;
              break;
            case 'leaderboard':
              openLeaderboard(RUN_STATE.HOME);
              break;
            case 'hall':
              run.state = RUN_STATE.HALL_OF_FAME;
              break;
            case 'stats':
              run.state = RUN_STATE.PLAYER_STATS;
              break;
          }
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.LEVEL_SELECT) {
      if (pointerInRect(levelBackRect)) {
        run.state = RUN_STATE.SELECTING;
        flippedCardId = null;
        levelTileRects = [];
        levelBackRect = null;
        return;
      }
      for (let i = 0; i < levelTileRects.length; i++) {
        if (pointerInRect(levelTileRects[i])) {
          chooseLevel(i);
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.SELECTING) {
      if (pointerInRect(selectHomeRect)) {
        run.state = RUN_STATE.HOME;
        charSelectScrollY = 0;
        flippedCardId = null;
        return;
      }
      if (pointerInRect(usernameNameRect)) {
        openUsernameOverlay(RUN_STATE.SELECTING);
        return;
      }
      for (let i = 0; i < filterRects.length; i++) {
        const filter = filterRects[i];
        if (pointerInRect(filter)) {
          activeCharacterFilter = activeCharacterFilter === filter.id ? null : filter.id;
          charSelectScrollY = 0;
          flippedCardId = null;
          return;
        }
      }
      for (let i = 0; i < cardFlipBtnRects.length; i++) {
        const btn = cardFlipBtnRects[i];
        if (pointerInRect(btn)) {
          flipCard(btn.id);
          return;
        }
      }
      if (pointerInRect(cardBackLeaderboardRect)) {
        leaderboardCharacterFilter = cardBackLeaderboardRect.characterId;
        openLeaderboard(RUN_STATE.SELECTING, true);
        return;
      }
      for (let i = 0; i < tileRects.length; i++) {
        const tile = tileRects[i];
        if (tile.y + tile.h <= charSelectGridTop || tile.y >= charSelectGridBottom) continue;
        if (flippedCardId === tile.id) continue;
        if (pointerInRect(tile)) {
          chooseCharacter(tile.index);
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.GAME_OVER) {
      if (lastTimestamp !== null && lastTimestamp - run.gameOverTime < GAME_OVER_GUARD) return;
      if (pointerInRect(gameOverLeaderboardRect)) {
        openLeaderboard(RUN_STATE.GAME_OVER);
        return;
      }
      if (pointerInRect(gameOverChangeRect)) {
        run.state = RUN_STATE.SELECTING;
        charSelectScrollY = 0;
        flippedCardId = null;
        tileRects = [];
        gameOverChangeRect = null;
        return;
      }
      run.state = RUN_STATE.HOME;
      return;
    }
    if (run.state === RUN_STATE.LEADERBOARD) {
      if (pointerInRect(leaderboardBackRect)) {
        closeLeaderboard();
        return;
      }
      return;
    }
    if (run.state === RUN_STATE.HALL_OF_FAME || run.state === RUN_STATE.PLAYER_STATS) {
      if (pointerInRect(stubBackRect)) {
        run.state = RUN_STATE.HOME;
        return;
      }
      return;
    }
    // PLAYING — throw logic
    if (throw_.state !== STATE.IDLE) return;
    throw_.state     = STATE.CHARGING;
    throw_.meterFill = 0;
    throw_.meterDir  = 1;
    throw_.sweetCenter = SWEET_CENTER_MIN + Math.random() * (SWEET_CENTER_MAX - SWEET_CENTER_MIN);
    updateSweetSpotBounds();
    throw_.inSweetSpot = false;
  }

  function onPressEnd() {
    if (throw_.state !== STATE.CHARGING) return;
    const f = throw_.meterFill;
    const sweetCenter = throw_.sweetCenter;
    throw_.inSweetSpot = f >= difficulty.sweetSpotMin && f <= difficulty.sweetSpotMax;
    let throwMultiplier;
    if (f < sweetCenter) {
      throwMultiplier = THROW_MULT_MIN + (f / sweetCenter) * (1 - THROW_MULT_MIN);
    } else {
      const overPower = (f - sweetCenter) / (1 - sweetCenter);
      throwMultiplier = 1 + overPower * overPower * (THROW_MULT_MAX - 1);
    }
    throw_.state = STATE.FLYING;

    // Launch from player's hand height (top of player rect)
    const pitDistance = pitCenterX - playerX;
    throw_.originX    = playerX;
    throw_.originY    = playerY - 50;
    throw_.landingX   = playerX + pitDistance * throwMultiplier;
    throw_.landingY   = groundY;
    throw_.peakHeight = Math.abs(pitDistance) * THROW_PEAK_RATIO;
    throw_.duration   = THROW_DURATION;
    throw_.shovelX    = throw_.originX;
    throw_.shovelY    = throw_.originY;
    throw_.flightTime = 0;
    throw_.bounced    = false;
    throw_.angle      = 0;
    throw_.landedInPit = false;
  }

  let lastPointerX = 0;
  let lastPointerY = 0;
  let selectDragStartedInGrid = false;
  let selectDragScrolling = false;
  let selectDragLastY = 0;
  let selectDragTotal = 0;
  let leaderboardDragStartedInList = false;
  let leaderboardDragScrolling = false;
  let leaderboardDragLastY = 0;
  let leaderboardDragTotal = 0;

  function isInCharacterGrid(y) {
    return y >= charSelectGridTop && y <= charSelectGridBottom;
  }

  function isInLeaderboardList(y) {
    return y >= leaderboardListTop && y <= leaderboardListBottom;
  }

  function startSelectDrag(y) {
    selectDragStartedInGrid = run.state === RUN_STATE.SELECTING && isInCharacterGrid(y);
    selectDragScrolling = false;
    selectDragLastY = y;
    selectDragTotal = 0;
    return selectDragStartedInGrid;
  }

  function moveSelectDrag(y) {
    if (!selectDragStartedInGrid) return;
    const dy = y - selectDragLastY;
    selectDragLastY = y;
    selectDragTotal += Math.abs(dy);
    charSelectScrollY -= dy;
    if (selectDragTotal > 8) selectDragScrolling = true;
  }

  function finishSelectDrag() {
    const shouldSelect = selectDragStartedInGrid && !selectDragScrolling;
    selectDragStartedInGrid = false;
    selectDragScrolling = false;
    selectDragTotal = 0;
    return shouldSelect;
  }

  function startLeaderboardDrag(y) {
    leaderboardDragStartedInList = run.state === RUN_STATE.LEADERBOARD && isInLeaderboardList(y);
    leaderboardDragScrolling = false;
    leaderboardDragLastY = y;
    leaderboardDragTotal = 0;
    return leaderboardDragStartedInList;
  }

  function moveLeaderboardDrag(y) {
    if (!leaderboardDragStartedInList) return;
    const dy = y - leaderboardDragLastY;
    leaderboardDragLastY = y;
    leaderboardDragTotal += Math.abs(dy);
    leaderboardScrollY -= dy;
    if (leaderboardDragTotal > 8) leaderboardDragScrolling = true;
  }

  function finishLeaderboardDrag() {
    const shouldClick = leaderboardDragStartedInList && !leaderboardDragScrolling;
    leaderboardDragStartedInList = false;
    leaderboardDragScrolling = false;
    leaderboardDragTotal = 0;
    return shouldClick;
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    lastPointerX = t.clientX;
    lastPointerY = t.clientY;
    if (!startSelectDrag(lastPointerY) && !startLeaderboardDrag(lastPointerY)) onPressStart();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    lastPointerX = t.clientX;
    lastPointerY = t.clientY;
    moveSelectDrag(lastPointerY);
    moveLeaderboardDrag(lastPointerY);
  }, { passive: false });
  canvas.addEventListener('touchend',   (e) => {
    e.preventDefault();
    if (finishSelectDrag()) {
      onPressStart();
      return;
    }
    if (finishLeaderboardDrag()) {
      onPressStart();
      return;
    }
    onPressEnd();
  }, { passive: false });
  canvas.addEventListener('mousedown', (e) => {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    if (!startSelectDrag(lastPointerY) && !startLeaderboardDrag(lastPointerY)) onPressStart();
  });
  canvas.addEventListener('mousemove', (e) => {
    if (e.buttons !== 1) return;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    moveSelectDrag(lastPointerY);
    moveLeaderboardDrag(lastPointerY);
  });
  canvas.addEventListener('mouseup', (e) => {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    if (finishSelectDrag()) {
      onPressStart();
      return;
    }
    if (finishLeaderboardDrag()) {
      onPressStart();
      return;
    }
    onPressEnd();
  });
  canvas.addEventListener('wheel', (e) => {
    if (run.state === RUN_STATE.SELECTING) {
      charSelectScrollY += e.deltaY;
    } else if (run.state === RUN_STATE.LEADERBOARD) {
      leaderboardScrollY += e.deltaY;
    } else {
      return;
    }
    e.preventDefault();
  }, { passive: false });

  // --- Game loop ---
  function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (lastTimestamp === null) { lastTimestamp = timestamp; }
    const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50ms
    lastTimestamp = timestamp;

    if (run.state === RUN_STATE.USERNAME) {
      drawHome(timestamp);
      if (!usernameOverlayEl) openUsernameOverlay(RUN_STATE.HOME);
    } else if (run.state === RUN_STATE.HOME) {
      drawHome(timestamp);
    } else if (run.state === RUN_STATE.SELECTING) {
      drawCharacterSelect(timestamp);
    } else if (run.state === RUN_STATE.LEVEL_SELECT) {
      drawLevelSelect(timestamp);
    } else if (run.state === RUN_STATE.PLAYING) {
      update(dt, timestamp);
      draw();
    } else if (run.state === RUN_STATE.GAME_OVER) {
      draw();
      drawGameOverOverlay();
    } else if (run.state === RUN_STATE.LEADERBOARD) {
      drawLeaderboard();
    } else if (run.state === RUN_STATE.HALL_OF_FAME) {
      drawHallOfFame(timestamp);
    } else if (run.state === RUN_STATE.PLAYER_STATS) {
      drawPlayerStats(timestamp);
    }
  }

  function update(dt, timestamp) {
    // Oscillate meter while charging
    if (throw_.state === STATE.CHARGING) {
      throw_.meterFill += throw_.meterDir * difficulty.meterSpeed * dt;
      if (throw_.meterFill >= 1) { throw_.meterFill = 1; throw_.meterDir = -1; }
      if (throw_.meterFill <= 0) { throw_.meterFill = 0; throw_.meterDir =  1; }
    }

    // Update projectile position
    if (throw_.state === STATE.FLYING) {
      throw_.flightTime += dt;
      const t = Math.min(throw_.flightTime / throw_.duration, 1);
      throw_.shovelX = throw_.originX + (throw_.landingX - throw_.originX) * t;
      throw_.shovelY = throw_.originY + (throw_.landingY - throw_.originY) * t
        - throw_.peakHeight * 4 * t * (1 - t);

      // Wall bounce
      const hitWall = isLilItalyLevel() ? throw_.shovelX <= wallX : throw_.shovelX >= wallX;
      if (!throw_.bounced && hitWall) {
        if (throw_.shovelY >= wallTopY && throw_.shovelY < groundY) {
          const bounceLandingX = isLilItalyLevel()
            ? wallX + Math.abs(throw_.landingX - wallX) * BOUNCE_DAMPING
            : wallX - Math.abs(throw_.landingX - wallX) * BOUNCE_DAMPING;
          throw_.shovelX = wallX;
          throw_.originX = throw_.shovelX;
          throw_.originY = throw_.shovelY;
          throw_.landingX = bounceLandingX;
          throw_.peakHeight = Math.abs(throw_.landingX - throw_.originX) * THROW_PEAK_RATIO;
          throw_.duration = Math.max(THROW_DURATION * (1 - t), 0.12);
          throw_.flightTime = 0;
        }
        throw_.bounced = true;
      }

      throw_.angle += SHOVEL_ROT_RATE * dt;

      // Landing detection
      if (t >= 1) {
        throw_.shovelY = groundY;

        const result = {
          x:           throw_.shovelX,
          inPit:       throw_.shovelX >= pitLeft && throw_.shovelX <= pitRight,
          inSweetSpot: throw_.inSweetSpot
        };
        if (result.inPit) {
          spawnDustPuff(result.x, groundY - getPitLandingVisualYOffset());
        }
        onThrowResult(result, timestamp);
        if (scoring.lastThrowZone === 'stick') {
          throw_.angle = SHOVEL_STICK_ANGLE;
        }

        throw_.state        = STATE.RESETTING;
        throw_.landedInPit  = result.inPit;
        throw_.resetEndTime = timestamp + RESET_DELAY;
      }
    }

    // Feedback timer
    if (scoring.feedbackTimer > 0) {
      scoring.feedbackTimer = Math.max(0, scoring.feedbackTimer - dt * 1000);
    }

    if (dustPuff.active) {
      dustPuff.age += dt * 1000;
      dustPuff.frame = Math.min(
        DUST_PUFF_FRAMES - 1,
        Math.floor((dustPuff.age / DUST_PUFF_DURATION) * DUST_PUFF_FRAMES)
      );
      if (dustPuff.age >= DUST_PUFF_DURATION) {
        dustPuff.active = false;
      }
    }

    // Reset after pause
    if (throw_.state === STATE.RESETTING && timestamp >= throw_.resetEndTime) {
      throw_.meterFill = 0;
      throw_.meterDir  = 1;
      throw_.state     = STATE.IDLE;
      updateDifficulty(); // apply difficulty for next throw (throwCount already incremented)
    }
  }

  // --- Draw helpers ---
  function drawText(text, x, y, fontSize, color, align, bold) {
    ctx.font = `${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  function truncateText(text, maxWidth, fontSize, bold = false) {
    const value = String(text || '');
    if (maxWidth <= 0) return '';
    ctx.font = `${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    if (ctx.measureText(value).width <= maxWidth) return value;

    const ellipsis = '...';
    const ellipsisW = ctx.measureText(ellipsis).width;
    if (ellipsisW > maxWidth) return '';

    let lo = 0;
    let hi = value.length;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      if (ctx.measureText(value.slice(0, mid) + ellipsis).width <= maxWidth) {
        lo = mid;
      } else {
        hi = mid - 1;
      }
    }
    return value.slice(0, lo) + ellipsis;
  }

  function drawLifeIcons(x, y) {
    const iconW = Math.max(20, Math.min(LIFE_ICON_W, canvas.width * 0.06));
    const activeShovelImg = selectedCharacterId && CHAMPION_IDS.has(selectedCharacterId) && champShovelReady
      ? champShovelImg
      : (shovelReady ? shovelImg : null);
    const iconH = activeShovelImg
      ? iconW * activeShovelImg.naturalHeight / activeShovelImg.naturalWidth
      : iconW;
    const gap = 8;

    for (let i = 0; i < MISSES_PER_RUN; i++) {
      ctx.save();
      ctx.globalAlpha = i < run.missesRemaining ? 1 : 0.25;
      if (activeShovelImg) {
        ctx.drawImage(activeShovelImg, x + i * (iconW + gap), y - iconH, iconW, iconH);
      } else {
        ctx.fillStyle = '#c0c0c0';
        ctx.fillRect(x + i * (iconW + gap), y - iconH, iconW, iconH);
      }
      ctx.restore();
    }
  }

  function drawBackground() {
    if (backgroundReady) {
      const isPortrait = canvas.height > canvas.width;
      const coverScale = Math.max(canvas.width / backgroundImg.naturalWidth, canvas.height / backgroundImg.naturalHeight);
      const scale = isPortrait
        ? coverScale * 0.72
        : coverScale;
      const dW = backgroundImg.naturalWidth * scale;
      const dH = backgroundImg.naturalHeight * scale;
      const dx = (canvas.width - dW) / 2;
      const dy = isPortrait
        ? canvas.height - dH
        : (canvas.height - dH) / 2;
      ctx.drawImage(backgroundImg, dx, dy, dW, dH);
    } else {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  function getPitDrawRect() {
    const drawImg = getActivePitImg();
    const dW = isLilItalyLevel() ? pitRight : canvas.width - pitLeft;
    const dH = dW * drawImg.naturalHeight / drawImg.naturalWidth;
    return {
      img: drawImg,
      x: isLilItalyLevel() ? 0 : pitLeft,
      y: groundY - dH,
      w: dW,
      h: dH
    };
  }

  function drawPitLayer() {
    const rect = getPitDrawRect();
    ctx.drawImage(rect.img, rect.x, rect.y, rect.w, rect.h);
  }

  function drawPitFrontOverlay() {
    const rect = getPitDrawRect();
    const frontAssetH = getPitFrontOverlayAssetOffset();
    const overlayH = frontAssetH * (rect.w / rect.img.naturalWidth);
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y + rect.h - overlayH, rect.w, overlayH);
    ctx.clip();
    ctx.drawImage(rect.img, rect.x, rect.y, rect.w, rect.h);
    ctx.restore();
  }

  function drawPitFallback() {
    const pitDepth = 20;
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2;
    ctx.strokeRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
  }

  function drawDustPuff() {
    if (!dustPuff.active) return;
    if (dustPuffReady) {
      const frameW = dustPuffImg.naturalWidth / DUST_PUFF_FRAMES;
      ctx.drawImage(
        dustPuffImg,
        dustPuff.frame * frameW, 0, frameW, dustPuffImg.naturalHeight,
        dustPuff.x - DUST_PUFF_W / 2, dustPuff.y - DUST_PUFF_H / 2,
        DUST_PUFF_W, DUST_PUFF_H
      );
    } else {
      ctx.fillStyle = 'rgba(186, 147, 92, 0.7)';
      ctx.beginPath();
      ctx.ellipse(dustPuff.x, dustPuff.y, DUST_PUFF_W / 2, DUST_PUFF_H / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    drawBackground();

    // Pit back
    if (isPitReady()) {
      drawPitLayer();
    } else {
      drawPitFallback();
    }

    // Player
    if (characterReady) {
      const frame = throw_.state === STATE.CHARGING ? 1
                 : throw_.state === STATE.FLYING   ? 2
                 : 0;
      const renderW = CHARACTER_RENDER_H * (CHARACTER_FRAME_W / CHARACTER_FRAME_H);
      if (isLilItalyLevel()) {
        ctx.save();
        ctx.translate(playerX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(
          characterImg,
          frame * CHARACTER_FRAME_W, 0, CHARACTER_FRAME_W, CHARACTER_FRAME_H,
          -renderW / 2, playerY - CHARACTER_RENDER_H,
          renderW, CHARACTER_RENDER_H
        );
        ctx.restore();
      } else {
        ctx.drawImage(
          characterImg,
          frame * CHARACTER_FRAME_W, 0, CHARACTER_FRAME_W, CHARACTER_FRAME_H,
          playerX - renderW / 2, playerY - CHARACTER_RENDER_H,
          renderW, CHARACTER_RENDER_H
        );
      }
    } else if (!selectedCharacterId) {
      const pW = 28, pH = 50;
      ctx.fillStyle = '#e07b39';
      ctx.fillRect(playerX - pW / 2, playerY - pH, pW, pH);
    }

    // Shovel (during flight and brief reset pause)
    if (throw_.state === STATE.FLYING || throw_.state === STATE.RESETTING) {
      ctx.save();
      const shovelDrawY = throw_.state === STATE.RESETTING && throw_.landedInPit
        ? throw_.shovelY - getPitLandingVisualYOffset()
        : throw_.shovelY;
      ctx.translate(throw_.shovelX, shovelDrawY);
      ctx.rotate(throw_.angle);
      const activeShovelImg = selectedCharacterId && CHAMPION_IDS.has(selectedCharacterId) && champShovelReady
        ? champShovelImg
        : (shovelReady ? shovelImg : null);
      if (activeShovelImg) {
        const dH = SHOVEL_RENDER_W * activeShovelImg.naturalHeight / activeShovelImg.naturalWidth;
        ctx.drawImage(activeShovelImg, -SHOVEL_RENDER_W / 2, -dH / 2, SHOVEL_RENDER_W, dH);
      } else {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-14, -3, 20, 6);
        ctx.fillStyle = '#c0c0c0';
        ctx.fillRect(6, -5, 8, 10);
      }
      ctx.restore();
    }

    // Pit front rim
    if (isPitReady() && throw_.state === STATE.RESETTING && throw_.landedInPit) {
      drawPitFrontOverlay();
    }

    drawDustPuff();

    // Throw meter (visible while charging or flying)
    if (throw_.state === STATE.CHARGING || throw_.state === STATE.FLYING) {
      drawMeter();
    }

    // Idle hint
    if (throw_.state === STATE.IDLE) {
      drawText('Hold to charge', canvas.width / 2, canvas.height - Math.max(28, canvas.height * 0.06),
        Math.max(16, Math.floor(canvas.width * 0.042)), 'rgba(255,255,255,0.55)', 'center', false);
    }

    // HUD: left-stacked score -> lives
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const hudFontSize = isPhoneLandscape
      ? Math.max(28, Math.floor(canvas.height * 0.08))
      : Math.max(24, Math.floor(canvas.width * 0.07));
    const hudY = isPhoneLandscape
      ? safeTop + hudFontSize
      : meterY + meterHeight + HUD_PAD + hudFontSize;
    const subFontSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.04))
      : Math.max(16, Math.floor(canvas.width * 0.045));
    drawText(scoring.score, HUD_PAD, hudY, hudFontSize, '#ffffff', 'left', true);
    drawLifeIcons(HUD_PAD, hudY + subFontSize + 8);
    const playerName = username.get();
    const highScoreBadge = isScoreLeaderUsername(playerName) ? `${HIGH_SCORE_BADGE} ` : '';
    drawText(`${highScoreBadge}${playerName}`, canvas.width - HUD_PAD, hudY, subFontSize, '#ffffff', 'right', true);

    // Throw feedback text
    if (scoring.feedbackTimer > 0) {
      const alpha = Math.min(1, scoring.feedbackTimer / 500);
      ctx.globalAlpha = alpha;
      const fbFontSize = Math.max(18, Math.floor(canvas.width * 0.055));
      let zoneColor;
      if      (scoring.lastThrowZone === 'stick')      zoneColor = '#ffe600';
      else if (scoring.lastThrowZone === 'back_wall')  zoneColor = '#44dd44';
      else if (scoring.lastThrowZone === 'in_pit')     zoneColor = '#ffffff';
      else if (scoring.lastThrowZone === 'front_wall') zoneColor = '#aaaaaa';
      else                                             zoneColor = '#ff4444';
      drawText(scoring.lastThrowZone.toUpperCase().replace('_', ' '), canvas.width / 2, groundY - 60, fbFontSize, zoneColor, 'center', true);
      if (scoring.lastThrowPoints !== 0) {
        drawText(`${scoring.lastThrowPoints > 0 ? '+' : ''}${scoring.lastThrowPoints}`, canvas.width / 2, groundY - 60 + fbFontSize + 4,
          Math.max(14, Math.floor(canvas.width * 0.04)), '#ffffff', 'center', false);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMeter() {
    const r = 4;

    // Background track
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.fill();

    // Sweet-spot band
    const sweetX = meterX + meterWidth * difficulty.sweetSpotMin;
    const sweetW = meterWidth * (difficulty.sweetSpotMax - difficulty.sweetSpotMin);
    ctx.fillStyle = 'rgba(255, 220, 0, 0.25)';
    ctx.beginPath();
    ctx.roundRect(sweetX, meterY, sweetW, meterHeight, r);
    ctx.fill();

    // Fill bar (left-to-right)
    const fillW = meterWidth * throw_.meterFill;
    const inSweetSpot = throw_.meterFill >= difficulty.sweetSpotMin && throw_.meterFill <= difficulty.sweetSpotMax;
    ctx.fillStyle = inSweetSpot ? '#ffe600' : '#ff6b35';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, fillW, meterHeight, r);
    ctx.fill();

    // Border
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.stroke();

    // Label
    drawText('POWER', meterX + meterWidth / 2, meterY + meterHeight + 14, 14, '#ffffff', 'center', false);
    drawText(`SPEED ${difficulty.meterSpeed.toFixed(2)}`, meterX + meterWidth / 2, meterY + meterHeight + 30, 12, '#ffffff', 'center', false);
  }

  function drawButton(rect, label, active = false) {
    ctx.fillStyle = active ? '#3f6f58' : '#2a2a4a';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 6);
    ctx.fill();
    ctx.stroke();
    const fontSize = rect.fontSize || Math.max(14, Math.min(18, Math.floor(canvas.width * 0.04)));
    if (rect.centered) {
      ctx.save();
      ctx.textBaseline = 'middle';
      drawText(label, rect.x + rect.w / 2, rect.y + rect.h / 2, fontSize, '#ffffff', 'center', false);
      ctx.restore();
      return;
    }
    drawText(label, rect.x + rect.w / 2, rect.y + rect.h * 0.64,
      fontSize, '#ffffff', 'center', false);
  }

  function drawCardBack(x, y, w, h, character) {
    ctx.fillStyle = '#20203a';
    ctx.strokeStyle = '#5555aa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.stroke();

    const titleSize = Math.max(13, Math.floor(w * 0.11));
    const rowSize = Math.max(10, Math.floor(w * 0.08));
    const pad = 10;
    drawText(character.id, x + w / 2, y + titleSize + pad, titleSize, '#ffffff', 'center', true);

    const contentTop = y + titleSize + pad * 2;
    const buttonH = Math.max(26, Math.floor(h * 0.14));
    const buttonW = Math.min(w - pad * 2, Math.max(104, Math.floor(w * 0.72)));
    const buttonRect = {
      x: x + (w - buttonW) / 2,
      y: y + h - buttonH - pad,
      w: buttonW,
      h: buttonH,
      fontSize: Math.max(11, Math.floor(rowSize * 0.95)),
      characterId: character.id
    };
    cardBackLeaderboardRect = buttonRect;

    if (flippedCardStatus === 'loading') {
      drawText('Loading…', x + w / 2, y + h / 2, rowSize, 'rgba(255,255,255,0.75)', 'center', false);
    } else if (flippedCardStatus === 'error') {
      drawText('Offline', x + w / 2, y + h / 2, rowSize, '#ff8888', 'center', false);
    } else if (flippedCardStatus === 'ready') {
      if (flippedCardRows.length === 0) {
        drawText('No scores yet', x + w / 2, y + h / 2, rowSize, 'rgba(255,255,255,0.75)', 'center', false);
      } else {
        const maxTextW = w - pad * 2;
        flippedCardRows.slice(0, 5).forEach((row, index) => {
          const rowText = `${index + 1}. ${row.name} — ${row.score}`;
          drawText(truncateText(rowText, maxTextW, rowSize), x + pad, contentTop + (index + 1) * (rowSize + 6), rowSize, '#ffffff', 'left', false);
        });
      }
    }

    drawButton(buttonRect, 'Leaderboard ›');
  }

  function formatScoreDate(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' });
  }

  function drawLeaderboard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(24, Math.floor(canvas.height * 0.09))
      : Math.max(30, Math.floor(canvas.width * 0.09));
    const subtitleSize = isPhoneLandscape
      ? Math.max(10, Math.floor(canvas.height * 0.035))
      : Math.max(12, Math.floor(canvas.width * 0.032));
    const bannerSize = isPhoneLandscape
      ? Math.max(10, Math.floor(canvas.height * 0.032))
      : Math.max(11, Math.floor(canvas.width * 0.03));
    const rowSize = isPhoneLandscape
      ? Math.max(12, Math.floor(canvas.height * 0.04))
      : Math.max(15, Math.floor(canvas.width * 0.04));
    const pad = isPhoneLandscape ? 12 : 20;
    const bannerText = '👋 Please let Max know if your score is not registered ❤';
    const bannerPadX = isPhoneLandscape ? 10 : 14;
    const bannerH = bannerSize + (isPhoneLandscape ? 8 : 10);
    const bannerY = Math.max(4, safeTop * 0.35);
    ctx.font = `${Math.round(bannerSize)}px sans-serif`;
    const bannerW = Math.min(canvas.width - pad * 2, Math.max(260, ctx.measureText(bannerText).width + bannerPadX * 2));
    const bannerX = cx - bannerW / 2;
    ctx.fillStyle = '#111126';
    ctx.beginPath();
    ctx.roundRect(bannerX, bannerY, bannerW, bannerH, 6);
    ctx.fill();
    drawText(truncateText(bannerText, bannerW - bannerPadX * 2, bannerSize), cx, bannerY + bannerH * 0.66, bannerSize, '#ffffff', 'center', false);

    const titleY = bannerY + bannerH + Math.floor(pad * 0.55) + titleSize;
    const subtitleY = titleY + subtitleSize + 6;
    drawText('LEADERBOARD', cx, titleY, titleSize, '#ffffff', 'center', true);
    drawText('Showing top 100 scores', cx, subtitleY, subtitleSize, 'rgba(255,255,255,0.65)', 'center', false);

    const selectFontSize = isPhoneLandscape ? 12 : 14;
    const selectTop = subtitleY + 8;
    const selectH = selectFontSize + 14;
    positionLeaderboardFilterSelect(selectTop, selectFontSize);

    const backW = Math.min(140, canvas.width * 0.36);
    const backH = Math.max(30, canvas.height * 0.048);
    const rows = leaderboard.globalRows;
    const listTop = selectTop + selectH + Math.floor(pad * 0.65);
    const listBottom = canvas.height - pad * 2 - backH;
    leaderboardListTop = listTop;
    leaderboardListBottom = listBottom;
    const dateSize = Math.max(10, Math.floor(rowSize * 0.76));
    const lineH = rowSize + 12;
    const listH = Math.max(0, listBottom - listTop);
    const listInsetTop = rowSize;
    const totalContentH = listInsetTop + rows.length * lineH;
    const maxScroll = Math.max(0, totalContentH - listH);
    leaderboardScrollY = Math.max(0, Math.min(leaderboardScrollY, maxScroll));
    if (leaderboard.globalStatus === 'loading') {
      drawText('Loading...', cx, listTop + rowSize, rowSize, 'rgba(255,255,255,0.75)', 'center', false);
    } else if (leaderboard.globalStatus === 'error') {
      drawText('offline', cx, listTop + rowSize, rowSize, '#ff8888', 'center', false);
    } else if (rows.length === 0) {
      drawText('No scores yet', cx, listTop + rowSize, rowSize, 'rgba(255,255,255,0.75)', 'center', false);
    } else {
      const leftX = Math.max(pad, cx - Math.min(260, canvas.width * 0.42));
      const scoreX = Math.min(canvas.width - pad, cx + Math.min(260, canvas.width * 0.42));
      const dateX = scoreX - Math.max(72, canvas.width * 0.17);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, listTop, canvas.width, listH);
      ctx.clip();
      rows.forEach((row, index) => {
        const y = listTop + listInsetTop + index * lineH - leaderboardScrollY;
        if (y + lineH < listTop || y > listBottom) return;
        if (index % 2 === 1) {
          ctx.fillStyle = '#111126';
          ctx.fillRect(leftX - 8, y - rowSize - 4, scoreX - leftX + 16, lineH);
        }
        const characterName = row.character_name ? ` (${row.character_name})` : '';
        const highScoreBadge = index === 0 ? ` ${HIGH_SCORE_BADGE}` : '';
        const scoreDate = formatScoreDate(row.created_at);
        const rankText = `${index + 1}. `;
        ctx.font = `${Math.round(rowSize)}px sans-serif`;
        ctx.font = `${Math.round(dateSize)}px sans-serif`;
        const dateW = scoreDate ? ctx.measureText(scoreDate).width : 0;
        ctx.font = `${Math.round(rowSize)}px sans-serif`;
        const nameRightX = scoreDate ? dateX - dateW - 12 : dateX;
        const nameMaxW = nameRightX - leftX - ctx.measureText(`${rankText}${characterName}${highScoreBadge}`).width;
        const nameText = truncateText(row.name, nameMaxW, rowSize);
        drawText(`${rankText}${nameText}${characterName}${highScoreBadge}`, leftX, y, rowSize, '#ffffff', 'left', false);
        if (scoreDate) {
          drawText(scoreDate, dateX, y, dateSize, 'rgba(255,255,255,0.58)', 'right', false);
        }
        drawText(row.score, scoreX, y, rowSize, '#ffe600', 'right', true);
      });
      ctx.restore();
    }

    leaderboardBackRect = { x: cx - backW / 2, y: canvas.height - pad - backH, w: backW, h: backH };
    drawButton({ ...leaderboardBackRect, fontSize: isPhoneLandscape ? 11 : 13 }, 'Back');
  }

  function drawCharacterSelect(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.04))
      : Math.max(16, Math.floor(canvas.width * 0.042));
    const homeTop = Math.max(4, safeTop * 0.45);
    const titleY = homeTop + titleSize;
    drawText('Choose your character', canvas.width / 2, titleY, titleSize, '#ffffff', 'center', true);

    const pad = isPhoneLandscape ? 10 : 16;
    selectHomeRect = {
      x: pad,
      y: Math.max(8, safeTop * 0.45),
      w: isPhoneLandscape ? 32 : 38,
      h: isPhoneLandscape ? 28 : 32,
      fontSize: isPhoneLandscape ? 17 : 20,
      centered: true
    };
    drawButton(selectHomeRect, '←');

    const name = username.get();
    usernameNameRect = null;
    if (name) {
      const nameSize = isPhoneLandscape
        ? Math.max(13, Math.floor(canvas.height * 0.04))
        : Math.max(15, Math.floor(canvas.width * 0.04));
      const nameText = `Player: ${name}`;
      const nameY = titleY + nameSize + 8;
      drawText(nameText, canvas.width / 2, nameY, nameSize, '#ffe600', 'center', false);
      const nameW = ctx.measureText(nameText).width;
      const iconSize = nameSize * 0.9;
      const iconX = canvas.width / 2 + nameW / 2 + iconSize;
      drawText('✏️', iconX, nameY, iconSize, '#ffffff', 'center', false);
      usernameNameRect = { x: canvas.width / 2 - nameW / 2 - 10, y: nameY - nameSize - 8, w: nameW + iconSize * 2 + 20, h: nameSize + 14 };
    }

    const isPortrait = canvas.height > canvas.width;
    const cols = isPortrait ? 2 : 4;
    const visibleCharacters = getFilteredCharacters();
    const rows = Math.ceil(visibleCharacters.length / cols);
    const nameOffset = name ? Math.max(18, canvas.height * 0.035) : 0;
    const topOffset = titleY + 4 + nameOffset + (isPhoneLandscape ? Math.floor(pad * 0.55) : pad);
    const filterGap = isPhoneLandscape ? 6 : 8;
    const filterButtonH = isPhoneLandscape ? 26 : 30;
    const filterButtonW = Math.min(isPhoneLandscape ? 84 : 98, (canvas.width - pad * 2 - filterGap * (CHARACTER_FILTERS.length - 1)) / CHARACTER_FILTERS.length);
    const filterW = filterButtonW * CHARACTER_FILTERS.length + filterGap * (CHARACTER_FILTERS.length - 1);
    const filterY = topOffset;
    filterRects = [];
    CHARACTER_FILTERS.forEach((filter, index) => {
      const rect = {
        id: filter.id,
        x: canvas.width / 2 - filterW / 2 + index * (filterButtonW + filterGap),
        y: filterY,
        w: filterButtonW,
        h: filterButtonH,
        fontSize: isPhoneLandscape ? 10 : 12
      };
      filterRects.push(rect);
      drawButton(rect, `${filter.label} (${getCharacterFilterCount(filter.id)})`, activeCharacterFilter === filter.id);
    });

    const targetTileW = Math.floor(Math.min(240, (canvas.width - pad * (cols + 1)) / cols));
    const tileW = targetTileW;
    const tileH = Math.floor(tileW * 1.25);
    charSelectGridTop = filterY + filterButtonH + pad;
    charSelectGridBottom = canvas.height - pad;
    const gridViewportH = charSelectGridBottom - charSelectGridTop;
    const totalContentH = rows * tileH + (rows - 1) * pad;
    const maxScroll = Math.max(0, totalContentH - gridViewportH);
    charSelectScrollY = Math.max(0, Math.min(charSelectScrollY, maxScroll));

    tileRects = [];
    cardFlipBtnRects = [];
    cardBackLeaderboardRect = null;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, charSelectGridTop, canvas.width, gridViewportH);
    ctx.clip();
    for (let i = 0; i < visibleCharacters.length; i++) {
      const character = visibleCharacters[i];
      const characterIndex = CHARACTERS.indexOf(character);
      const col = i % cols;
      const row = Math.floor(i / cols);
      const gridW = cols * tileW + (cols - 1) * pad;
      const gridX = Math.floor((canvas.width - gridW) / 2);
      const x = gridX + col * (tileW + pad);
      const y = charSelectGridTop + row * (tileH + pad) - charSelectScrollY;
      tileRects.push({ id: character.id, index: characterIndex, x, y, w: tileW, h: tileH });

      ctx.fillStyle = '#2a2a4a';
      ctx.strokeStyle = '#5555aa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, tileW, tileH, 8);
      ctx.fill();
      ctx.stroke();

      if (flippedCardId === character.id) {
        drawCardBack(x, y, tileW, tileH, character);
      } else {
        const heroImg = heroImages[character.id];
        if (heroImg && heroImg.complete && heroImg.naturalWidth > 0) {
          const imgAspect = heroImg.naturalWidth / heroImg.naturalHeight;
          const tileAspect = tileW / tileH;
          let drawW, drawH, drawX, drawY;
          if (imgAspect > tileAspect) {
            drawH = tileH - 8;
            drawW = drawH * imgAspect;
          } else {
            drawW = tileW - 8;
            drawH = drawW / imgAspect;
          }
          drawX = x + (tileW - drawW) / 2;
          drawY = y + 4;
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, tileW, tileH, 8);
          ctx.clip();
          ctx.drawImage(heroImg, drawX, drawY, drawW, drawH);
          ctx.restore();
        }

        const labelSize = isPhoneLandscape
          ? Math.max(12, Math.floor(canvas.height * 0.035))
          : Math.max(12, Math.floor(canvas.width * 0.03));
        if (NEW_CHARACTER_IDS.has(character.id)) {
          const badgeSize = Math.max(10, Math.floor(labelSize * 0.85));
          const badgeW = Math.max(42, badgeSize * 3.5);
          const badgeH = badgeSize + 8;
          ctx.fillStyle = '#ffe600';
          ctx.strokeStyle = '#111111';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(x + tileW - badgeW - 7, y + 7, badgeW, badgeH, 4);
          ctx.fill();
          ctx.stroke();
          drawText('NEW', x + tileW - badgeW / 2 - 7, y + 7 + badgeH * 0.68, badgeSize, '#111111', 'center', true);
        }

        const isChampion = CHAMPION_IDS.has(character.id);
        drawText(character.id, x + 8, y + labelSize + 6, labelSize, '#ffffff', 'left', false);
        if (isChampion) {
          if (championImg.complete && championImg.naturalWidth > 0) {
            const badgeW = Math.floor(tileW * 0.78);
            const badgeH = Math.floor(tileW * 0.48);
            ctx.drawImage(championImg, x + (tileW - badgeW) / 2, y + tileH - badgeH + 4, badgeW, badgeH);
          }
        }
      }

      const flipBtnSize = Math.max(22, Math.floor(tileW * 0.18));
      const isFlippedCard = flippedCardId === character.id;
      const flipBtnX = x + tileW - flipBtnSize - 6;
      const flipBtnY = isFlippedCard ? y + 6 : y + tileH - flipBtnSize - 6;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.arc(flipBtnX + flipBtnSize / 2, flipBtnY + flipBtnSize / 2, flipBtnSize / 2, 0, Math.PI * 2);
      ctx.fill();
      drawText(isFlippedCard ? '×' : 'i',
        flipBtnX + flipBtnSize / 2, flipBtnY + flipBtnSize * (isFlippedCard ? 0.69 : 0.72),
        flipBtnSize * (isFlippedCard ? 0.72 : 0.6), '#ffffff', 'center', true);
      cardFlipBtnRects.push({
        id: character.id,
        x: flipBtnX,
        y: flipBtnY,
        w: flipBtnSize,
        h: flipBtnSize
      });
    }
    ctx.restore();
  }

  function drawLevelSelect(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const gameTitleSize = isPhoneLandscape
      ? Math.max(26, Math.floor(canvas.height * 0.10))
      : Math.max(34, Math.floor(canvas.width * 0.10));
    const titleSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.04))
      : Math.max(16, Math.floor(canvas.width * 0.042));
    drawText('SHOVEL TOSS', canvas.width / 2, safeTop + gameTitleSize, gameTitleSize, '#ffffff', 'center', true);
    drawText('Choose your level', canvas.width / 2, safeTop + gameTitleSize + titleSize + 8, titleSize, '#ffffff', 'center', true);

    const pad = isPhoneLandscape ? 10 : 16;
    const buttonW = Math.min(220, canvas.width * 0.5);
    const buttonH = Math.max(38, canvas.height * 0.06);
    levelBackRect = {
      x: canvas.width / 2 - buttonW / 2,
      y: canvas.height - pad - buttonH,
      w: buttonW,
      h: buttonH
    };
    drawButton(levelBackRect, 'Back');

    const isPortrait = canvas.height > canvas.width;
    const cols = isPortrait ? 1 : 2;
    const rows = Math.ceil(LEVELS.length / cols);
    const listTop = safeTop + gameTitleSize + titleSize + pad * 3;
    const listBottom = levelBackRect.y - pad;
    const tileW = Math.floor(Math.min(360, (canvas.width - pad * (cols + 1)) / cols));
    const tileH = Math.floor(Math.max(80, Math.min(tileW * 0.62, (listBottom - listTop - pad * (rows - 1)) / rows)));
    const gridW = cols * tileW + (cols - 1) * pad;
    const gridH = rows * tileH + (rows - 1) * pad;
    const gridX = Math.floor((canvas.width - gridW) / 2);
    const gridY = Math.floor(listTop + Math.max(0, (listBottom - listTop - gridH) / 2));

    levelTileRects = [];
    for (let i = 0; i < LEVELS.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = gridX + col * (tileW + pad);
      const y = gridY + row * (tileH + pad);
      levelTileRects.push({ id: LEVELS[i].id, x, y, w: tileW, h: tileH });

      ctx.fillStyle = '#2a2a4a';
      ctx.strokeStyle = '#5555aa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, tileW, tileH, 8);
      ctx.fill();
      ctx.stroke();

      const img = levelImages[LEVELS[i].id];
      if (img && img.complete && img.naturalWidth > 0) {
        const imgAspect = img.naturalWidth / img.naturalHeight;
        const tileAspect = tileW / tileH;
        let drawW, drawH;
        if (imgAspect > tileAspect) {
          drawH = tileH;
          drawW = drawH * imgAspect;
        } else {
          drawW = tileW;
          drawH = drawW / imgAspect;
        }
        const drawX = x + (tileW - drawW) / 2;
        const drawY = y + (tileH - drawH) / 2;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, tileW, tileH, 8);
        ctx.clip();
        ctx.drawImage(img, drawX, drawY, drawW, drawH);
        ctx.restore();
      }

      const stripH = Math.max(34, Math.floor(tileH * 0.24));
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(x, y + tileH - stripH, tileW, stripH);
      const labelSize = isPhoneLandscape
        ? Math.max(14, Math.floor(canvas.height * 0.045))
        : Math.max(16, Math.floor(canvas.width * 0.042));
      drawText(LEVELS[i].label, x + tileW / 2, y + tileH - stripH / 2 + labelSize * 0.35, labelSize, '#ffffff', 'center', true);
    }
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(28, Math.floor(canvas.height * 0.11))
      : Math.max(32, Math.floor(canvas.width * 0.10));
    const scoreSize = isPhoneLandscape
      ? Math.max(18, Math.floor(canvas.height * 0.06))
      : Math.max(22, Math.floor(canvas.width * 0.06));
    const statsSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.045))
      : Math.max(16, Math.floor(canvas.width * 0.045));
    const restartSize = isPhoneLandscape
      ? Math.max(16, Math.floor(canvas.height * 0.05))
      : Math.max(18, Math.floor(canvas.width * 0.05));
    const titleY = isPhoneLandscape ? safeTop + canvas.height * 0.20 : safeTop + canvas.height * 0.34;
    const scoreY = isPhoneLandscape ? safeTop + canvas.height * 0.34 : safeTop + canvas.height * 0.43;
    const globalY = isPhoneLandscape ? safeTop + canvas.height * 0.48 : safeTop + canvas.height * 0.53;
    const buttonW = isPhoneLandscape
      ? Math.min(210, (canvas.width - HUD_PAD * 3) / 2)
      : Math.min(240, canvas.width * 0.62);
    const buttonH = Math.max(42, canvas.height * 0.07);
    const buttonGap = Math.max(8, canvas.height * 0.015);
    const topButtonY = isPhoneLandscape
      ? canvas.height - safeTop - buttonH
      : safeTop + canvas.height * 0.77;
    const restartY = isPhoneLandscape ? topButtonY - 12 : safeTop + canvas.height * 0.61;
    drawText('GAME OVER', cx, titleY,
      titleSize, '#ffffff', 'center', true);
    drawText(`Score: ${scoring.score}`, cx, scoreY,
      scoreSize, '#ffe600', 'center', false);
    if (gameOverSave.globalMessage) {
      const color = gameOverSave.globalStatus === 'error' ? '#ff8888' : 'rgba(255,255,255,0.78)';
      drawText(gameOverSave.globalMessage, cx, globalY,
        statsSize, color, 'center', false);
    }
    drawText('Tap for Menu', cx, restartY,
      restartSize, 'rgba(255,255,255,0.7)', 'center', false);
    if (isPhoneLandscape) {
      const rowX = cx - buttonW - buttonGap / 2;
      gameOverLeaderboardRect = { x: rowX, y: topButtonY, w: buttonW, h: buttonH };
      gameOverChangeRect = { x: rowX + buttonW + buttonGap, y: topButtonY, w: buttonW, h: buttonH };
    } else {
      gameOverLeaderboardRect = { x: cx - buttonW / 2, y: topButtonY, w: buttonW, h: buttonH };
      gameOverChangeRect = { x: cx - buttonW / 2, y: topButtonY + buttonH + buttonGap, w: buttonW, h: buttonH };
    }
    drawButton(gameOverLeaderboardRect, 'Leaderboard');
    drawButton(gameOverChangeRect, 'Change Character');
  }

  // --- Init ---
  window.addEventListener('resize', updateLayout);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastTimestamp = null;
  });
  updateLayout();
  fetchGlobalLeaderboardWhenReady();
  if (run.state === RUN_STATE.USERNAME) openUsernameOverlay(RUN_STATE.HOME);
  requestAnimationFrame(gameLoop);
</script>
</body>
