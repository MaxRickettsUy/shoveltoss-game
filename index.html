<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shovel Toss</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script type="module" src="src/globalScores.js"></script>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let CHARACTER_FRAME_W = 0;
  let CHARACTER_FRAME_H = 0;
  const characterImg = new Image();
  let characterReady = false;
  characterImg.onload = () => {
    CHARACTER_FRAME_W = characterImg.naturalWidth / 3;
    CHARACTER_FRAME_H = characterImg.naturalHeight;
    characterReady = true;
  };

  const pitBackImg = new Image();
  const pitFrontImg = new Image();
  let pitReady = false;
  let pitBackReady = false;
  let pitFrontReady = false;
  function onPitLayerLoad() {
    pitReady = pitBackReady && pitFrontReady;
    if (pitReady && canvas.width > 0) updateLayout();
  }
  pitBackImg.onload = () => { pitBackReady = true; onPitLayerLoad(); };
  pitFrontImg.onload = () => { pitFrontReady = true; onPitLayerLoad(); };
  pitBackImg.src = 'assets/pit-back.png';
  pitFrontImg.src = 'assets/pit-front.png';

  const dustPuffImg = new Image();
  let dustPuffReady = false;
  dustPuffImg.onload = () => { dustPuffReady = true; };
  dustPuffImg.src = 'assets/dust-puff.png';

  const shovelImg = new Image();
  let shovelReady = false;
  shovelImg.onload = () => { shovelReady = true; };
  shovelImg.src = 'assets/shovel.png';

  const backgroundImg = new Image();
  let backgroundReady = false;
  backgroundImg.onload = () => { backgroundReady = true; };
  backgroundImg.src = 'assets/house.png';

  const CHARACTERS = [
    { id: 'Wagie',    hero: 'assets/character/wagie/hero.png',    sprite: 'assets/character/wagie/sprite-sheet.png' },
    { id: 'Chef',     hero: 'assets/character/chef/hero.png',     sprite: 'assets/character/chef/sprite-sheet.png' },
    { id: 'Chuggo',   hero: 'assets/character/chuggo/hero.png',   sprite: 'assets/character/chuggo/sprite-sheet.png' },
    { id: 'Princess', hero: 'assets/character/princess/hero.png', sprite: 'assets/character/princess/sprite-sheet.png' },
    { id: 'Shrek',    hero: 'assets/character/shrek/hero.png',    sprite: 'assets/character/shrek/sprite-sheet.png' },
    { id: 'Luchador',    hero: 'assets/character/luchador/hero.png',    sprite: 'assets/character/luchador/sprite-sheet.png' },
  ];

  let selectedCharacterId = null;
  let gameOverChangeRect = null;
  let gameOverLeaderboardRect = null;
  let selectLeaderboardRect = null;
  let leaderboardBackRect = null;
  let leaderboardTabRects = {};
  const heroImages = {};
  CHARACTERS.forEach(c => {
    const img = new Image();
    img.src = c.hero;
    heroImages[c.id] = img;
  });

  let tileRects = [];

  // --- Constants ---
  const ASPECT_LANDSCAPE = 0.6;
  const ASPECT_PORTRAIT  = 1.5;
  const THROW_MULT_MIN = 0.25;
  const THROW_MULT_MAX = 2.6;
  const THROW_DURATION = 0.6;         // seconds from launch to landing
  const THROW_PEAK_RATIO = 0.4;
  const METER_CYCLE_TIME = 0.85;     // seconds per full meter cycle
  const METER_SPEED = 2 / METER_CYCLE_TIME;
  const METER_SPEED_INCREMENT_PER_THROW = 0.15;
  const PIT_WIDTH_LANDSCAPE = 0.22;  // pit width as fraction of canvas in landscape
  const PIT_WIDTH_PORTRAIT  = 0.44;  // pit width as fraction of canvas in portrait
  const SWEET_SPOT_CENTER    = 0.50;
  const SWEET_SPOT_HALF_START = 0.10;
  const RESET_DELAY = 500;           // ms pause after landing
  const MISSES_PER_RUN = 3;
  const GAME_OVER_GUARD = 500;       // ms input guard after game over
  const PTS_STICK           = 3;
  const PTS_BACK_WALL       = 2;
  const PTS_IN_PIT          = 1;
  const PTS_FRONT_WALL      = 0;
  const PTS_MISS            = -2;
  const ZONE_FRONT_WALL_MAX = 0.10;
  const ZONE_BACK_WALL_MIN  = 0.90;
  const SHOVEL_ROT_RATE   = 9;
  const FEEDBACK_DURATION = 1500;    // ms to show throw feedback
  const HUD_PAD = 20;                // px padding for HUD elements
  const BOUNCE_DAMPING = 0.6;
  const WALL_GAP = 12;               // px between pit edge and wall
  const WALL_THICKNESS = 8;
  const METER_HEIGHT_FRACTION = 0.06;
  const METER_WIDTH_FRACTION = 0.385;
  const SWEET_SPOT_WIDTH = (SWEET_SPOT_HALF_START * 2) * 0.35;
  const SWEET_SPOT_SHRINK_PER_STICK = 0.008;
  const SWEET_SPOT_MIN_WIDTH = 0.03;
  const WALL_HEIGHT_FRACTION = 0.30;
  const CHARACTER_RENDER_H = 150;
  const SHOVEL_RENDER_W = 40;
  const LIFE_ICON_W = 24;
  const DUST_PUFF_FRAMES = 3;
  const DUST_PUFF_DURATION = 250;
  const DUST_PUFF_W = 54;
  const DUST_PUFF_H = 27;
  const PIT_LANDING_VISUAL_ASSET_OFFSET = 270;
  const LAST_NAME_KEY = 'shoveltoss.lastName';
  const GLOBAL_SCORE_LIMIT = 100;

  // --- State enums ---
  const RUN_STATE = { SELECTING: 'selecting', PLAYING: 'playing', GAME_OVER: 'game_over', LEADERBOARD: 'leaderboard' };
  const STATE = {
    IDLE:      'idle',
    CHARGING:  'charging',
    FLYING:    'flying',
    RESETTING: 'resetting'
  };

  // --- State objects ---
  const run = {
    state:       RUN_STATE.SELECTING,
    throwCount:  0,
    missesRemaining: MISSES_PER_RUN,
    gameOverTime: 0,
    lastStateBeforeLeaderboard: RUN_STATE.SELECTING
  };

  const throw_ = {
    state:       STATE.IDLE,
    meterFill:   0,
    meterDir:    1,
    power:       0,
    inSweetSpot: false,
    shovelX:     0,
    shovelY:     0,
    flightTime:  0,
    originX:     0,
    originY:     0,
    landingX:    0,
    landingY:    0,
    peakHeight:  0,
    duration:    THROW_DURATION,
    resetEndTime: 0,
    bounced: false,
    angle: 0,
    landedInPit: false
  };

  const scoring = {
    score:           0,
    hitsInRun:       0,
    lastThrowPoints: 0,
    lastThrowZone:   '',
    feedbackTimer:   0
  };

  const dustPuff = {
    active: false,
    x: 0,
    y: 0,
    age: 0,
    frame: 0
  };

  const difficulty = {
    meterSpeed:     METER_SPEED,
    pitWidth:       PIT_WIDTH_LANDSCAPE,
    sweetSpotWidth: SWEET_SPOT_WIDTH,
    sweetSpotMin:   SWEET_SPOT_CENTER - SWEET_SPOT_WIDTH / 2,
    sweetSpotMax:   SWEET_SPOT_CENTER + SWEET_SPOT_WIDTH / 2
  };

  const leaderboard = {
    globalRows: [],
    globalStatus: 'idle',
    globalError: ''
  };

  const gameOverSave = {
    completed: false,
    name: '',
    globalStatus: 'idle',
    globalMessage: ''
  };

  // --- Loop-level (not game state) ---
  let lastTimestamp = null;

  // --- Layout (recalculated on resize) ---
  let groundY, playerX, playerY;
  let pitLeft, pitRight, pitCenterX, wallX, wallTopY;
  let meterX, meterY, meterWidth, meterHeight;
  let safeTop;

  function updateLayout() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    safeTop  = Math.max(20, canvas.height * 0.04);
    groundY  = canvas.height * 0.82;
    wallTopY = groundY - canvas.height * WALL_HEIGHT_FRACTION;
    playerX  = canvas.width  * 0.10;
    playerY  = groundY;

    pitCenterX = canvas.width * 0.80;  // far end; pitLeft/pitRight set by updateDifficulty
    updateDifficulty();

    // Meter: narrowed and centered at top
    meterWidth = Math.max(220, canvas.width * METER_WIDTH_FRACTION);
    meterX = (canvas.width - meterWidth) / 2;
    meterY = safeTop;
    meterHeight = Math.max(36, canvas.height * METER_HEIGHT_FRACTION);
  }

  // --- Difficulty ---
  function updateDifficulty() {
    const aspect = canvas.height / canvas.width;
    const tA = Math.max(0, Math.min(1, (aspect - ASPECT_LANDSCAPE) / (ASPECT_PORTRAIT - ASPECT_LANDSCAPE)));
    difficulty.pitWidth = PIT_WIDTH_LANDSCAPE + tA * (PIT_WIDTH_PORTRAIT - PIT_WIDTH_LANDSCAPE);
    const half = difficulty.sweetSpotWidth / 2;
    difficulty.sweetSpotMin = SWEET_SPOT_CENTER - half;
    difficulty.sweetSpotMax = SWEET_SPOT_CENTER + half;
    const halfWidth = canvas.width * difficulty.pitWidth / 2;
    pitLeft  = pitCenterX - halfWidth;
    wallX    = canvas.width - WALL_THICKNESS;
    pitRight = wallX;
    if (pitReady) {
      const dW = canvas.width - pitLeft;
      wallTopY = groundY - dW * pitBackImg.naturalHeight / pitBackImg.naturalWidth;
    }
  }

  function resetDifficultyRamp() {
    difficulty.meterSpeed = METER_SPEED;
    difficulty.sweetSpotWidth = SWEET_SPOT_WIDTH;
    updateDifficulty();
  }

  function sanitizeName(name) {
    const clean = String(name || '').trim().slice(0, 20);
    return clean || 'Player';
  }

  function promptForScoreName() {
    const lastName = localStorage.getItem(LAST_NAME_KEY) || 'Player';
    return sanitizeName(window.prompt('Name for leaderboard:', lastName));
  }

  function openLeaderboard(fromState = run.state) {
    run.lastStateBeforeLeaderboard = fromState === RUN_STATE.LEADERBOARD
      ? run.lastStateBeforeLeaderboard
      : fromState;
    run.state = RUN_STATE.LEADERBOARD;
    fetchGlobalLeaderboard();
  }

  function closeLeaderboard() {
    run.state = run.lastStateBeforeLeaderboard || RUN_STATE.SELECTING;
  }

  async function fetchGlobalLeaderboard() {
    leaderboard.globalStatus = 'loading';
    leaderboard.globalError = '';
    try {
      leaderboard.globalRows = await window.globalScores.topN(GLOBAL_SCORE_LIMIT);
      leaderboard.globalStatus = 'ready';
    } catch {
      leaderboard.globalRows = [];
      leaderboard.globalStatus = 'error';
      leaderboard.globalError = 'offline';
    }
  }

  async function submitGlobalScore(name, score, characterName) {
    gameOverSave.globalStatus = 'loading';
    // gameOverSave.globalMessage = 'Global: submitting...';
    try {
      if (score <= 0) throw new Error('score');
      await window.globalScores.submit(name, score, characterName);
      const rows = await window.globalScores.topN(GLOBAL_SCORE_LIMIT);
      leaderboard.globalRows = rows;
      leaderboard.globalStatus = 'ready';
      const rank = rows.findIndex(row => score >= row.score);
      gameOverSave.globalStatus = 'ready';
      gameOverSave.globalMessage = rank === -1
        ? 'Global: outside top 100'
        : `Global rank: #${rank + 1}`;
    } catch {
      gameOverSave.globalStatus = 'error';
      // gameOverSave.globalMessage = 'Global: offline';
    }
  }

  // --- Run-level functions ---
  function endRun(timestamp) {
    run.state       = RUN_STATE.GAME_OVER;
    run.gameOverTime = timestamp;
    resetDifficultyRamp();
    saveGameOverScore();
  }

  function saveGameOverScore() {
    if (gameOverSave.completed) return;
    const name = promptForScoreName();
    gameOverSave.completed = true;
    gameOverSave.name = name;
    localStorage.setItem(LAST_NAME_KEY, name);
    submitGlobalScore(name, scoring.score, selectedCharacterId);
  }

  function resetRun() {
    run.throwCount       = 0;
    run.missesRemaining  = MISSES_PER_RUN;
    run.state            = RUN_STATE.PLAYING;
    throw_.state         = STATE.IDLE;
    throw_.meterFill     = 0;
    throw_.meterDir      = 1;
    throw_.power         = 0;
    scoring.score           = 0;
    scoring.hitsInRun       = 0;
    scoring.lastThrowPoints = 0;
    scoring.lastThrowZone   = '';
    scoring.feedbackTimer   = 0;
    dustPuff.active = false;
    dustPuff.age    = 0;
    gameOverSave.completed     = false;
    gameOverSave.name          = '';
    gameOverSave.globalStatus  = 'idle';
    gameOverSave.globalMessage = '';
    throw_.inSweetSpot      = false;
    throw_.bounced          = false;
    throw_.angle            = 0;
    throw_.landedInPit      = false;
    resetDifficultyRamp();
  }

  // --- Result hook ---
  function onThrowResult(result, timestamp) {
    console.log('Throw result:', result);

    // Scoring
    let zone, basePoints;

    if (!result.inPit) {
      zone = 'miss';
      basePoints = PTS_MISS;
    } else {
      const norm = (result.x - pitLeft) / (pitRight - pitLeft);
      if (norm < ZONE_FRONT_WALL_MAX) {
        zone = 'front_wall'; basePoints = PTS_FRONT_WALL;
      } else if (result.inSweetSpot) {
        zone = 'stick';      basePoints = PTS_STICK;
      } else if (norm > ZONE_BACK_WALL_MIN) {
        zone = 'back_wall';  basePoints = PTS_BACK_WALL;
      } else {
        zone = 'in_pit';     basePoints = PTS_IN_PIT;
      }
    }

    if (basePoints > 0) {
      scoring.hitsInRun++;
      scoring.lastThrowPoints = basePoints;
    } else {
      scoring.lastThrowPoints = basePoints;
      if (zone !== 'miss') scoring.hitsInRun++;
    }

    scoring.lastThrowZone  = zone;
    scoring.score         += scoring.lastThrowPoints;
    scoring.feedbackTimer  = FEEDBACK_DURATION;

    run.throwCount++;
    difficulty.meterSpeed += METER_SPEED_INCREMENT_PER_THROW;
    if (zone === 'stick') {
      difficulty.sweetSpotWidth = Math.max(
        difficulty.sweetSpotWidth - SWEET_SPOT_SHRINK_PER_STICK,
        SWEET_SPOT_MIN_WIDTH
      );
    }
    if (zone === 'miss') {
      run.missesRemaining--;
    }
    if (run.missesRemaining === 0) {
      endRun(timestamp);
    }
  }

  function spawnDustPuff(x, y) {
    dustPuff.active = true;
    dustPuff.x = x;
    dustPuff.y = y;
    dustPuff.age = 0;
    dustPuff.frame = 0;
  }

  function getPitLandingVisualYOffset() {
    if (!pitReady) return 0;
    const pitScale = (canvas.width - pitLeft) / pitBackImg.naturalWidth;
    return PIT_LANDING_VISUAL_ASSET_OFFSET * pitScale;
  }

  // --- Input ---
  function chooseCharacter(index) {
    selectedCharacterId = CHARACTERS[index].id;
    characterReady = false;
    characterImg.src = CHARACTERS[index].sprite;
    resetRun();
  }

  function onPressStart() {
    if (run.state === RUN_STATE.SELECTING) {
      if (selectLeaderboardRect &&
          lastPointerX >= selectLeaderboardRect.x && lastPointerX <= selectLeaderboardRect.x + selectLeaderboardRect.w &&
          lastPointerY >= selectLeaderboardRect.y && lastPointerY <= selectLeaderboardRect.y + selectLeaderboardRect.h) {
        openLeaderboard(RUN_STATE.SELECTING);
        return;
      }
      for (let i = 0; i < tileRects.length; i++) {
        const tile = tileRects[i];
        if (lastPointerX >= tile.x && lastPointerX <= tile.x + tile.w &&
            lastPointerY >= tile.y && lastPointerY <= tile.y + tile.h) {
          chooseCharacter(i);
          return;
        }
      }
      return;
    }
    if (run.state === RUN_STATE.GAME_OVER) {
      if (lastTimestamp !== null && lastTimestamp - run.gameOverTime < GAME_OVER_GUARD) return;
      if (gameOverLeaderboardRect &&
          lastPointerX >= gameOverLeaderboardRect.x && lastPointerX <= gameOverLeaderboardRect.x + gameOverLeaderboardRect.w &&
          lastPointerY >= gameOverLeaderboardRect.y && lastPointerY <= gameOverLeaderboardRect.y + gameOverLeaderboardRect.h) {
        openLeaderboard(RUN_STATE.GAME_OVER);
        return;
      }
      if (gameOverChangeRect &&
          lastPointerX >= gameOverChangeRect.x && lastPointerX <= gameOverChangeRect.x + gameOverChangeRect.w &&
          lastPointerY >= gameOverChangeRect.y && lastPointerY <= gameOverChangeRect.y + gameOverChangeRect.h) {
        run.state = RUN_STATE.SELECTING;
        tileRects = [];
        gameOverChangeRect = null;
        return;
      }
      resetRun();
      return;
    }
    if (run.state === RUN_STATE.LEADERBOARD) {
      if (leaderboardBackRect &&
          lastPointerX >= leaderboardBackRect.x && lastPointerX <= leaderboardBackRect.x + leaderboardBackRect.w &&
          lastPointerY >= leaderboardBackRect.y && lastPointerY <= leaderboardBackRect.y + leaderboardBackRect.h) {
        closeLeaderboard();
        return;
      }
      return;
    }
    // PLAYING — throw logic
    if (throw_.state !== STATE.IDLE) return;
    throw_.state     = STATE.CHARGING;
    throw_.meterFill = 0;
    throw_.meterDir  = 1;
    throw_.inSweetSpot = false;
  }

  function onPressEnd() {
    if (throw_.state !== STATE.CHARGING) return;
    const f = throw_.meterFill;
    throw_.inSweetSpot = f >= difficulty.sweetSpotMin && f <= difficulty.sweetSpotMax;
    let throwMultiplier;
    if (f < SWEET_SPOT_CENTER) {
      throwMultiplier = THROW_MULT_MIN + (f / SWEET_SPOT_CENTER) * (1 - THROW_MULT_MIN);
    } else {
      const overPower = (f - SWEET_SPOT_CENTER) / (1 - SWEET_SPOT_CENTER);
      throwMultiplier = 1 + overPower * overPower * (THROW_MULT_MAX - 1);
    }
    throw_.power = (throwMultiplier - THROW_MULT_MIN) / (THROW_MULT_MAX - THROW_MULT_MIN);
    throw_.state = STATE.FLYING;

    // Launch from player's hand height (top of player rect)
    const pitDistance = pitCenterX - playerX;
    throw_.originX    = playerX;
    throw_.originY    = playerY - 50;
    throw_.landingX   = playerX + pitDistance * throwMultiplier;
    throw_.landingY   = groundY;
    throw_.peakHeight = pitDistance * THROW_PEAK_RATIO;
    throw_.duration   = THROW_DURATION;
    throw_.shovelX    = throw_.originX;
    throw_.shovelY    = throw_.originY;
    throw_.flightTime = 0;
    throw_.bounced    = false;
    throw_.angle      = 0;
    throw_.landedInPit = false;
  }

  let lastPointerX = 0;
  let lastPointerY = 0;

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    lastPointerX = t.clientX;
    lastPointerY = t.clientY;
    onPressStart();
  }, { passive: false });
  canvas.addEventListener('touchend',   (e) => { e.preventDefault(); onPressEnd(); }, { passive: false });
  canvas.addEventListener('mousedown', (e) => {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    onPressStart();
  });
  canvas.addEventListener('mouseup',   onPressEnd);

  // --- Game loop ---
  function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (lastTimestamp === null) { lastTimestamp = timestamp; }
    const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50ms
    lastTimestamp = timestamp;

    if (run.state === RUN_STATE.SELECTING) {
      drawCharacterSelect(timestamp);
    } else if (run.state === RUN_STATE.PLAYING) {
      update(dt, timestamp);
      draw();
    } else if (run.state === RUN_STATE.GAME_OVER) {
      draw();
      drawGameOverOverlay();
    } else if (run.state === RUN_STATE.LEADERBOARD) {
      drawLeaderboard();
    }
  }

  function update(dt, timestamp) {
    // Oscillate meter while charging
    if (throw_.state === STATE.CHARGING) {
      throw_.meterFill += throw_.meterDir * difficulty.meterSpeed * dt;
      if (throw_.meterFill >= 1) { throw_.meterFill = 1; throw_.meterDir = -1; }
      if (throw_.meterFill <= 0) { throw_.meterFill = 0; throw_.meterDir =  1; }
    }

    // Update projectile position
    if (throw_.state === STATE.FLYING) {
      throw_.flightTime += dt;
      const t = Math.min(throw_.flightTime / throw_.duration, 1);
      throw_.shovelX = throw_.originX + (throw_.landingX - throw_.originX) * t;
      throw_.shovelY = throw_.originY + (throw_.landingY - throw_.originY) * t
        - throw_.peakHeight * 4 * t * (1 - t);

      // Wall bounce
      if (!throw_.bounced && throw_.shovelX >= wallX) {
        if (throw_.shovelY >= wallTopY && throw_.shovelY < groundY) {
          const bounceLandingX = wallX - Math.abs(throw_.landingX - wallX) * BOUNCE_DAMPING;
          throw_.shovelX = wallX;
          throw_.originX = throw_.shovelX;
          throw_.originY = throw_.shovelY;
          throw_.landingX = bounceLandingX;
          throw_.peakHeight = Math.abs(throw_.landingX - throw_.originX) * THROW_PEAK_RATIO;
          throw_.duration = Math.max(THROW_DURATION * (1 - t), 0.12);
          throw_.flightTime = 0;
        }
        throw_.bounced = true;
      }

      throw_.angle += SHOVEL_ROT_RATE * dt;

      // Landing detection
      if (t >= 1) {
        throw_.shovelY = groundY;

        const result = {
          landed:             true,
          x:                  throw_.shovelX,
          inPit:              throw_.shovelX >= pitLeft && throw_.shovelX <= pitRight,
          distanceFromCenter: throw_.shovelX - pitCenterX,
          power:              throw_.power,
          inSweetSpot:        throw_.inSweetSpot
        };
        if (result.inPit) {
          spawnDustPuff(result.x, groundY - getPitLandingVisualYOffset());
        }
        onThrowResult(result, timestamp);

        throw_.state        = STATE.RESETTING;
        throw_.landedInPit  = result.inPit;
        throw_.resetEndTime = timestamp + RESET_DELAY;
      }
    }

    // Feedback timer
    if (scoring.feedbackTimer > 0) {
      scoring.feedbackTimer = Math.max(0, scoring.feedbackTimer - dt * 1000);
    }

    if (dustPuff.active) {
      dustPuff.age += dt * 1000;
      dustPuff.frame = Math.min(
        DUST_PUFF_FRAMES - 1,
        Math.floor((dustPuff.age / DUST_PUFF_DURATION) * DUST_PUFF_FRAMES)
      );
      if (dustPuff.age >= DUST_PUFF_DURATION) {
        dustPuff.active = false;
      }
    }

    // Reset after pause
    if (throw_.state === STATE.RESETTING && timestamp >= throw_.resetEndTime) {
      throw_.meterFill = 0;
      throw_.meterDir  = 1;
      throw_.power     = 0;
      throw_.state     = STATE.IDLE;
      updateDifficulty(); // apply difficulty for next throw (throwCount already incremented)
    }
  }

  // --- Draw helpers ---
  function drawText(text, x, y, fontSize, color, align, bold) {
    ctx.font = `${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  function drawLifeIcons(x, y) {
    const iconW = Math.max(20, Math.min(LIFE_ICON_W, canvas.width * 0.06));
    const iconH = shovelReady
      ? iconW * shovelImg.naturalHeight / shovelImg.naturalWidth
      : iconW;
    const gap = 8;

    for (let i = 0; i < MISSES_PER_RUN; i++) {
      ctx.save();
      ctx.globalAlpha = i < run.missesRemaining ? 1 : 0.25;
      if (shovelReady) {
        ctx.drawImage(shovelImg, x + i * (iconW + gap), y - iconH, iconW, iconH);
      } else {
        ctx.fillStyle = '#c0c0c0';
        ctx.fillRect(x + i * (iconW + gap), y - iconH, iconW, iconH);
      }
      ctx.restore();
    }
  }

  function drawBackground() {
    if (backgroundReady) {
      const scale = Math.max(canvas.width / backgroundImg.naturalWidth, canvas.height / backgroundImg.naturalHeight);
      const dW = backgroundImg.naturalWidth * scale;
      const dH = backgroundImg.naturalHeight * scale;
      const dx = (canvas.width - dW) / 2;
      const dy = (canvas.height - dH) / 2;
      ctx.drawImage(backgroundImg, dx, dy, dW, dH);
    } else {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  function drawPitLayer(img) {
    const dW = canvas.width - pitLeft;
    const dH = dW * img.naturalHeight / img.naturalWidth;
    ctx.drawImage(img, pitLeft, groundY - dH, dW, dH);
  }

  function drawPitFallback() {
    const pitDepth = 20;
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2;
    ctx.strokeRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
  }

  function drawDustPuff() {
    if (!dustPuff.active) return;
    if (dustPuffReady) {
      const frameW = dustPuffImg.naturalWidth / DUST_PUFF_FRAMES;
      ctx.drawImage(
        dustPuffImg,
        dustPuff.frame * frameW, 0, frameW, dustPuffImg.naturalHeight,
        dustPuff.x - DUST_PUFF_W / 2, dustPuff.y - DUST_PUFF_H / 2,
        DUST_PUFF_W, DUST_PUFF_H
      );
    } else {
      ctx.fillStyle = 'rgba(186, 147, 92, 0.7)';
      ctx.beginPath();
      ctx.ellipse(dustPuff.x, dustPuff.y, DUST_PUFF_W / 2, DUST_PUFF_H / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    drawBackground();

    // Pit back
    if (pitReady) {
      drawPitLayer(pitBackImg);
    } else {
      drawPitFallback();
    }

    // Player
    if (characterReady) {
      const frame = throw_.state === STATE.CHARGING ? 1
                 : throw_.state === STATE.FLYING   ? 2
                 : 0;
      ctx.drawImage(
        characterImg,
        frame * CHARACTER_FRAME_W, 0, CHARACTER_FRAME_W, CHARACTER_FRAME_H,
        playerX - (CHARACTER_RENDER_H * (CHARACTER_FRAME_W / CHARACTER_FRAME_H)) / 2, playerY - CHARACTER_RENDER_H,
        CHARACTER_RENDER_H * (CHARACTER_FRAME_W / CHARACTER_FRAME_H), CHARACTER_RENDER_H
      );
    } else if (!selectedCharacterId) {
      const pW = 28, pH = 50;
      ctx.fillStyle = '#e07b39';
      ctx.fillRect(playerX - pW / 2, playerY - pH, pW, pH);
    }

    // Shovel (during flight and brief reset pause)
    if (throw_.state === STATE.FLYING || throw_.state === STATE.RESETTING) {
      ctx.save();
      const shovelDrawY = throw_.state === STATE.RESETTING && throw_.landedInPit
        ? throw_.shovelY - getPitLandingVisualYOffset()
        : throw_.shovelY;
      ctx.translate(throw_.shovelX, shovelDrawY);
      ctx.rotate(throw_.angle);
      if (shovelReady) {
        const dH = SHOVEL_RENDER_W * shovelImg.naturalHeight / shovelImg.naturalWidth;
        ctx.drawImage(shovelImg, -SHOVEL_RENDER_W / 2, -dH / 2, SHOVEL_RENDER_W, dH);
      } else {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-14, -3, 20, 6);
        ctx.fillStyle = '#c0c0c0';
        ctx.fillRect(6, -5, 8, 10);
      }
      ctx.restore();
    }

    // Pit front rim
    if (pitReady) {
      drawPitLayer(pitFrontImg);
    }

    drawDustPuff();

    // Throw meter (visible while charging or flying)
    if (throw_.state === STATE.CHARGING || throw_.state === STATE.FLYING) {
      drawMeter();
    }

    // Idle hint
    if (throw_.state === STATE.IDLE) {
      drawText('Hold to charge', canvas.width / 2, canvas.height - Math.max(28, canvas.height * 0.06),
        Math.max(16, Math.floor(canvas.width * 0.042)), 'rgba(255,255,255,0.55)', 'center', false);
    }

    // HUD: left-stacked score -> lives
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const hudFontSize = isPhoneLandscape
      ? Math.max(28, Math.floor(canvas.height * 0.08))
      : Math.max(24, Math.floor(canvas.width * 0.07));
    const hudY = isPhoneLandscape
      ? safeTop + hudFontSize
      : meterY + meterHeight + HUD_PAD + hudFontSize;
    const subFontSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.04))
      : Math.max(16, Math.floor(canvas.width * 0.045));
    drawText(scoring.score, HUD_PAD, hudY, hudFontSize, '#ffffff', 'left', true);
    drawLifeIcons(HUD_PAD, hudY + subFontSize + 8);

    // Throw feedback text
    if (scoring.feedbackTimer > 0) {
      const alpha = Math.min(1, scoring.feedbackTimer / 500);
      ctx.globalAlpha = alpha;
      const fbFontSize = Math.max(18, Math.floor(canvas.width * 0.055));
      let zoneColor;
      if      (scoring.lastThrowZone === 'stick')      zoneColor = '#ffe600';
      else if (scoring.lastThrowZone === 'back_wall')  zoneColor = '#44dd44';
      else if (scoring.lastThrowZone === 'in_pit')     zoneColor = '#ffffff';
      else if (scoring.lastThrowZone === 'front_wall') zoneColor = '#aaaaaa';
      else                                             zoneColor = '#ff4444';
      drawText(scoring.lastThrowZone.toUpperCase().replace('_', ' '), canvas.width / 2, groundY - 60, fbFontSize, zoneColor, 'center', true);
      if (scoring.lastThrowPoints !== 0) {
        drawText(`${scoring.lastThrowPoints > 0 ? '+' : ''}${scoring.lastThrowPoints}`, canvas.width / 2, groundY - 60 + fbFontSize + 4,
          Math.max(14, Math.floor(canvas.width * 0.04)), '#ffffff', 'center', false);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMeter() {
    const r = 4;

    // Background track
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.fill();

    // Sweet-spot band
    const sweetX = meterX + meterWidth * difficulty.sweetSpotMin;
    const sweetW = meterWidth * (difficulty.sweetSpotMax - difficulty.sweetSpotMin);
    ctx.fillStyle = 'rgba(255, 220, 0, 0.25)';
    ctx.beginPath();
    ctx.roundRect(sweetX, meterY, sweetW, meterHeight, r);
    ctx.fill();

    // Fill bar (left-to-right)
    const fillW = meterWidth * throw_.meterFill;
    const inSweetSpot = throw_.meterFill >= difficulty.sweetSpotMin && throw_.meterFill <= difficulty.sweetSpotMax;
    ctx.fillStyle = inSweetSpot ? '#ffe600' : '#ff6b35';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, fillW, meterHeight, r);
    ctx.fill();

    // Border
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.stroke();

    // Label
    drawText('POWER', meterX + meterWidth / 2, meterY + meterHeight + 14, 14, '#ffffff', 'center', false);
    drawText(`SPEED ${difficulty.meterSpeed.toFixed(2)}`, meterX + meterWidth / 2, meterY + meterHeight + 30, 12, '#ffffff', 'center', false);
  }

  function drawButton(rect, label, active = false) {
    ctx.fillStyle = active ? '#3f6f58' : '#2a2a4a';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 6);
    ctx.fill();
    ctx.stroke();
    drawText(label, rect.x + rect.w / 2, rect.y + rect.h * 0.64,
      Math.max(14, Math.min(18, Math.floor(canvas.width * 0.04))), '#ffffff', 'center', false);
  }

  function drawLeaderboard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(24, Math.floor(canvas.height * 0.09))
      : Math.max(30, Math.floor(canvas.width * 0.09));
    const rowSize = isPhoneLandscape
      ? Math.max(12, Math.floor(canvas.height * 0.04))
      : Math.max(15, Math.floor(canvas.width * 0.04));
    const pad = isPhoneLandscape ? 12 : 20;
    drawText('LEADERBOARD', cx, safeTop + titleSize, titleSize, '#ffffff', 'center', true);

    leaderboardTabRects = {};

    const rows = leaderboard.globalRows;
    const listTop = safeTop + titleSize + pad * 2;
    const lineH = rowSize + 10;
    const maxRows = Math.max(1, Math.floor((canvas.height - listTop - pad * 4) / lineH));
    if (leaderboard.globalStatus === 'loading') {
      drawText('Loading...', cx, listTop + rowSize, rowSize, 'rgba(255,255,255,0.75)', 'center', false);
    } else if (leaderboard.globalStatus === 'error') {
      drawText('offline', cx, listTop + rowSize, rowSize, '#ff8888', 'center', false);
    } else if (rows.length === 0) {
      drawText('No scores yet', cx, listTop + rowSize, rowSize, 'rgba(255,255,255,0.75)', 'center', false);
    } else {
      const leftX = Math.max(pad, cx - Math.min(260, canvas.width * 0.42));
      const scoreX = Math.min(canvas.width - pad, cx + Math.min(260, canvas.width * 0.42));
      rows.slice(0, maxRows).forEach((row, index) => {
        const y = listTop + index * lineH;
        const characterName = row.character_name ? ` (${row.character_name})` : '';
        drawText(`#${index + 1} ${row.name}${characterName}`, leftX, y, rowSize, '#ffffff', 'left', false);
        drawText(row.score, scoreX, y, rowSize, '#ffe600', 'right', true);
      });
    }

    const backW = Math.min(220, canvas.width * 0.55);
    const backH = Math.max(40, canvas.height * 0.065);
    leaderboardBackRect = { x: cx - backW / 2, y: canvas.height - pad - backH, w: backW, h: backH };
    drawButton(leaderboardBackRect, 'Back');
  }

  function drawCharacterSelect(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const gameTitleSize = isPhoneLandscape
      ? Math.max(26, Math.floor(canvas.height * 0.10))
      : Math.max(34, Math.floor(canvas.width * 0.10));
    const titleSize = isPhoneLandscape
      ? Math.max(22, Math.floor(canvas.height * 0.08))
      : Math.max(24, Math.floor(canvas.width * 0.08));
    drawText('SHOVEL TOSS', canvas.width / 2, safeTop + gameTitleSize, gameTitleSize, '#ffffff', 'center', true);
    drawText('Choose your character', canvas.width / 2, safeTop + gameTitleSize + titleSize + 8, titleSize, '#ffffff', 'center', true);

    const buttonW = Math.min(220, canvas.width * 0.5);
    const buttonH = Math.max(38, canvas.height * 0.06);
    selectLeaderboardRect = {
      x: canvas.width / 2 - buttonW / 2,
      y: canvas.height - buttonH - (isPhoneLandscape ? 8 : 16),
      w: buttonW,
      h: buttonH
    };
    drawButton(selectLeaderboardRect, 'Leaderboard');

    const isPortrait = canvas.height > canvas.width;
    const cols = isPhoneLandscape ? CHARACTERS.length : (isPortrait ? 2 : 3);
    const rows = Math.ceil(CHARACTERS.length / cols);
    const pad = isPhoneLandscape ? 10 : 16;
    const topOffset = safeTop + gameTitleSize + titleSize + 8 + (isPhoneLandscape ? pad : pad * 2);
    const availW = canvas.width - pad * (cols + 1);
    const availH = selectLeaderboardRect.y - topOffset - pad * (rows + 1);
    const tileW = Math.floor(availW / cols);
    const tileH = Math.floor(availH / rows);

    tileRects = [];
    for (let i = 0; i < CHARACTERS.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = pad + col * (tileW + pad);
      const y = topOffset + pad + row * (tileH + pad);
      tileRects.push({ id: CHARACTERS[i].id, x, y, w: tileW, h: tileH });

      ctx.fillStyle = '#2a2a4a';
      ctx.strokeStyle = '#5555aa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, tileW, tileH, 8);
      ctx.fill();
      ctx.stroke();

      const heroImg = heroImages[CHARACTERS[i].id];
      if (heroImg && heroImg.complete && heroImg.naturalWidth > 0) {
        const imgAspect = heroImg.naturalWidth / heroImg.naturalHeight;
        const tileAspect = tileW / tileH;
        let drawW, drawH, drawX, drawY;
        if (imgAspect > tileAspect) {
          drawH = tileH - 8;
          drawW = drawH * imgAspect;
        } else {
          drawW = tileW - 8;
          drawH = drawW / imgAspect;
        }
        drawX = x + (tileW - drawW) / 2;
        drawY = y + 4;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, tileW, tileH, 8);
        ctx.clip();
        ctx.drawImage(heroImg, drawX, drawY, drawW, drawH);
        ctx.restore();
      }

      const labelSize = isPhoneLandscape
        ? Math.max(12, Math.floor(canvas.height * 0.035))
        : Math.max(12, Math.floor(canvas.width * 0.03));
      drawText(CHARACTERS[i].id, x + tileW / 2, y + tileH - 6, labelSize, '#ffffff', 'center', false);
    }
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const isPhoneLandscape = canvas.width > canvas.height && canvas.height <= 500;
    const titleSize = isPhoneLandscape
      ? Math.max(28, Math.floor(canvas.height * 0.11))
      : Math.max(32, Math.floor(canvas.width * 0.10));
    const scoreSize = isPhoneLandscape
      ? Math.max(18, Math.floor(canvas.height * 0.06))
      : Math.max(22, Math.floor(canvas.width * 0.06));
    const statsSize = isPhoneLandscape
      ? Math.max(14, Math.floor(canvas.height * 0.045))
      : Math.max(16, Math.floor(canvas.width * 0.045));
    const restartSize = isPhoneLandscape
      ? Math.max(16, Math.floor(canvas.height * 0.05))
      : Math.max(18, Math.floor(canvas.width * 0.05));
    const titleY = isPhoneLandscape ? safeTop + canvas.height * 0.20 : safeTop + canvas.height * 0.34;
    const scoreY = isPhoneLandscape ? safeTop + canvas.height * 0.34 : safeTop + canvas.height * 0.43;
    const globalY = isPhoneLandscape ? safeTop + canvas.height * 0.48 : safeTop + canvas.height * 0.53;
    const buttonW = isPhoneLandscape
      ? Math.min(210, (canvas.width - HUD_PAD * 3) / 2)
      : Math.min(240, canvas.width * 0.62);
    const buttonH = Math.max(42, canvas.height * 0.07);
    const buttonGap = Math.max(8, canvas.height * 0.015);
    const topButtonY = isPhoneLandscape
      ? canvas.height - safeTop - buttonH
      : safeTop + canvas.height * 0.77;
    const restartY = isPhoneLandscape ? topButtonY - 12 : safeTop + canvas.height * 0.61;
    drawText('GAME OVER', cx, titleY,
      titleSize, '#ffffff', 'center', true);
    drawText(`Score: ${scoring.score}`, cx, scoreY,
      scoreSize, '#ffe600', 'center', false);
    if (gameOverSave.globalMessage) {
      const color = gameOverSave.globalStatus === 'error' ? '#ff8888' : 'rgba(255,255,255,0.78)';
      drawText(gameOverSave.globalMessage, cx, globalY,
        statsSize, color, 'center', false);
    }
    drawText('Tap to Restart', cx, restartY,
      restartSize, 'rgba(255,255,255,0.7)', 'center', false);
    if (isPhoneLandscape) {
      const rowX = cx - buttonW - buttonGap / 2;
      gameOverLeaderboardRect = { x: rowX, y: topButtonY, w: buttonW, h: buttonH };
      gameOverChangeRect = { x: rowX + buttonW + buttonGap, y: topButtonY, w: buttonW, h: buttonH };
    } else {
      gameOverLeaderboardRect = { x: cx - buttonW / 2, y: topButtonY, w: buttonW, h: buttonH };
      gameOverChangeRect = { x: cx - buttonW / 2, y: topButtonY + buttonH + buttonGap, w: buttonW, h: buttonH };
    }
    drawButton(gameOverLeaderboardRect, 'Leaderboard');
    drawButton(gameOverChangeRect, 'Change Character');
  }

  // --- Init ---
  window.addEventListener('resize', updateLayout);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastTimestamp = null;
  });
  updateLayout();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
