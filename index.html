<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shovel Toss</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- Constants ---
  const ANGLE_LANDSCAPE  = Math.PI * 35 / 180;
  const ANGLE_PORTRAIT   = Math.PI * 65 / 180;
  const ASPECT_LANDSCAPE = 0.6;
  const ASPECT_PORTRAIT  = 1.5;
  const V_MIN = 300;                 // px/s, weak lob
  const V_MAX = 800;                 // px/s, full send
  const G = 600;                     // px/s², gravity
  const METER_CYCLE_TIME     = 1.2;  // seconds per cycle at throw 0 (easiest)
  const METER_CYCLE_TIME_END = 0.45; // seconds per cycle at final throw (hardest)
  const PIT_WIDTH = 0.22;            // pit width as fraction of canvas (constant)
  const SWEET_SPOT_CENTER    = 0.80;
  const SWEET_SPOT_HALF_START = 0.10;
  const SWEET_SPOT_HALF_END   = 0.05;
  const RESET_DELAY = 500;           // ms pause after landing
  const THROWS_PER_RUN = 5;          // placeholder: throws before game over
  const GAME_OVER_GUARD = 500;       // ms input guard after game over
  const ZONE_PERFECT = 0.15;         // fraction of pitHalfWidth
  const ZONE_GREAT   = 0.45;
  const PTS_PERFECT  = 100;
  const PTS_GREAT    = 75;
  const PTS_GOOD     = 50;
  const FEEDBACK_DURATION = 1500;    // ms to show throw feedback
  const HUD_PAD = 20;                // px padding for HUD elements
  const BOUNCE_DAMPING = 0.6;
  const WALL_GAP = 12;               // px between pit edge and wall
  const WALL_THICKNESS = 8;
  const METER_HEIGHT_FRACTION = 0.06;
  const METER_WIDTH_FRACTION = 0.55;
  const WALL_HEIGHT_FRACTION = 0.30;

  // --- State enums ---
  const RUN_STATE = { READY: 'ready', PLAYING: 'playing', GAME_OVER: 'game_over' };
  const STATE = {
    IDLE:      'idle',
    CHARGING:  'charging',
    FLYING:    'flying',
    RESETTING: 'resetting'
  };

  // --- State objects ---
  const run = {
    state:       RUN_STATE.READY,
    throwCount:  0,
    gameOverTime: 0
  };

  const throw_ = {
    state:       STATE.IDLE,
    meterFill:   0,
    meterDir:    1,
    power:       0,
    shovelX:     0,
    shovelY:     0,
    flightTime:  0,
    launchVX:    0,
    launchVY:    0,
    originX:     0,
    originY:     0,
    resetEndTime: 0,
    bounced: false
  };

  const scoring = {
    score:           0,
    combo:           0,
    hitsInRun:       0,
    lastThrowPoints: 0,
    lastThrowZone:   '',
    feedbackTimer:   0
  };

  const difficulty = {
    meterCycleTime: METER_CYCLE_TIME,
    pitWidth:       PIT_WIDTH,
    sweetMin:       SWEET_SPOT_CENTER - SWEET_SPOT_HALF_START,
    sweetMax:       SWEET_SPOT_CENTER + SWEET_SPOT_HALF_START
  };

  // --- Loop-level (not game state) ---
  let lastTimestamp = null;

  // --- Layout (recalculated on resize) ---
  let groundY, playerX, playerY;
  let pitLeft, pitRight, pitCenterX, wallX, wallTopY;
  let meterX, meterY, meterWidth, meterHeight;
  let safeTop, throwAngle;

  function updateLayout() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    safeTop  = Math.max(20, canvas.height * 0.04);
    groundY  = canvas.height * 0.82;
    wallTopY = groundY - canvas.height * WALL_HEIGHT_FRACTION;
    const aspect = canvas.height / canvas.width;
    const tA = Math.max(0, Math.min(1, (aspect - ASPECT_LANDSCAPE) / (ASPECT_PORTRAIT - ASPECT_LANDSCAPE)));
    throwAngle = ANGLE_LANDSCAPE + tA * (ANGLE_PORTRAIT - ANGLE_LANDSCAPE);
    playerX  = canvas.width  * 0.10;
    playerY  = groundY;

    pitCenterX = canvas.width * 0.80;  // far end; pitLeft/pitRight set by updateDifficulty
    updateDifficulty();

    // Meter: narrowed and centered at top
    meterWidth = Math.max(220, canvas.width * METER_WIDTH_FRACTION);
    meterX = (canvas.width - meterWidth) / 2;
    meterY = safeTop;
    meterHeight = Math.max(36, canvas.height * METER_HEIGHT_FRACTION);
  }

  // --- Difficulty ---
  function updateDifficulty() {
    const t = THROWS_PER_RUN <= 1 ? 0 : run.throwCount / (THROWS_PER_RUN - 1);
    difficulty.meterCycleTime = Math.max(0.4, METER_CYCLE_TIME + t * (METER_CYCLE_TIME_END - METER_CYCLE_TIME));
    difficulty.pitWidth = PIT_WIDTH;
    const half = SWEET_SPOT_HALF_START + t * (SWEET_SPOT_HALF_END - SWEET_SPOT_HALF_START);
    difficulty.sweetMin = SWEET_SPOT_CENTER - half;
    difficulty.sweetMax = SWEET_SPOT_CENTER + half;
    const halfWidth = canvas.width * difficulty.pitWidth / 2;
    pitLeft  = pitCenterX - halfWidth;
    pitRight = pitCenterX + halfWidth;
    wallX = Math.min(pitRight + WALL_GAP, canvas.width - WALL_THICKNESS);
  }

  // --- Run-level functions ---
  function endRun(timestamp) {
    run.state       = RUN_STATE.GAME_OVER;
    run.gameOverTime = timestamp;
  }

  function resetRun() {
    run.throwCount       = 0;
    run.state            = RUN_STATE.READY;
    throw_.state         = STATE.IDLE;
    throw_.meterFill     = 0;
    throw_.meterDir      = 1;
    throw_.power         = 0;
    scoring.score           = 0;
    scoring.combo           = 0;
    scoring.hitsInRun       = 0;
    scoring.lastThrowPoints = 0;
    scoring.lastThrowZone   = '';
    scoring.feedbackTimer   = 0;
    throw_.bounced          = false;
    updateDifficulty();
  }

  // --- Result hook ---
  function onThrowResult(result, timestamp) {
    console.log('Throw result:', result);

    // Scoring
    const pitHalfWidth = (pitRight - pitLeft) / 2;
    const absDist = Math.abs(result.distanceFromCenter);

    if (!result.inPit) {
      scoring.combo           = 0;
      scoring.lastThrowPoints = 0;
      scoring.lastThrowZone   = 'miss';
    } else {
      scoring.combo++;
      scoring.hitsInRun++;
      const comboMultiplier = 1 + (scoring.combo - 1) * 0.5;

      let base;
      if (absDist <= pitHalfWidth * ZONE_PERFECT) {
        base = PTS_PERFECT;
        scoring.lastThrowZone = 'perfect';
      } else if (absDist <= pitHalfWidth * ZONE_GREAT) {
        base = PTS_GREAT;
        scoring.lastThrowZone = 'great';
      } else {
        base = PTS_GOOD;
        scoring.lastThrowZone = 'good';
      }

      scoring.lastThrowPoints = Math.round(base * comboMultiplier);
      scoring.score += scoring.lastThrowPoints;
    }

    scoring.feedbackTimer = FEEDBACK_DURATION;

    run.throwCount++;
    if (run.throwCount >= THROWS_PER_RUN) {
      endRun(timestamp);
    }
  }

  // --- Input ---
  function onPressStart() {
    if (run.state === RUN_STATE.READY) {
      run.state      = RUN_STATE.PLAYING;
      run.throwCount = 0;
      throw_.state   = STATE.IDLE;
      return;
    }
    if (run.state === RUN_STATE.GAME_OVER) {
      if (lastTimestamp !== null && lastTimestamp - run.gameOverTime < GAME_OVER_GUARD) return;
      resetRun();
      return;
    }
    // PLAYING — throw logic
    if (throw_.state !== STATE.IDLE) return;
    throw_.state     = STATE.CHARGING;
    throw_.meterFill = 0;
    throw_.meterDir  = 1;
  }

  function onPressEnd() {
    if (throw_.state !== STATE.CHARGING) return;
    throw_.power = throw_.meterFill;
    throw_.state = STATE.FLYING;

    const V = V_MIN + throw_.power * (V_MAX - V_MIN);
    throw_.launchVX = V * Math.cos(throwAngle);
    throw_.launchVY = V * Math.sin(throwAngle);

    // Launch from player's hand height (top of player rect)
    throw_.originX    = playerX;
    throw_.originY    = playerY - 50;
    throw_.shovelX    = throw_.originX;
    throw_.shovelY    = throw_.originY;
    throw_.flightTime = 0;
    throw_.bounced    = false;
  }

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPressStart(); }, { passive: false });
  canvas.addEventListener('touchend',   (e) => { e.preventDefault(); onPressEnd();   }, { passive: false });
  canvas.addEventListener('mousedown', onPressStart);
  canvas.addEventListener('mouseup',   onPressEnd);

  // --- Game loop ---
  function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (lastTimestamp === null) { lastTimestamp = timestamp; }
    const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50ms
    lastTimestamp = timestamp;

    if (run.state === RUN_STATE.READY) {
      drawReadyScreen(timestamp);
    } else if (run.state === RUN_STATE.PLAYING) {
      update(dt, timestamp);
      draw();
    } else if (run.state === RUN_STATE.GAME_OVER) {
      draw();
      drawGameOverOverlay();
    }
  }

  function update(dt, timestamp) {
    // Oscillate meter while charging
    if (throw_.state === STATE.CHARGING) {
      const speed = 2 / difficulty.meterCycleTime; // 0→1→0 = 2 units per cycle
      throw_.meterFill += throw_.meterDir * speed * dt;
      if (throw_.meterFill >= 1) { throw_.meterFill = 1; throw_.meterDir = -1; }
      if (throw_.meterFill <= 0) { throw_.meterFill = 0; throw_.meterDir =  1; }
    }

    // Update projectile position
    if (throw_.state === STATE.FLYING) {
      throw_.flightTime += dt;
      const t = throw_.flightTime;
      throw_.shovelX = throw_.originX + throw_.launchVX * t;
      throw_.shovelY = throw_.originY - (throw_.launchVY * t - 0.5 * G * t * t);

      // Wall bounce
      if (!throw_.bounced
          && throw_.shovelX >= wallX
          && throw_.shovelY >= wallTopY
          && throw_.shovelY < groundY) {
        const vy = throw_.launchVY - G * throw_.flightTime;
        throw_.shovelX    = wallX;
        throw_.originX    = throw_.shovelX;
        throw_.originY    = throw_.shovelY;
        throw_.launchVX   = -Math.abs(throw_.launchVX) * BOUNCE_DAMPING;
        throw_.launchVY   = vy;
        throw_.flightTime = 0;
        throw_.bounced    = true;
      }

      // Landing detection
      if (throw_.shovelY >= groundY) {
        throw_.shovelY = groundY;

        const result = {
          landed:             true,
          x:                  throw_.shovelX,
          inPit:              throw_.shovelX >= pitLeft && throw_.shovelX <= pitRight,
          distanceFromCenter: throw_.shovelX - pitCenterX,
          power:              throw_.power
        };
        onThrowResult(result, timestamp);

        throw_.state        = STATE.RESETTING;
        throw_.resetEndTime = timestamp + RESET_DELAY;
      }
    }

    // Feedback timer
    if (scoring.feedbackTimer > 0) {
      scoring.feedbackTimer = Math.max(0, scoring.feedbackTimer - dt * 1000);
    }

    // Reset after pause
    if (throw_.state === STATE.RESETTING && timestamp >= throw_.resetEndTime) {
      throw_.meterFill = 0;
      throw_.meterDir  = 1;
      throw_.power     = 0;
      throw_.state     = STATE.IDLE;
      updateDifficulty(); // apply difficulty for next throw (throwCount already incremented)
    }
  }

  // --- Draw helpers ---
  function drawText(text, x, y, fontSize, color, align, bold) {
    ctx.font = `${bold ? 'bold ' : ''}${Math.round(fontSize)}px sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ground fill
    ctx.fillStyle = '#4a3728';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // Ground line
    ctx.strokeStyle = '#6b4f3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    // Pit zone
    const pitDepth = 20;
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2;
    ctx.strokeRect(pitLeft, groundY, pitRight - pitLeft, pitDepth);

    // Wall (just past pit right edge, visual only — 50% canvas height)
    ctx.fillStyle = '#3a3a4a';
    ctx.fillRect(wallX, wallTopY, WALL_THICKNESS, groundY - wallTopY);
    ctx.strokeStyle = '#6a6a8a';
    ctx.lineWidth = 2;
    ctx.strokeRect(wallX, wallTopY, WALL_THICKNESS, groundY - wallTopY);

    // Player placeholder (rectangle)
    const pW = 28, pH = 50;
    ctx.fillStyle = '#e07b39';
    ctx.fillRect(playerX - pW / 2, playerY - pH, pW, pH);

    // Shovel (during flight and brief reset pause)
    if (throw_.state === STATE.FLYING || throw_.state === STATE.RESETTING) {
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(throw_.shovelX - 8, throw_.shovelY - 5, 16, 10);
    }

    // Throw meter (visible while charging or flying)
    if (throw_.state === STATE.CHARGING || throw_.state === STATE.FLYING) {
      drawMeter();
    }

    // Idle hint
    if (throw_.state === STATE.IDLE) {
      drawText('Hold to charge', canvas.width / 2, groundY - 28,
        Math.max(16, Math.floor(canvas.width * 0.042)), 'rgba(255,255,255,0.55)', 'center', false);
    }

    // HUD: left-stacked score → throws → combo
    const hudFontSize = Math.max(24, Math.floor(canvas.width * 0.07));
    const hudY = meterY + meterHeight + HUD_PAD + hudFontSize;
    const subFontSize = Math.max(16, Math.floor(canvas.width * 0.045));
    drawText(scoring.score, HUD_PAD, hudY, hudFontSize, '#ffffff', 'left', true);
    drawText(`${run.throwCount} / ${THROWS_PER_RUN}`, HUD_PAD, hudY + subFontSize + 6, subFontSize, '#ffffff', 'left', false);

    // Combo badge (below throw counter)
    if (scoring.combo >= 2) {
      const comboFontSize = Math.max(14, Math.floor(canvas.width * 0.04));
      drawText(`x${scoring.combo} COMBO`, HUD_PAD, hudY + subFontSize + 6 + comboFontSize + 6, comboFontSize, '#ffe600', 'left', false);
    }

    // Throw feedback text
    if (scoring.feedbackTimer > 0) {
      const alpha = Math.min(1, scoring.feedbackTimer / 500);
      ctx.globalAlpha = alpha;
      const fbFontSize = Math.max(18, Math.floor(canvas.width * 0.055));
      let zoneColor;
      if (scoring.lastThrowZone === 'perfect')     zoneColor = '#ffe600';
      else if (scoring.lastThrowZone === 'great')  zoneColor = '#44dd44';
      else if (scoring.lastThrowZone === 'good')   zoneColor = '#ffffff';
      else                                         zoneColor = '#ff4444';
      drawText(scoring.lastThrowZone.toUpperCase(), canvas.width / 2, groundY - 60, fbFontSize, zoneColor, 'center', true);
      if (scoring.lastThrowPoints > 0) {
        drawText(`+${scoring.lastThrowPoints}`, canvas.width / 2, groundY - 60 + fbFontSize + 4,
          Math.max(14, Math.floor(canvas.width * 0.04)), '#ffffff', 'center', false);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMeter() {
    const r = 4;

    // Background track
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.fill();

    // Sweet-spot band
    const sweetX = meterX + meterWidth * difficulty.sweetMin;
    const sweetW = meterWidth * (difficulty.sweetMax - difficulty.sweetMin);
    ctx.fillStyle = 'rgba(255, 220, 0, 0.25)';
    ctx.beginPath();
    ctx.roundRect(sweetX, meterY, sweetW, meterHeight, r);
    ctx.fill();

    // Fill bar (left-to-right)
    const fillW = meterWidth * throw_.meterFill;
    const inSweet = throw_.meterFill >= difficulty.sweetMin && throw_.meterFill <= difficulty.sweetMax;
    ctx.fillStyle = inSweet ? '#ffe600' : '#ff6b35';
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, fillW, meterHeight, r);
    ctx.fill();

    // Border
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(meterX, meterY, meterWidth, meterHeight, r);
    ctx.stroke();

    // Label
    drawText('POWER', meterX + meterWidth / 2, meterY + meterHeight + 14, 14, '#ffffff', 'center', false);
  }

  function drawReadyScreen(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const titleSize = Math.max(36, Math.floor(canvas.width * 0.12));
    drawText('SHOVEL TOSS', canvas.width / 2, safeTop + canvas.height * 0.38, titleSize, '#ffffff', 'center', true);

    const pulseAlpha = 0.75 + 0.25 * Math.sin(timestamp / 700);
    ctx.globalAlpha = pulseAlpha;
    drawText('Tap to Start', canvas.width / 2, safeTop + canvas.height * 0.52,
      Math.max(18, Math.floor(canvas.width * 0.05)), '#ffffff', 'center', false);
    ctx.globalAlpha = 1;
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    drawText('GAME OVER', cx, safeTop + canvas.height * 0.38,
      Math.max(32, Math.floor(canvas.width * 0.10)), '#ffffff', 'center', true);
    drawText(`Score: ${scoring.score}`, cx, safeTop + canvas.height * 0.49,
      Math.max(22, Math.floor(canvas.width * 0.06)), '#ffe600', 'center', false);
    drawText(`${scoring.hitsInRun} / ${THROWS_PER_RUN} throws landed`, cx, safeTop + canvas.height * 0.58,
      Math.max(16, Math.floor(canvas.width * 0.045)), 'rgba(255,255,255,0.7)', 'center', false);
    drawText('Tap to Restart', cx, safeTop + canvas.height * 0.68,
      Math.max(18, Math.floor(canvas.width * 0.05)), 'rgba(255,255,255,0.7)', 'center', false);
  }

  // --- Init ---
  window.addEventListener('resize', updateLayout);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastTimestamp = null;
  });
  updateLayout();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
